id = "the--\"yield-\"-expression-can-only-be-used-inside-a-function"
error = "The \\\"yield\\\" expression can only be used inside a function"
phpVersion = "5.5+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

yield 1;

?>"
description = "``yield`` is what turns a function into a generator: it can only appear inside a function body (a named function, a method, a closure, or an arrow function). Using it directly in the top-level script code -- outside of any function -- is meaningless, since there is no generator for it to belong to, and PHP rejects it at compile time.

The same error is raised for any ``yield`` (or ``yield from``) written at the top level of an included or required file, as long as it is not nested inside a function definition there."
alternative[] = "Wrap the code that needs to yield values inside a generator function, and call that function instead."
alternative[] = "Remove the yield statement if it was left over by mistake."
