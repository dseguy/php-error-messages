id = "iterator-%s-returned-an-invalid-value-(must-return-a-string,-a-stream,-or-an-splfileinfo-object)"
error = "Iterator %s returned an invalid value (must return a string, a stream, or an SplFileInfo object)"
phpVersion = "5.3+"
level = "E_ERROR"
exception = "UnexpectedValueException"
code = "<?php

class MyIterator implements Iterator {
    private array $items = ['a.txt', 42, 'b.txt'];
    private int $pos = 0;

    public function current(): mixed { return $this->items[$this->pos]; }
    public function key(): mixed { return $this->pos; }
    public function next(): void { $this->pos++; }
    public function rewind(): void { $this->pos = 0; }
    public function valid(): bool { return isset($this->items[$this->pos]); }
}

$phar = new PharData('/tmp/archive.tar');
$phar->buildFromIterator(new MyIterator());

?>"
description = "``Phar::buildFromIterator()`` (and ``PharData::buildFromIterator()``) adds one archive entry per value produced by the given iterator. Each value it receives must be either a ``string`` (the content of the file), a stream resource, or an ``SplFileInfo`` object (or subclass, such as ``SplFileObject``) pointing at the file to add; the corresponding key is used as the entry's path inside the archive.

If the iterator yields anything else, such as an integer, an array, or a plain object that is not an ``SplFileInfo``, PHP cannot turn it into archive content and throws this ``UnexpectedValueException``, naming the iterator's class."
alternative[] = "Make sure every value the iterator yields is a string, a stream resource, or an SplFileInfo (e.g. SplFileObject) instance."
alternative[] = "Use RecursiveDirectoryIterator or a similar built-in filesystem iterator, which naturally yields SplFileInfo objects."
related[] = ""
examples[] = "Iterator MyIterator returned an invalid value (must return a string, a stream, or an SplFileInfo object)"
