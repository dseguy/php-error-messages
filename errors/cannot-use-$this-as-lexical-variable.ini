id = "cannot-use-$this-as-lexical-variable"
error = "Cannot use $this as lexical variable"
phpVersion = "8.1+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class X {
    function foo() {
        $fn = function () use ($this) {
            return $this;
        };
    }
}

(new X)->foo();

?>"
description = "A lexical variable is a variable imported into a closure via the ``use`` clause. Since PHP 8.1, ``$this`` is automatically available inside all closures defined in an object context, so it is no longer allowed to explicitly import it as a lexical variable. This is also true for arrow functions, which implicitly capture ``$this`` when defined inside a method."
alternative[] = "Remove ``$this`` from the ``use`` clause, since it is automatically available in the closure."
alternative[] = "Use a ``static`` closure if ``$this`` is not needed."
related[] = "closures-in-constant-expressions-must-be-static"
related[] = "using-$this-when-not-in-object-context"
related[] = "cannot-use-auto-global-as-lexical-variable"
