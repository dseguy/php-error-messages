id = "passing-an-object-for-argument-#2-$option-to-deflate_init()-is-deprecated,-call-get_object_vars()-first-instead"
error = "Passing an object for argument #2 $option to deflate_init() is deprecated, call get_object_vars() first instead"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class Options {
    public int $level = 3;
}

$context = deflate_init(ZLIB_ENCODING_RAW, new Options());

?>"
description = "``deflate_init()``'s ``$options`` argument is documented as taking an associative array (``level``, ``memory``, ``window``, ``strategy``, ``dictionary``), but has always also accepted an object, reading the same keys off its public properties. PHP 8.6 deprecates passing an object here, matching the equivalent deprecation for ``inflate_init()``."
alternative[] = "Convert the object to an array first with ``get_object_vars($obj)`` and pass that as ``$options``."
alternative[] = "Pass an associative array literal instead of building an options object."
related[] = "passing-an-object-for-argument-#2-$option-to-inflate_init()-is-deprecated,-call-get_object_vars()-first-instead"
examples[] = ""
tags[] = "deprecation"
seeAlso[] = ""
features[] = "compression"
previous = ""
next = "passing-an-object-for-argument-#2-$option-to-inflate_init()-is-deprecated,-call-get_object_vars()-first-instead"
