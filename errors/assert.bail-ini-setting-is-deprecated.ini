id = "assert.bail-ini-setting-is-deprecated"
error = "assert.bail INI setting is deprecated"
phpVersion = "8.3+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

ini_set('assert.bail', '1');

?>"
description = "``assert.bail`` is a legacy INI directive from the pre-PHP 7 implementation of ``assert()``. When enabled, it terminated script execution as soon as a failed assertion was encountered, instead of letting the script continue.

This behavior is redundant with throwing an ``AssertionError`` (the default behavior since PHP 7 when ``assert.exception`` is enabled), which already interrupts execution unless the exception is caught. As part of the general cleanup of the legacy assertion configuration, ``assert.bail`` is now deprecated.

The deprecation notice is triggered whenever ``assert.bail`` is set to a truthy value, either in ``php.ini`` or through ``ini_set()``."
alternative[] = "Rely on the ``AssertionError`` exception thrown by failed assertions (controlled by ``assert.exception``) to stop execution, and catch it where appropriate."
alternative[] = "Remove ``ini_set()``/``ini_get()`` calls involving ``assert.bail`` from the code."
related[] = "assert.active-ini-setting-is-deprecated"
related[] = "assert.exception-ini-setting-is-deprecated"
related[] = "assert.warning-ini-setting-is-deprecated"
examples[] = ""
tags[] = ""
seeAlso[] = ""
features[] = "assertion"
features[] = "directive"
previous = "assert.active-ini-setting-is-deprecated"
next = "assert.exception-ini-setting-is-deprecated"
extension[] = "standard"
