id = "usage-of-session.referer_check-ini-setting-is-deprecated"
error = "Usage of session.referer_check INI setting is deprecated"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

ini_set('session.referer_check', 'example.com');

?>"
description = "``session.referer_check`` makes ``session_start()`` check that the ``Referer`` HTTP header sent by the client starts with a given substring, rejecting the session otherwise. This mechanism dates back to a time when it was considered a lightweight session-hijacking mitigation, but the ``Referer`` header is client-supplied and trivially spoofed, so it provides no real security guarantee.

As part of the deprecation of PHP's automatic, URL-based session ID propagation (also affecting ``session.use_trans_sid`` and related directives), setting ``session.referer_check`` to a non-empty value is deprecated as of PHP 8.4.0."
alternative[] = "Remove ``session.referer_check`` from ``php.ini`` and from the code; do not rely on the ``Referer`` header for session security."
alternative[] = "Use proper session security measures instead, such as regenerating the session ID on privilege change and binding sessions to other verified signals."
