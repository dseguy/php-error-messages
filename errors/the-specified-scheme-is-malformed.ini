id = "the-specified-scheme-is-malformed"
error = "The specified scheme is malformed"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "Uri\\InvalidUriException"
code = "<?php

$uri = Uri\Rfc3986\Uri::parse('https://example.com');

$uri = $uri->withScheme('');

?>"
description = "A URI scheme must be a non-empty string starting with a letter, followed only by letters, digits, ``+``, ``-`` or ``.`` (RFC 3986, section 3.1). ``Uri\\Rfc3986\\Uri::withScheme()`` and ``Uri\\Rfc3986\\UriBuilder::setScheme()`` validate this and throw when the value does not fit that grammar — including an empty string, as shown above.

The WHATWG-flavored ``Uri\\WhatWg\\Url::withScheme()`` reports the same message, though a *parse* failure (rather than a modification failure) additionally appends the specific WHATWG validation error in parentheses, e.g. ``The specified scheme is malformed (MissingSchemeNonRelativeUrl)``."
alternative[] = "Use a scheme made only of ASCII letters, digits, ``+``, ``-`` and ``.``, starting with a letter."
alternative[] = "Do not pass an empty string to withScheme() / setScheme()."
related[] = "the-specified-uri-is-malformed"
related[] = "failed-to-update-the-scheme"
