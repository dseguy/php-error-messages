id = "returning-null-from-%s::__debuginfo()-is-deprecated,-return-an-empty-array-instead"
error = "Returning null from %s::__debugInfo() is deprecated, return an empty array instead"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class X {
    public function __debugInfo(): ?array {
        return null;
    }
}

var_dump(new X);

?>"
description = "The ``__debugInfo()`` magic method allows a class to customize what ``var_dump()`` displays for its instances. When this method returns ``null``, PHP has historically treated it as an empty array, but the behavior was inconsistent.

Since PHP 8.4, returning ``null`` from ``__debugInfo()`` is deprecated. This deprecation ensures consistent behavior and explicit return types.

Returning an empty array ``[]`` achieves the same effect (hides all properties from ``var_dump()``) while being type-safe and unambiguous."
alternative[] = "Return an empty array ``[]`` instead of ``null`` from ``__debugInfo()``."
alternative[] = "Remove the ``__debugInfo()`` method entirely if you want the default ``var_dump()`` behavior."
alternative[] = "Return the array of properties you want to display: ``return ['key' => $this->value];``."
related[] = "method-%s::%s()-cannot-be-static"
related[] = "returning-null-from-%s::__debuginfo()-is-deprecated,-make-the-return-type-non-nullable-and-return-an-empty-array-instead"
examples[] = "Returning null from X::__debugInfo() is deprecated, return an empty array instead"
tags[] = "magic-method"
tags[] = "debugging"
tags[] = "deprecation"
seeAlso["debuginfo"] = "https://www.php.net/manual/en/language.oop5.magic.php#language.oop5.magic.debuginfo"
seeAlso["var_dump"] = "https://www.php.net/manual/en/function.var-dump.php"
features[] = "__debuginfo"
features[] = "var_dump"
features[] = "magic-method"
