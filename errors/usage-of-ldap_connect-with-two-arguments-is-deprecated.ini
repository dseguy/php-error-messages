id = "usage-of-ldap_connect-with-two-arguments-is-deprecated"
error = "Usage of ldap_connect with two arguments is deprecated"
phpVersion = "8.3+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

$ldap = ldap_connect('ldap.example.com', 389);

?>"
description = "``ldap_connect()`` used to accept a hostname and a port as two separate arguments. Passing them separately does not let the caller express whether the connection should use ``ldap://`` or ``ldaps://``, or list several servers at once, which a single LDAP URI can do naturally.

Calling ``ldap_connect()`` with a separate hostname and port is now deprecated in favor of passing a single LDAP URI."
alternative[] = "Pass a single LDAP URI instead, for example ``ldap_connect('ldap://ldap.example.com:389')`` or ``ldap_connect('ldaps://ldap.example.com')``."
related[] = "calling-ldap_connect()-with-oracle-specific-arguments-is-deprecated"
examples[] = ""
tags[] = "argument"
tags[] = "deprecated"
