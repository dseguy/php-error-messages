id = "syntax-error,-unexpected-token-\"public\",-expecting-\"]\""
error = "syntax error, unexpected token \"public\", expecting \"]\""
phpVersion = "7.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

$arr = [1, 2, 3];
$y = $arr[public];

?>"
description = "Inside the square brackets of an array index, PHP expects an expression identifying the key, followed by the closing ``]``. ``public`` is a reserved word: it can only be used as a visibility modifier, never as the start of an expression, such as an unquoted array key. PHP therefore reports that it was still expecting ``]`` to close the array access.

The same message also appears whenever a previous ``[`` was left unclosed, and a later, unrelated ``public`` is the first token that cannot continue the pending index expression."
alternative[] = "Quote the key if a string was intended: ``$arr['public']``."
alternative[] = "Use a constant or variable holding the intended key instead of the bare word."
alternative[] = "Check that every previous ``[`` in the file has a matching ``]``."
related[] = "syntax-error,-unexpected-token-\"::\",-expecting-\"]\""
related[] = "syntax-error,-unexpected-token-\"class\",-expecting-\"]\""
related[] = "syntax-error,-unexpected-token-\"if\",-expecting-\"]\""
