id = "cannot-directly-construct-directory,-use-dir()-instead"
error = "Cannot directly construct Directory, use dir() instead"
phpVersion = "7.0+"
level = "E_ERROR"
exception = "Error"
code = "<?php

$d = new Directory('.');

?>"
description = "``Directory`` is the object returned by the ``dir()`` function, giving access to ``path``, ``handle``, ``read()``, ``rewind()`` and ``close()``. It predates the rest of PHP's object model and is a thin, internal wrapper around a directory stream: it has no public constructor of its own.

Calling ``new Directory(...)`` directly is rejected, because the object needs to be initialized with an already-opened directory handle, something only ``dir()`` can set up correctly."
alternative[] = "Use ``dir($path)`` to obtain a ``Directory`` object."
alternative[] = "Use ``opendir()``, ``readdir()``, ``closedir()`` for a purely procedural approach instead of the ``Directory`` object."
alternative[] = "Use ``DirectoryIterator`` or ``RecursiveDirectoryIterator`` for an object-oriented, iterable interface."
related[] = "sqlite3result-cannot-be-directly-instantiated"
related[] = "the-sqlite3-object-has-not-been-correctly-initialised-or-is-already-closed"
examples[] = ""
tags[] = "non-instantiable"
