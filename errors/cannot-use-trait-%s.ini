id = "cannot-use-trait-%s"
error = "Cannot use trait %s"
phpVersion = "8.1+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

trait HasColor {
    const Red = 'red';
}

enum Color {
    use HasColor;

    case Red;
}

?>"
description = "An enum's cases and its constants share a single namespace: a case and a constant cannot have the same name, whether the constant is declared directly in the enum or brought in through a trait.

Here, the trait ``HasColor`` declares a constant called ``Red``, and the enum also declares a case called ``Red``; composing the enum with the trait would leave two different things answering to the same name, so PHP refuses to use the trait.

This entry records only the first sentence of the actual engine message, which continues with ``, because %s::%s conflicts with enum case %s::%s``, naming the trait, the constant, the enum and the case involved."
alternative[] = "Rename the constant in the trait so it no longer collides with the enum case."
alternative[] = "Rename the conflicting case in the enum."
alternative[] = "Stop using the trait in this enum, and declare the constant directly in the enum, merging it with the case some other way."
related[] = "%s-and-%s-define-the-same-constant-(%s)-in-the-composition-of-%s.-however,-the-definition-differs-and-is-considered-incompatible.-class-was-composed"
examples[] = "Cannot use trait HasColor, because HasColor::Red conflicts with enum case Color::Red"
