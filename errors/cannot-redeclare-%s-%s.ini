id = "cannot-redeclare-%s-%s"
error = "Cannot redeclare %s %s"
phpVersion = "4.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

interface Stringable {
}

?>"
description = "This is the general form of the class/interface/trait/enum redeclaration error, used specifically when the conflicting name is already taken by an internal symbol, one built into PHP itself or provided by a loaded extension, rather than by another user-defined file. Because internal classes and interfaces have no PHP source file or line number of their own, the message omits the ``(previously declared in ...)`` location that appears when the conflict is with another user-defined file.

The first placeholder is the kind of symbol (``class``, ``interface``, ``trait`` or ``enum``), the second is its name."
alternative[] = "Rename the declaration to avoid colliding with a built-in or extension-provided name."
alternative[] = "Wrap the declaration in a class_exists()/interface_exists()/trait_exists()/enum_exists() check, though this rarely helps for internal symbols since they are always present."
related[] = "cannot-redeclare-class-%s"
related[] = "cannot-redeclare-%s-%s-(previously-declared-in-%s:%d)"
examples[] = "Cannot redeclare interface Stringable"
examples[] = "Cannot redeclare class stdClass"
tags[] = "redeclare"
seeAlso[] = ""
features[] = "class"
features[] = "interface"
features[] = "trait"
features[] = "enum"
