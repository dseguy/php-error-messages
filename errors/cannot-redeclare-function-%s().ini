id = "cannot-redeclare-function-%s()"
error = "Cannot redeclare function %s()"
phpVersion = "5.5+"
level = "E_ERROR"
exception = ""
code = "<?php
// requires the Zend OPcache extension to be enabled

function foo() {}

?>"
description = "This variant of the function redeclaration error is raised by OPcache, when it merges a script's freshly compiled functions into its shared-memory function table and finds a name collision with a function that is already cached, but for which OPcache has no usable source location (for example, a function generated at runtime, or one whose original op_array metadata is otherwise unavailable). Because there is nothing meaningful to point at, the message omits the ``(previously declared in ...)`` part that the ordinary redeclaration error includes.

Functionally, this is the same constraint as the plain function redeclaration error: two functions cannot share the same name (case-insensitively) within the same namespace."
alternative[] = "Change the name of one of the two functions."
alternative[] = "Guard the declaration with function_exists() if the file may legitimately be included more than once."
alternative[] = "Use include_once or require_once instead of include or require."
related[] = "cannot-redeclare-function-%s()-(previously-declared-in-%s:%d)"
related[] = "cannot-redeclare-%s()-(previously-declared-in-%s:%d)"
examples[] = "Cannot redeclare function foo()"
tags[] = "redeclare"
tags[] = "opcache"
seeAlso[] = ""
features[] = "opcache"
previous = "cannot-redeclare-function-%s()-(previously-declared-in-%s:%d)"
next = ""
