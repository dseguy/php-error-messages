id = "cannot-use-%s()-on-dynamic-property-%ps::$%ps"
error = "Cannot use %s() on dynamic property %pS::$%pS"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ReflectionException"
code = "<?php

class Foo {}

$obj = new Foo();
$obj->bar = 1;

$prop = new ReflectionProperty($obj, 'bar');
$prop->setRawValueWithoutLazyInitialization($obj, 2);

?>"
description = "``ReflectionProperty::setRawValueWithoutLazyInitialization()`` and ``::skipLazyInitialization()`` are part of the lazy objects API (PHP 8.4): they work by reaching directly into the storage slot reserved for a *declared* property, bypassing the object's lazy initializer. A dynamic property (one added to a specific object at runtime rather than declared in its class) has no such reserved slot, so these methods have nothing to operate on and throw instead.

Since ``ReflectionProperty`` is constructed from a property name that may or may not correspond to an actual declared property on the given object, this can only be detected at call time, once the object is known."
alternative[] = "Only call setRawValueWithoutLazyInitialization()/skipLazyInitialization() for properties that are actually declared on the object's class, e.g. after checking ReflectionProperty::isDynamic() (or checking the object with property_exists() against the class declaration)."
related[] = "cannot-use-%s()-on-static-property-%ps::$%ps"
related[] = "cannot-use-%s()-on-virtual-property-%ps::$%ps"
related[] = "cannot-use-%s()-on-internal-class-%ps"
examples[] = "Cannot use setRawValueWithoutLazyInitialization() on dynamic property Foo::$bar"
examples[] = "Cannot use skipLazyInitialization() on dynamic property Foo::$bar"
tags[] = "reflection"
tags[] = "lazy-objects"
tags[] = "validation"
seeAlso[] = ""
