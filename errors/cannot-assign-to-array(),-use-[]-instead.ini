id = "cannot-assign-to-array(),-use-[]-instead"
error = "Cannot assign to array(), use [] instead"
phpVersion = "7.1+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

$data = [1, 2];
array($a, $b) = $data;

?>"
description = "array(...) is a language construct that builds a new array value; it does not designate a destructurable container the way list(...) or the short [...] syntax do, so it can never appear on the left-hand side of an assignment. This dedicated error exists to catch the common mistake of typing array(...) where list(...) was meant, and points directly to the short-syntax alternative."
alternative[] = "Use list(): list($a, $b) = $data;"
alternative[] = "Use the short destructuring syntax: [$a, $b] = $data;"
related[] = "cannot-mix-[]-and-list()"
examples[] = ""
tags[] = ""
seeAlso[] = ""
features[] = "destructuring"
