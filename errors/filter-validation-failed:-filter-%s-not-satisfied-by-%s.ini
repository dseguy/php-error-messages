id = "filter-validation-failed:-filter-%s-not-satisfied-by-%s"
error = "filter validation failed: filter %s not satisfied by '%s'"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "Filter\\FilterFailedException"
code = "<?php

filter_var('not-an-email', FILTER_VALIDATE_EMAIL, FILTER_THROW_ON_FAILURE);

?>"
description = "PHP 8.5 adds the ``FILTER_THROW_ON_FAILURE`` flag, usable with ``filter_var()``, ``filter_var_array()``, ``filter_input()`` and ``filter_input_array()``. When it is set and the chosen filter (e.g. ``FILTER_VALIDATE_EMAIL``) rejects the value, a ``Filter\\FilterFailedException`` is thrown instead of the function returning ``false``, naming both the filter and the offending value."
alternative[] = "Wrap the call in a try/catch and handle ``Filter\\FilterFailedException``."
alternative[] = "Do not pass FILTER_THROW_ON_FAILURE if you prefer to check the return value for ``false`` instead."
related[] = "filter-validation-failed:-not-an-array-(got-%s)"
related[] = "filter-validation-failed:-object-of-type-%s-has-no-__tostring()-method"
related[] = "cannot-use-both-filter_null_on_failure-and-filter_throw_on_failure"
examples[] = "filter validation failed: filter validate_email not satisfied by 'not-an-email'"
tags[] = "filter"
seeAlso[] = ""
features[] = "validation"
previous = ""
next = "filter-validation-failed:-not-an-array-(got-%s)"
extension[] = "filter"
