id = "input-number-is-larger-than-php_int_max,-precision-has-been-lost-in-conversion"
error = "Input number is larger than PHP_INT_MAX, precision has been lost in conversion"
phpVersion = "8.6+"
level = "E_NOTICE"
exception = ""
code = "<?php

echo hexdec('FFFFFFFFFFFFFFFF');

?>"
description = "``bindec()``, ``octdec()``, ``hexdec()`` and ``base_convert()`` all share the same internal conversion routine, which accumulates the result in a ``zend_long`` for as long as it fits, then switches to a ``double`` once the value would overflow. Once that switch happens, the number is only an approximation: a ``double`` only has 53 bits of mantissa, so digits beyond that are rounded away.

PHP 8.6 emits a notice the moment this switch occurs, to make the precision loss visible instead of silently returning an inexact float."
alternative[] = "Use the GMP or BCMath extensions to convert arbitrarily large numbers between bases without losing precision."
alternative[] = "Validate the input length against the base before conversion, so it is guaranteed to fit in a native integer."
related[] = ""
examples[] = "Input number is larger than PHP_INT_MAX, precision has been lost in conversion"
tags[] = "math"
tags[] = "precision"
seeAlso[] = ""
features[] = "base-conversion"
previous = ""
next = ""
extension[] = "standard"
analyzer[] = ""
changedBehavior[] = "Previously, bindec(), octdec(), hexdec() and base_convert() silently returned a float once the number no longer fit in an integer, without any indication that precision had been lost. As of PHP 8.6, this now emits an E_NOTICE."