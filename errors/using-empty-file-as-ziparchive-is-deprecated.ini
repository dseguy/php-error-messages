id = "using-empty-file-as-ziparchive-is-deprecated"
error = "Using empty file as ZipArchive is deprecated"
phpVersion = "8.0+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

\$path = tempnam(sys_get_temp_dir(), 'zip');
// tempnam() leaves an empty (0-byte) file behind.

\$zip = new ZipArchive();
\$zip->open(\$path, ZipArchive::CREATE);

?>"
description = "``ZipArchive::open()`` accepts an existing, empty (0-byte) file together with the ``ZipArchive::CREATE`` flag, in order to turn it into a fresh archive. This relied on treating a 0-byte file as an implicit, valid, empty archive.

Since libzip 1.6.0, the library underlying the zip extension no longer considers an empty file a valid archive on its own, and PHP has to work around that internally. As of PHP 8.0.0, doing so is deprecated. This is commonly triggered by patterns using ``tempnam()`` (which creates an empty placeholder file) before opening it as an archive."
alternative[] = "Delete the empty file before calling ``\$zip->open(\$path, ZipArchive::CREATE)``, so it does not exist yet."
alternative[] = "Use the ``ZipArchive::OVERWRITE`` flag (optionally combined with ``ZipArchive::CREATE``) instead of relying on an existing empty file."
related[] = ""
