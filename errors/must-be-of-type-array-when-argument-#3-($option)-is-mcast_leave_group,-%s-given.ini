id = "must-be-of-type-array-when-argument-#3-($option)-is-mcast_leave_group,-%s-given"
error = "must be of type array when argument #3 ($option) is MCAST_LEAVE_GROUP, %s given"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "TypeError"
code = "<?php

$socket = socket_create(AF_INET, SOCK_DGRAM, SOL_UDP);

socket_set_option($socket, IPPROTO_IP, MCAST_LEAVE_GROUP, 'not-an-array');

?>"
description = "When ``$option`` is ``MCAST_LEAVE_GROUP``, ``socket_set_option()`` expects ``$value`` (argument #4) to be an array (or an object, read as a property bag) describing the group to leave — with keys such as ``group`` and ``interface``. Passing anything else, such as the plain string above, is rejected before the request ever reaches the underlying ``setsockopt()`` call."
alternative[] = "Pass an array with the ``group`` (and, where applicable, ``interface``) keys expected for MCAST_LEAVE_GROUP."
alternative[] = "Consult the socket_set_option() documentation for the exact shape expected for this option."
related[] = "must-be-of-type-array-when-argument-#3-($option)-is-mcast_leave_source_group,-%s-given"
examples[] = "socket_set_option(): Argument #4 ($value) must be of type array when argument #3 ($option) is MCAST_LEAVE_GROUP, string given"
tags[] = "sockets"
tags[] = "networking"
tags[] = "validation"
seeAlso[] = ""
features[] = "multicast"
previous = ""
next = "must-be-of-type-array-when-argument-#3-($option)-is-mcast_leave_source_group,-%s-given"
