id = "calling-%ps()-with-a-given-object-that-is-not-an-instance-of-the-class-this-property-was-declared-in-is-deprecated"
error = "Calling %pS() with a given object that is not an instance of the class this property was declared in is deprecated"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class TestClass {
    public $pub2 = 5;
}

#[AllowDynamicProperties]
class AnotherClass {
}

$instanceWithNoProperties = new AnotherClass();
$propInfo = new ReflectionProperty('TestClass', 'pub2');

$propInfo->setValue($instanceWithNoProperties, 'NewValue');

?>"
description = "``ReflectionProperty::setValue()`` and ``ReflectionProperty::setRawValue()`` take the target object as their first argument. When that object is not an instance of the class (or a subclass of it) the property was declared on, the write silently falls back to creating a dynamic property on the unrelated object instead of failing. PHP 8.6 deprecates this mismatch, since it almost always indicates the wrong ``$propInfo`` or the wrong object was used."
alternative[] = "Only call setValue() / setRawValue() with an object that is an instance of the class the ReflectionProperty was created for."
alternative[] = "Use ``instanceof`` to verify the object before calling setValue() if it is not known statically."
related[] = "calling-%ps()-for-static-method-%ps::%ps()-does-not-need-an-object-parameter"
examples[] = "Calling ReflectionProperty::setValue() with a given object that is not an instance of the class this property was declared in is deprecated"
examples[] = "Calling ReflectionProperty::setRawValue() with a given object that is not an instance of the class this property was declared in is deprecated"
tags[] = "reflection"
tags[] = "deprecation"
seeAlso[] = ""
features[] = "reflection"
