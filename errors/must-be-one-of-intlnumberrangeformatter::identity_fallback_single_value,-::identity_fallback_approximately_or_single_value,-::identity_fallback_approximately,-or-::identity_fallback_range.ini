id = "must-be-one-of-intlnumberrangeformatter::identity_fallback_single_value,-::identity_fallback_approximately_or_single_value,-::identity_fallback_approximately,-or-::identity_fallback_range"
error = "must be one of IntlNumberRangeFormatter::IDENTITY_FALLBACK_SINGLE_VALUE, ::IDENTITY_FALLBACK_APPROXIMATELY_OR_SINGLE_VALUE, ::IDENTITY_FALLBACK_APPROXIMATELY, or ::IDENTITY_FALLBACK_RANGE"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

IntlNumberRangeFormatter::createFromSkeleton(
    '',
    'en',
    IntlNumberRangeFormatter::COLLAPSE_AUTO,
    999
);

?>"
description = "``IntlNumberRangeFormatter::createFromSkeleton()`` builds a formatter for numeric ranges (such as ``3-5``). Its ``identityFallback`` argument tells ICU what to do when the range's start and end turn out to be identical after formatting, and only four such fallback strategies exist: ``IDENTITY_FALLBACK_SINGLE_VALUE``, ``IDENTITY_FALLBACK_APPROXIMATELY_OR_SINGLE_VALUE``, ``IDENTITY_FALLBACK_APPROXIMATELY``, and ``IDENTITY_FALLBACK_RANGE``.

Passing any other integer raises a ``ValueError``, since ICU's range formatter has no other identity-fallback behavior to fall back to."
alternative[] = "Pass one of ``IntlNumberRangeFormatter::IDENTITY_FALLBACK_SINGLE_VALUE``, ``::IDENTITY_FALLBACK_APPROXIMATELY_OR_SINGLE_VALUE``, ``::IDENTITY_FALLBACK_APPROXIMATELY``, or ``::IDENTITY_FALLBACK_RANGE`` as the ``identityFallback`` argument."
related[] = ""
examples[] = "IntlNumberRangeFormatter::createFromSkeleton(): Argument #4 ($identityFallback) must be one of IntlNumberRangeFormatter::IDENTITY_FALLBACK_SINGLE_VALUE, IntlNumberRangeFormatter::IDENTITY_FALLBACK_APPROXIMATELY_OR_SINGLE_VALUE, IntlNumberRangeFormatter::IDENTITY_FALLBACK_APPROXIMATELY, or IntlNumberRangeFormatter::IDENTITY_FALLBACK_RANGE"
