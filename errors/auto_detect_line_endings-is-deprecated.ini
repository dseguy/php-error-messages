id = "auto_detect_line_endings-is-deprecated"
error = "auto_detect_line_endings is deprecated"
phpVersion = "8.1+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

ini_set('auto_detect_line_endings', '1');

$fp = fopen('data.txt', 'r');
$line = fgets($fp);

?>"
description = "The ``auto_detect_line_endings`` ini directive tells ``fgets()``, ``file()`` and ``fgetss()`` to look at the first few lines of a file to detect the classic Mac OS (pre-OS X) ``\r``-only line ending convention, and adjust the line-splitting logic accordingly.

Classic Mac OS line endings are essentially extinct, so keeping this detection logic around adds a runtime cost and a behavioral surprise for very little benefit. The directive is deprecated, and setting it to a truthy value now raises a deprecation notice; it will be removed entirely in PHP 9.0."
alternative[] = "Leave ``auto_detect_line_endings`` at its default (disabled) value."
alternative[] = "If ``\r``-only line endings must be supported, read the whole file with ``file_get_contents()`` and split it with a regular expression that matches ``\r\n``, ``\r`` or ``\n``, such as ``preg_split('/\\r\\n|\\r|\\n/', $contents)``."
