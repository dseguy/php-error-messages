id = "the-maximum-representable-range-is-2_147_483_647-seconds-(roughly-68-years)"
error = "The maximum representable range is 2_147_483_647 seconds (roughly 68 years)"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "Time\\TimeException"
code = "<?php

use Time\Duration;

// on a 32-bit build of PHP
$duration = Duration::fromSeconds(3_000_000_000);

?>"
description = "PHP 8.6 introduces ``Time\\Duration``, a value object representing a span of time as whole seconds plus nanoseconds. Internally, the number of seconds is validated so that the whole duration, expressed in nanoseconds, still fits in a single platform integer (``zend_long``).

On a 32-bit build of PHP, where ``zend_long`` is only 32 bits wide, that ties the maximum number of seconds to ``PHP_INT_MAX`` on that platform: ``2_147_483_647`` seconds, or roughly 68 years. Passing a larger value throws a ``Time\\TimeException``. On 64-bit builds, the equivalent, larger limit is described separately (see ``the-maximum-representable-range-is-9_223_372_035-seconds-(roughly-292-years)``)."
alternative[] = "Keep durations built from Duration::fromSeconds() (or the constructor) within PHP_INT_MAX seconds for the target platform."
alternative[] = "On 32-bit systems, split very long spans of time into smaller Duration values, or use DateInterval instead."
related[] = "the-maximum-representable-range-is-9_223_372_035-seconds-(roughly-292-years)"
examples[] = "The maximum representable range is 2_147_483_647 seconds (roughly 68 years)"
