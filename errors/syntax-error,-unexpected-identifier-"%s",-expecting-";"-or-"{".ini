id = "syntax-error,-unexpected-identifier-\"%s\",-expecting-\";\"-or-\"{\""
error = "syntax error, unexpected identifier \"%s\", expecting \";\" or \"{\""
phpVersion = "7.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

abstract class X {
    abstract function foo() bar;
}

?>"
description = "An abstract method's signature must be terminated with a semicolon, since it has no body, and a concrete method's signature must be followed by a ``{`` opening the body. Here, an extra identifier was found right after the closing parenthesis of the argument list, where PHP expected one of those two terminators.

This typically happens when a return type declaration is missing its leading colon, or when a stray word was left over after editing the signature."
alternative[] = "If a return type was intended, add a colon before it: ``abstract function foo(): bar;``."
alternative[] = "Remove the extra identifier."
alternative[] = "If the method should have a body, replace the identifier with ``{`` and the method's code."
related[] = "syntax-error,-unexpected-identifier-\"%s\",-expecting-\"(\""
related[] = "syntax-error,-unexpected-variable-\"$this\",-expecting-\";\"-or-\"{\""
examples[] = "syntax error, unexpected identifier \"bar\", expecting \";\" or \"{\""
tags[] = "syntax-error"
seeAlso[] = ""
features[] = "abstract"
features[] = "method"
