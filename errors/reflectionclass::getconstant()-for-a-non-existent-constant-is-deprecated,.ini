id = "reflectionclass::getconstant()-for-a-non-existent-constant-is-deprecated,"
error = "ReflectionClass::getConstant() for a non-existent constant is deprecated, use ReflectionClass::hasConstant() to check if the constant exists"
phpVersion = "8.5+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class X {
    const FOO = 1;
}

$class = new ReflectionClass(X::class);
$value = $class->getConstant('BAR');
var_dump($value);

?>"
description = "``ReflectionClass::getConstant()`` returns ``false`` both when the requested constant does not exist and when the constant's actual value is ``false``, so the return value alone cannot tell the two cases apart. Calling it for a constant that does not exist is now deprecated in favour of an explicit existence check."
alternative[] = "Call ``ReflectionClass::hasConstant()`` first, and only call ``getConstant()`` once existence is confirmed."
related[] = ""
related[] = "reflectionproperty::getdefaultvalue()-for-a-property-without-a-default-value-is-deprecated,"
examples[] = "ReflectionClass::getConstant() for a non-existent constant is deprecated, use ReflectionClass::hasConstant() to check if the constant exists"
tags[] = "reflection"
tags[] = "deprecation"
seeAlso[ReflectionClass::getConstant] = "https://www.php.net/manual/en/reflectionclass.getconstant.php"
seeAlso[ReflectionClass::hasConstant] = "https://www.php.net/manual/en/reflectionclass.hasconstant.php"
features[] = "reflection"
features[] = "constant"
previous = ""
next = ""
extension[] = "reflection"
analyzer[] = ""
changedBehavior[] = "ReflectionClass::getConstant"
