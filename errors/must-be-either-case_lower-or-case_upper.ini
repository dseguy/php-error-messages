id = "must-be-either-case_lower-or-case_upper"
error = "must be either CASE_LOWER or CASE_UPPER"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

$array = ['FOO' => 1, 'BAR' => 2];

array_change_key_case($array, 2);

?>"
description = "``array_change_key_case()`` converts every string key of an array to either all-lowercase or all-uppercase. Its second argument only accepts two values: ``CASE_LOWER`` (the default) or ``CASE_UPPER``.

Previously, passing any other integer was silently treated as ``CASE_LOWER``. As of PHP 8.6, the function validates the argument up front and throws a ``ValueError`` for anything else, instead of quietly falling back to the default."
alternative[] = "Pass either ``CASE_LOWER`` or ``CASE_UPPER`` as the second argument to ``array_change_key_case()``."
related[] = ""
examples[] = "array_change_key_case(): Argument #2 ($case) must be either CASE_LOWER or CASE_UPPER"
tags[] = "arrays"
tags[] = "validation"
seeAlso[] = ""
features[] = "array-key-case"
previous = ""
next = ""
extension[] = "standard"
analyzer[] = ""
changedBehavior[] = "Previously, any value other than ``CASE_UPPER`` was silently treated as ``CASE_LOWER``."
