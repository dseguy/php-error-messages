id = "cannot-use-$this-as-static-variable"
error = "Cannot use $this as static variable"
phpVersion = "5.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class X {
    public function foo() {
        static $this;
    }
}

?>"
description = "``$this`` is a special variable, automatically bound to the current object inside a method. It cannot be redefined, in particular by making it a ``static`` variable, which would give it a persistent value between calls and remove its automatic binding to the object.

This is checked at compile time, whether the method is ever called or not."
alternative[] = "Use another variable name for the static variable."
alternative[] = "Store the required data in a property of the object instead."
related[] = "cannot-use-$this-as-parameter"
