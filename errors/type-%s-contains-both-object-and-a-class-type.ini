related[] = "duplicate-type-%s-is-redundant"
related[] = "type-%s-cannot-be-part-of-an-intersection-type"
related[] = "type-%s-is-redundant-as-it-is-more-restrictive-than-type-%s"
examples[] = "Type Test|object contains both object and a class type, which is redundant"
