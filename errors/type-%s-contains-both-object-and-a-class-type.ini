id = "type-%s-contains-both-object-and-a-class-type"
error = "Type %s contains both object and a class type"
phpVersion = "8.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function test(): object|Test {
}

?>"
description = "The ``object`` type already matches an instance of any class. Adding a specific class name next to it in a union type, such as ``object|Test``, does not widen what is accepted: every value that matches ``Test`` already matches ``object``. PHP detects this redundancy purely from the type names, without needing ``Test`` to be defined or loaded.

The full message reads: ``Type %s contains both object and a class type, which is redundant``."
alternative[] = "Remove the specific class name, and keep only ``object``."
alternative[] = "Remove ``object``, and keep only the specific class name, if that narrower type is what is actually intended."
related[] = "type-%s-contains-both-iterable-and-array"
