id = "making-a-constructor-a-generator-is-deprecated"
error = "Making a constructor a Generator is deprecated"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class X {
    public function __construct() {
        yield 1;
    }
}

new X;

?>"
description = "Using ``yield`` anywhere in the body of ``__construct()`` turns it into a Generator function. Because a Generator's body only starts running once it is iterated (and nothing iterates a constructor), the code inside such a constructor never runs when the object is created with ``new``: initialization is silently skipped.

Since this pattern is virtually always a mistake, PHP 8.6 deprecates making a constructor a Generator."
alternative[] = "Move the code that uses ``yield`` into a separate, regular method, and call it (or return its Generator) explicitly instead of relying on ``__construct()``."
alternative[] = "If the constructor only needs to assign properties, replace ``yield`` with plain assignments."
related[] = "making-a-destructor-a-generator-is-deprecated"
