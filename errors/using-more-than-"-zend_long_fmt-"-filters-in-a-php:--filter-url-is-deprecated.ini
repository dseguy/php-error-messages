id = "using-more-than-\"-zend_long_fmt-\"-filters-in-a-php:--filter-url-is-deprecated"
error = "Using more than \" ZEND_LONG_FMT \" filters in a php://filter URL is deprecated"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

$filters = str_repeat('string.toupper|', 17) . 'string.toupper';

echo file_get_contents(\"php://filter/$filters/resource=data:text/plain,hello\");

?>"
description = "A ``php://filter/...`` URL can chain any number of stream filters with ``|``. To bound the cost of building very long chains, PHP now caps the number of filters read from a single URL at 16 (``ZEND_LONG_FMT`` is a printf-style placeholder for a platform-independent long integer, substituted with ``16`` in the actual message) unless a higher limit is configured explicitly. Exceeding that default without configuring it emits this deprecation; a future version will make the limit a hard error instead."
alternative[] = "Set the stream context option ``filter`` => ``max_filter_count`` to the number of filters you actually need, e.g. via ``stream_context_create(['filter' => ['max_filter_count' => 32]])``."
alternative[] = "Build the chain with repeated stream_filter_append() calls instead of a long php://filter URL; it is not subject to this limit."
related[] = ""
examples[] = "Using more than 16 filters in a php://filter URL is deprecated, set this limit using the stream context option max_filter_count, or use stream_filter_append"
tags[] = "deprecation"
tags[] = "streams"
seeAlso[] = ""
features[] = "stream-filter"
previous = ""
next = ""
extension[] = "standard"
analyzer[] = ""
changedBehavior[] = ""