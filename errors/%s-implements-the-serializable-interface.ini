id = "%s-implements-the-serializable-interface"
error = "%s implements the Serializable interface"
phpVersion = "8.1+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class Foo implements Serializable {
    public function serialize(): string {
        return '';
    }

    public function unserialize($data): void {
    }
}

new Foo;

?>"
description = "The ``Serializable`` interface (``serialize()``/``unserialize()``) was PHP's original hook for customizing object serialization, but it has a well-known flaw: it cannot represent the identity and reference structure of nested objects correctly, which is why ``__serialize()``/``__unserialize()`` were introduced in PHP 7.4 as a full replacement.

As of PHP 8.1, any *non-abstract* class that implements ``Serializable`` without also implementing both ``__serialize()`` and ``__unserialize()`` emits this deprecation notice as soon as the class is declared (not just when an instance is serialized). A class that implements ``Serializable`` *and* the two magic methods is not affected -- that combination remains the recommended way to support both old and new PHP versions."
alternative[] = "Replace serialize()/unserialize() with __serialize(): array and __unserialize(array $data): void."
alternative[] = "If backward compatibility with PHP < 7.4 is required, keep implementing Serializable but also add __serialize() and __unserialize() -- only the interface without the magic methods triggers the notice."
alternative[] = "Drop custom serialization handling entirely if the default property-based serialization is sufficient."
related[] = "enum-%s-cannot-implement-the-serializable-interface"
related[] = "the-pdo::fetch_serialize-mode-is-deprecated"
examples[] = "Foo implements the Serializable interface, which is deprecated. Implement __serialize() and __unserialize() instead (or in addition, if support for old PHP versions is necessary)"
tags[] = "deprecation"
tags[] = "serialize"
seeAlso[PHP RFC: Phasing out Serializable] = "https://wiki.php.net/rfc/phase_out_serializable"
seeAlso[Serializable manual] = "https://www.php.net/manual/en/class.serializable.php"
