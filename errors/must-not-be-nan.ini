id = "must-not-be-nan"
error = "must not be NAN"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

clamp(5, NAN, 10);

?>"
description = "PHP 8.6's ``clamp()`` function returns ``$value`` restricted to the range ``[$min, $max]``. Comparing anything against ``NAN`` never produces a meaningful ordering, so ``$min`` and ``$max`` cannot be ``NAN``.

Passing ``NAN`` as either bound throws a ``ValueError`` naming the offending argument, instead of returning an unpredictable result."
alternative[] = "Do not pass ``NAN`` as the ``$min`` or ``$max`` argument to ``clamp()``; validate floating-point bounds with ``is_nan()`` first if they come from an untrusted source."
related[] = "must-be-smaller-than-or-equal-to-argument-#3-($max)"
examples[] = "clamp(): Argument #2 ($min) must not be NAN"
examples[] = "clamp(): Argument #3 ($max) must not be NAN"
