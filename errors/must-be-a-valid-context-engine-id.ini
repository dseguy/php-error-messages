id = "must-be-a-valid-context-engine-id"
error = "must be a valid context engine ID"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

$snmp = new SNMP(SNMP::VERSION_3, 'localhost', 'user');

$snmp->setSecurity('authPriv', 'SHA', 'authpass', 'AES', 'privpass', '', 'not-hex');

?>"
description = "``SNMP::setSecurity()``'s ``$contextEngineId`` argument is expected to be a hex-encoded SNMPv3 context engine ID, which the extension decodes back to raw bytes before handing it to the underlying Net-SNMP session.

As of PHP 8.6, a value that cannot be decoded as hex throws a ``ValueError``, instead of silently leaving the context engine ID unset on the session."
alternative[] = "Pass a valid hex-encoded string as the $contextEngineId argument to SNMP::setSecurity(), or omit it to leave the context engine ID unset."
related[] = ""
examples[] = "SNMP::setSecurity(): Argument #7 ($contextEngineId) must be a valid context engine ID"
tags[] = "snmp"
tags[] = "networking"
tags[] = "validation"
seeAlso[] = ""
features[] = "snmp-security"
previous = ""
next = ""
extension[] = "snmp"
analyzer[] = ""
changedBehavior[] = "Previously, this emitted an E_WARNING (\"Bad engine ID value '%s'\") and left the context engine ID unset, instead of throwing."
