id = "cannot-use--\"parent-\"-when-current-class-scope-has-no-parent"
error = "Cannot use \\\"parent\\\" when current class scope has no parent"
phpVersion = "8.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class Foo {
    public function bar() {
        parent::bar();
    }
}

?>"
description = "``parent::`` refers to the parent of the class currently being defined. It can only be used inside a class that actually extends another class.

Using ``parent::`` in a class that has no parent (no ``extends`` clause) used to only trigger a deprecation notice, in PHP 7.4. Since PHP 8.0, it is a compile time fatal error.

This differs from using ``parent::`` completely outside of any class scope, which is a separate error."
alternative[] = "Make the class extend a parent class."
alternative[] = "Remove the ``parent::`` call, and implement the logic directly in the method."
