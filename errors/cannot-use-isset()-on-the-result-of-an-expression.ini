id = "cannot-use-isset()-on-the-result-of-an-expression"
error = "Cannot use isset() on the result of an expression"
phpVersion = "7.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

$a = 'a';
$b = 'b';

if (isset($a . $b)) {}

// recommended alternative
if ($a . $b !== null) {}

?>"
description = "isset() checks whether a data container, such as a variable, an array element or an object property, exists and is not null; it needs an actual container to look up, not a computed value. Concatenating $a and $b produces a plain expression with no container behind it, so isset() cannot be applied to it directly."
alternative[] = "Compare the expression to null instead: $a . $b !== null."
related[] = "cannot-use-isset()-on-the-result-of-an-expression-(you-can-use-\"null-!==-expression\"-instead)"
examples[] = ""
