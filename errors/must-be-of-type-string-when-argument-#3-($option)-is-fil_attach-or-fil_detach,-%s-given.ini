id = "must-be-of-type-string-when-argument-#3-($option)-is-fil_attach-or-fil_detach,-%s-given"
error = "must be of type string when argument #3 ($option) is FIL_ATTACH or FIL_DETACH, %s given"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "TypeError"
code = "<?php

$socket = socket_create(AF_INET, SOCK_STREAM, SOL_FILTER);

socket_set_option($socket, SOL_FILTER, FIL_ATTACH, 123);

?>"
description = "``FIL_ATTACH`` and ``FIL_DETACH`` (used with the ``SOL_FILTER`` level, on platforms that support BSD accept/receive filters) name the filter to attach or detach as a string. ``socket_set_option()`` requires ``$value`` (argument #4) to be a string for these two options; any other type, such as the integer above, is rejected."
alternative[] = "Pass the filter name as a string."
alternative[] = "Consult your platform's setsockopt(2)/SOL_FILTER documentation for valid filter names."
related[] = "must-be-of-type-string-when-argument-#3-($option)-is-so_acceptfilter,-%s-given"
examples[] = "socket_set_option(): Argument #4 ($value) must be of type string when argument #3 ($option) is FIL_ATTACH or FIL_DETACH, int given"
tags[] = "sockets"
tags[] = "networking"
tags[] = "validation"
seeAlso[] = ""
features[] = "socket-options"
