id = "the-specified-%s-is-malformed%s%s%s"
error = "The specified %s is malformed%s%s%s"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "Uri\\InvalidUriException"
code = "<?php

use Uri\Rfc3986\Uri;

try {
    $uri = new Uri('https:// example.com');
} catch (\Uri\InvalidUriException $e) {
    echo $e->getMessage();
}

?>"
description = "This is the detailed variant of the parsing error raised by the native URI extension, introduced in PHP 8.5, when a string handed to ``Uri\\Rfc3986\\Uri`` or ``Uri\\WhatWg\\Url`` cannot be parsed as a valid URI/URL. In addition to naming what was being parsed (``URI`` or ``URL``), the extra placeholders append the detailed diagnostic produced by the underlying parser, such as the specific validation error and, when possible, a pointer to the offending part of the string."
alternative[] = "Fix the malformed component reported in the exception message before constructing the URI."
alternative[] = "Validate or normalize untrusted input before passing it to the ``Uri`` classes."
alternative[] = "Call ``Uri\\InvalidUriException::getErrors()`` to inspect the individual validation errors programmatically."
related[] = "the-specified-%s-is-malformed"
examples[] = ""
tags[] = "uri"
seeAlso[] = ""
features[] = "uri"
previous = ""
next = ""
extension[] = "uri"
analyzer[] = ""
changedBehavior[] = ""
