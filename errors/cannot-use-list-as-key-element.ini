id = "cannot-use-list-as-key-element"
error = "Cannot use list as key element"
phpVersion = "7.1+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

$array = [['a', 'b'], 'c', 'd'];

foreach ($array as list($key) => $value) {
}

?>"
description = "Since PHP 7.1, ``foreach`` can destructure the value of each entry with ``list()`` (or its short ``[]`` syntax): ``foreach ($array as $key => list($a, $b))``. The key part, on the other hand, is always a single target: a variable, a property, or an array offset. It cannot itself be a ``list()`` pattern, since a single array key has nothing to be destructured into several variables."
alternative[] = "Use a plain variable for the key, and only destructure the value with ``list()``."
related[] = "cannot-use-list()-as-standalone-expression"
examples[] = "Cannot use list as key element"
tags[] = "list"
tags[] = "foreach"
