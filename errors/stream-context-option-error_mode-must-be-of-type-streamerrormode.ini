id = "stream-context-option-error_mode-must-be-of-type-streamerrormode"
error = "stream context option error_mode must be of type StreamErrorMode"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "TypeError"
code = "<?php

$context = stream_context_create([
    'stream' => ['error_mode' => 'exception'],
]);

file_get_contents('https://example.invalid/', false, $context);

?>"
description = "PHP 8.6 adds a ``stream`` context option, ``error_mode``, that controls how errors raised by a stream operation are reported. It must be one of the cases of the ``StreamErrorMode`` enum: ``StreamErrorMode::Error`` (the default, standard PHP warnings/notices), ``StreamErrorMode::Exception`` (throw a ``StreamException`` for terminating errors), or ``StreamErrorMode::Silent`` (suppress error output entirely).

Passing anything other than a ``StreamErrorMode`` case, such as a plain string, throws a ``TypeError`` when the stream operation reads the option, instead of the option being silently ignored."
alternative[] = "Pass one of the StreamErrorMode enum cases, e.g. StreamErrorMode::Exception, instead of a string or other value."
related[] = "stream-context-option-error_store-must-be-of-type-streamerrorstore"
related[] = "stream-error-handler-must-be-a-valid-callback,-%s"
examples[] = "stream context option 'error_mode' must be of type StreamErrorMode"
