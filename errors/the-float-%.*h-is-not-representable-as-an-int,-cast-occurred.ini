id = "the-float-%.*h-is-not-representable-as-an-int,-cast-occurred"
error = "The float %.*H is not representable as an int, cast occurred"
phpVersion = "7.0+"
level = "E_WARNING"
exception = ""
code = "<?php

var_dump((int) 1.0E+20);
// int(0) on 64-bit, and the value bears no relation to 1.0E+20

var_dump((int) NAN);
// int(0)

var_dump((int) INF);
// int(0)

?>"
description = "When a ``float`` is cast to ``int`` -- explicitly with ``(int)``/``intval()``, or implicitly wherever an integer is required, such as an array offset or a bitwise operator -- and the value is outside the range representable by ``PHP_INT_MIN``/``PHP_INT_MAX``, or is ``NAN`` or ``INF``, PHP cannot produce a meaningful integer.

Rather than silently returning an arbitrary or platform-dependent bit pattern, PHP emits this warning and returns ``0`` for ``NAN``/``INF``, or a value obtained by taking the float modulo the 64-bit integer range for very large finite values -- in both cases, a value with no reliable relationship to the original float."
alternative[] = "Check the float against ``PHP_INT_MIN``/``PHP_INT_MAX`` (and against ``is_nan()``/``is_infinite()``) before casting it."
alternative[] = "Keep the value as a ``float`` or as a string if it may exceed the integer range."
alternative[] = "Use ``BCMath`` or ``GMP`` if arbitrary-precision integers are required."
related[] = "the-float-string--\"%s-\"-is-not-representable-as-an-int,-cast-occurred"
related[] = "implicit-conversion-from-float-%.*h-to-int-loses-precision"
examples[] = "The float 1.0E+20 is not representable as an int, cast occurred"
examples[] = "The float NAN is not representable as an int, cast occurred"
examples[] = "The float INF is not representable as an int, cast occurred"
tags[] = ""
seeAlso[] = ""
features[] = "cast"
features[] = "float"
features[] = "integer"
