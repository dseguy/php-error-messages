id = "using-more-than-%d-filters-in-a-php:--filter-url-is-deprecated"
error = "Using more than %d filters in a php://filter URL is deprecated"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

$filters = implode('|', array_fill(0, 17, 'string.toupper'));

// deprecated: more than 16 filters chained directly in the URL
$data = file_get_contents(\"php://filter/read=$filters/resource=php://memory\");

?>"
description = "The ``php://filter`` stream wrapper lets several conversion filters be chained in a single URL, separated by ``|``. By default, PHP now limits the number of filters that can be chained this way to 16; exceeding that limit triggers this deprecation, and a future version is expected to turn it into a hard failure.

The limit only applies to filters listed directly in a ``php://filter`` URL. It does not affect filters added programmatically with ``stream_filter_append()``, nor is it lowered unless a smaller ``max_filter_count`` is explicitly configured on the stream context (in which case exceeding it already fails immediately, without this deprecation).

Restricting the default chain length also mitigates a known exploitation technique (\"PHP filter chains\") that abuses very long filter chains to convert an arbitrary-read vulnerability into code execution by repeatedly transcoding a string in memory."
alternative[] = "Raise or override the default limit by setting the ``filter.max_filter_count`` stream context option, e.g. ``stream_context_create(['filter' => ['max_filter_count' => 100]])``."
alternative[] = "Use ``stream_filter_append()`` to add filters programmatically instead of chaining a long list of them in the URL."
alternative[] = "Reduce the number of chained filters if the default of 16 is sufficient."
related[] = "cannot-use-both-filter_null_on_failure-and-filter_throw_on_failure"
examples[] = "Using more than 16 filters in a php://filter URL is deprecated"
tags[] = "stream"
tags[] = "php://filter"
