tags[] = "deprecation"
seeAlso[php://filter] = "https://www.php.net/manual/en/wrappers.php.php#wrappers.php.filter"
seeAlso[stream_filter_append] = "https://www.php.net/manual/en/function.stream-filter-append.php"
seeAlso[stream_context_create] = "https://www.php.net/manual/en/function.stream-context-create.php"
