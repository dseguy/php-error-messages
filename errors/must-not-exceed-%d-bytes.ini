id = "must-not-exceed-%d-bytes"
error = "must not exceed %d bytes"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

$psk = new Openssl\\Psk(str_repeat('a', 300));

?>"
description = "PHP 8.6 introduces ``Openssl\\Psk``, which holds a pre-shared key (and an optional identity) used to authenticate TLS connections without a certificate. OpenSSL itself imposes fixed limits on both fields: a PSK cannot exceed ``Openssl\\Psk::MAX_PSK_LEN`` (256) bytes, and an identity cannot exceed ``Openssl\\Psk::MAX_IDENTITY_LEN`` (128) bytes.

Passing a longer string to ``Openssl\\Psk::__construct()`` throws a ``ValueError`` for the offending argument instead of silently truncating the key or identity."
alternative[] = "Keep the pre-shared key to 256 bytes or fewer, and the identity to 128 bytes or fewer."
alternative[] = "Use ``Openssl\\Psk::MAX_PSK_LEN`` and ``Openssl\\Psk::MAX_IDENTITY_LEN`` to validate lengths before constructing the object."
related[] = "must-be-openssl_encoding_der-or-openssl_encoding_pem"
examples[] = "Openssl\\Psk::__construct(): Argument #1 ($psk) must not exceed 256 bytes"
tags[] = "openssl"
tags[] = "tls"
tags[] = "validation"
seeAlso[] = ""
features[] = "tls-psk"
