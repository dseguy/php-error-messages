id = "stream-context-option-error_store-must-be-of-type-streamerrorstore"
error = "stream context option error_store must be of type StreamErrorStore"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "TypeError"
code = "<?php

$context = stream_context_create([
    'stream' => ['error_store' => 'all'],
]);

file_get_contents('https://example.invalid/', false, $context);

?>"
description = "PHP 8.6 adds a ``stream`` context option, ``error_store``, that controls which errors raised during a stream operation are kept for later retrieval. It must be one of the cases of the ``StreamErrorStore`` enum: ``Auto`` (the default, decides based on ``error_mode``), ``None``, ``NonTerminating``, ``Terminating``, or ``All``.

Passing anything other than a ``StreamErrorStore`` case throws a ``TypeError`` when the stream operation reads the option; PHP then falls back to deciding the store mode automatically from ``error_mode``, but still reports the misuse."
alternative[] = "Pass one of the StreamErrorStore enum cases, e.g. StreamErrorStore::All, instead of a string or other value."
related[] = "stream-context-option-error_mode-must-be-of-type-streamerrormode"
related[] = "stream-error-handler-must-be-a-valid-callback,-%s"
examples[] = "stream context option 'error_store' must be of type StreamErrorStore"
tags[] = "streams"
tags[] = "validation"
