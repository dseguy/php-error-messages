id = "unserialization-of-%s-is-not-allowed,-override-__serialize()-and-__unserialize()-to-implement-it"
error = "Unserialization of %s is not allowed, override __serialize() and __unserialize() to implement it"
phpVersion = "7.4+"
level = "E_ERROR"
exception = "Exception"
code = "<?php

$serialized = 'O:3:"PDO":0:{}';

$pdo = unserialize($serialized);

?>"
description = "This is the mirror error of the serialization one. Some internal classes hold state, such as a connection handle or a resource, that cannot be meaningfully rebuilt from a plain serialized string. Unless the class implements ``__serialize()`` and ``__unserialize()`` (available since PHP 7.4) to define its own restoration logic, ``unserialize()`` refuses to instantiate the object from serialized data and throws this exception instead of returning a half-built, unusable instance."
alternative[] = "Create a subclass that implements ``__serialize()`` and ``__unserialize()`` to control exactly how the object is restored."
alternative[] = "Do not serialize instances of this class in the first place; persist the data needed to recreate it and rebuild the object manually."
related[] = "serialization-of-%s-is-not-allowed,-override-__serialize()-and-__unserialize()-to-implement-it"
examples[] = "Unserialization of PDO is not allowed, override __serialize() and __unserialize() to implement it"
tags[] = "serialize"
seeAlso[] = ""
features[] = "serialization"
features[] = "magic-method"
previous = "serialization-of-%s-is-not-allowed,-override-__serialize()-and-__unserialize()-to-implement-it"
