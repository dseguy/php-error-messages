id = "calling-dba_fetch()-with-$dba-at-the-3rd-parameter-is-deprecated"
error = "Calling dba_fetch() with $dba at the 3rd parameter is deprecated"
phpVersion = "8.3+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

$dba = dba_open('/tmp/test.db', 'c', 'flatfile');

$value = dba_fetch('some_key', 0, $dba);

?>"
description = "``dba_fetch()`` historically accepted the database handle as its 3rd argument, behind an optional ``$skip`` argument used to select a duplicate key: ``dba_fetch(string $key, int $skip, resource $dba)``.

Every other ``dba_*()`` function takes the database handle as its 2nd argument, right after the key, so this older signature was inconsistent with the rest of the extension. Calling ``dba_fetch()`` with the handle in the 3rd position is now deprecated in favor of the consistent signature."
alternative[] = "Pass the database handle as the 2nd argument instead: ``dba_fetch(string $key, resource $dba, int $skip = 0)``."
related[] = "passing-false-or-null-is-deprecated-since-8.4"
examples[] = ""
tags[] = "argument"
tags[] = "deprecated"
seeAlso[] = ""
features[] = "dba"
