id = "the-mt_rand_php-variant-of-mt19937-is-deprecated"
error = "The MT_RAND_PHP variant of Mt19937 is deprecated"
phpVersion = "8.3+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

// MT_RAND_PHP selects PHP's own historical, biased reimplementation
// of the Mersenne Twister instead of the correct, standard one.
$engine = new Random\Engine\Mt19937(1234, MT_RAND_PHP);
$randomizer = new Random\Randomizer($engine);

var_dump($randomizer->getInt(0, 100));

?>"
description = "``Random\Engine\Mt19937`` (and the legacy ``mt_srand()``/``mt_rand()`` functions) support two variants of the Mersenne Twister algorithm, selected via the ``$mode`` argument: ``MT_RAND_MT19937``, the correct, standard implementation, and ``MT_RAND_PHP``, a non-standard variant kept only for backward compatibility with PHP's own ``mt_rand()`` behaviour prior to PHP 7.1. ``MT_RAND_PHP`` uses a biased scaling algorithm and, before PHP 8.2, exhibited undefined behaviour for some seed values.

As of PHP 8.3, constructing an engine (or seeding the legacy PRNG) with ``MT_RAND_PHP`` emits this deprecation notice; the special-cased, non-standard variant exists purely to reproduce historical output and should not be used in new code."
alternative[] = "Use MT_RAND_MT19937 (or simply omit the $mode argument, since it is the default) to get the correct, standard Mersenne Twister implementation."
alternative[] = "For new code, prefer a modern engine such as Random\\Engine\\Secure via the Random\\Randomizer API instead of seeding Mt19937 manually."
alternative[] = "Only keep MT_RAND_PHP where reproducing PHP's historical, legacy random sequence bit-for-bit is an explicit requirement."
related[] = ""
