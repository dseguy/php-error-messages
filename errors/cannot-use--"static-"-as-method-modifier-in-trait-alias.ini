id = "cannot-use--\"static-\"-as-method-modifier-in-trait-alias"
error = "Cannot use \\\"static\\\" as method modifier in trait alias"
phpVersion = "5.4+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

trait Greet
{
    public function hello()
    {
        echo 'hi';
    }
}

class X
{
    use Greet {
        hello as static greetStatically;
    }
}

?>"
description = "The ``as`` adaptation syntax used with ``use`` (traits) can only change the visibility of an imported method, or give it a new alias. It cannot be used to add the ``static`` modifier to a method: a trait method's static-ness is fixed by how it is declared in the trait itself, and cannot be altered by the class that imports it."
alternative[] = "Remove the ``static`` modifier from the ``as`` adaptation, and only change the visibility or the alias name."
alternative[] = "Declare the method as ``static`` directly in the trait, if that is the intended behavior."
related[] = "a-precedence-rule-was-defined-for-%s::%s-but-this-method-does-not-exist"
related[] = "an-alias-was-defined-for-%s::%s-but-this-method-does-not-exist"
related[] = "trait-method-%s::%s-has-not-been-applied-as-%s::%s"
examples[] = "Cannot use \"static\" as method modifier in trait alias"
