id = "cannot-disable-function-%s()"
error = "Cannot disable function %s()"
phpVersion = "4.0+"
level = "E_WARNING"
exception = ""
code = "; php.ini

disable_functions = exit,die,clone"
description = "The ``disable_functions`` (and, for language constructs treated as functions internally, similarly-behaving) php.ini directive lets an administrator remove selected functions from the language, for hardening purposes. A handful of language constructs, namely ``exit``/``die`` and ``clone``, are implemented internally as pseudo-functions so that they can be listed in ``disable_functions`` too, but they cannot actually be removed: doing so would leave the engine without a way to terminate a script or clone an object, both of which are needed by the engine itself.

Listing one of these three names in ``disable_functions`` does not stop PHP from starting; it only emits this warning once, at startup, and the name stays callable."
alternative[] = "Do not list exit, die or clone in disable_functions; they cannot be disabled."
alternative[] = "To restrict script termination or cloning, use a different mechanism, such as static analysis, a coding standard, or a runtime policy (open_basedir, custom error/shutdown handlers) instead."
related[] = ""
examples[] = "Cannot disable function exit()"
examples[] = "Cannot disable function die()"
examples[] = "Cannot disable function clone()"
tags[] = "configuration"
tags[] = "security"
seeAlso["disable_functions"] = "https://www.php.net/manual/en/ini.core.php#ini.disable-functions"
features[] = "disable_functions"
