id = "serialization-of-%s-is-not-allowed,-override-__serialize()-and-__unserialize()-to-implement-it"
error = "Serialization of %s is not allowed, override __serialize() and __unserialize() to implement it"
phpVersion = "7.4+"
level = "E_ERROR"
exception = "Exception"
code = "<?php

$pdo = new PDO('sqlite::memory:');

$data = serialize($pdo);

?>"
description = "Some internal classes hold state, such as a connection handle or a resource, that cannot be meaningfully turned into a string and restored later. To prevent silent data loss or unusable objects after ``unserialize()``, PHP flags these classes as not serializable by default. Since PHP 7.4, a class can opt back in by implementing the ``__serialize()`` and ``__unserialize()`` magic methods, giving full control over what state is actually persisted and how it is restored. Trying to ``serialize()`` an instance of such a class, or of a subclass that does not add these methods, throws this exception."
alternative[] = "Create a subclass that implements ``__serialize()`` and ``__unserialize()`` to control exactly which state is persisted."
alternative[] = "Avoid serializing the object directly; store only the data needed to recreate it, then reconstruct it manually."
related[] = "unserialization-of-%s-is-not-allowed,-override-__serialize()-and-__unserialize()-to-implement-it"
examples[] = "Serialization of PDO is not allowed, override __serialize() and __unserialize() to implement it"
tags[] = "serialize"
seeAlso[] = ""
features[] = "serialization"
features[] = "magic-method"
