id = "decrement-on-empty-string-is-deprecated-as-non-numeric"
error = "Decrement on empty string is deprecated as non-numeric"
phpVersion = "8.3+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

$str = '';
$str--;
var_dump($str);

?>"
description = "The ``--`` operator has special, Perl-inspired handling for strings: decrementing a numeric string decrements the number, and historically decrementing a non-numeric string (including the empty string) was silently treated as if it were ``0``, so ``''--`` produced ``-1``. This 'consider as 0' behaviour is surprising, since it makes ``--`` on a string do something completely different from what ``++`` does on the very same string.

As of PHP 8.3, decrementing an empty string emits this deprecation notice; the value is still coerced to ``0`` before the decrement for backward compatibility, but this implicit behaviour is intended to go away in PHP 9.0, as part of a broader effort to make ``++``/``--`` on strings saner and introduce ``str_increment()`` / ``str_decrement()``."
alternative[] = "Check for an empty string explicitly before decrementing, and handle it as its own case rather than relying on the implicit 0."
alternative[] = "Cast to int first if a numeric decrement was actually intended: $n = (int) $str; $n--;"
alternative[] = "Use str_decrement() when the goal is Perl-style string decrementing rather than numeric decrementing."
related[] = "decrement-on-non-numeric-string-has-no-effect-and-is-deprecated"
related[] = "increment-on-non-alphanumeric-string-is-deprecated"
