id = "calling-intlgregoriancalendar::__construct()-with-more-than-2-arguments-is-deprecated,"
error = "Calling IntlGregorianCalendar::__construct() with more than 2 arguments is deprecated,"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

$calendar = new IntlGregorianCalendar(2026, 0, 1, 12, 30, 0);

?>"
description = "``IntlGregorianCalendar::__construct()`` (and the procedural ``intlgregcal_create_instance()``) used to accept many different combinations of arguments: a timezone, a locale, or up to a year, month, day, hour, minute and second, all disambiguated at runtime from the number and type of arguments given.

Calling the constructor with more than 2 arguments — i.e. using it to build a date directly from year/month/day(/hour/minute/second) components — is now deprecated in favor of two dedicated, unambiguous factory methods."
alternative[] = "Use ``IntlGregorianCalendar::createFromDate()`` to build a calendar from a year, month and day, or ``IntlGregorianCalendar::createFromDateTime()`` to also set the hour, minute and second."
related[] = "calling-intlcalendar::set()-with-more-than-2-arguments-is-deprecated,"
