id = "method-%ps::%ps()-does-not-exist"
error = "Method %pS::%pS() does not exist"
phpVersion = "5.0+"
level = "E_ERROR"
exception = "ReflectionException"
code = "<?php

class X {}

$reflection = new ReflectionMethod('X', 'doesNotExist');

?>"
description = "The ``ReflectionMethod`` constructor requires the name of a method that actually exists on the given class (or object). When no such method is declared, either directly on the class or via one of its parents, traits or interfaces, the Reflection API cannot build the requested introspection object and throws a ``ReflectionException`` instead."
alternative[] = "Check the method name for typos, including its case."
alternative[] = "Use ``method_exists()`` or ``ReflectionClass::hasMethod()`` to check the method is available before reflecting on it."
related[] = "function-%ps()-does-not-exist"
examples[] = "Method X::doesNotExist() does not exist"
tags[] = "reflection"
seeAlso[] = ""
features[] = "reflection"
previous = ""
next = ""
extension[] = "reflection"
analyzer[] = ""
changedBehavior[] = ""
