id = "calling-ffi::new()-statically-is-deprecated"
error = "Calling FFI::new() statically is deprecated"
phpVersion = "8.3+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

FFI::cdef('typedef struct { int x; int y; } point;');

$mem = FFI::new('point');

?>"
description = "``new()``, ``cast()`` and ``type()`` are instance methods of the object returned by ``FFI::cdef()`` or ``FFI::load()``: each loaded C definition scope has its own set of types, so allocating a new value should happen on that specific instance.

For convenience, PHP also allowed calling these methods statically as ``FFI::new()``, ``FFI::cast()`` and ``FFI::type()``, in which case they implicitly operated on an anonymous, definition-less scope. This static shortcut is ambiguous about which set of C declarations is being used, and is now deprecated."
alternative[] = "Call ``new()`` on the ``FFI`` instance returned by ``FFI::cdef()`` or ``FFI::load()`` instead of calling it statically: ``$ffi->new(...)``."
related[] = "calling-ffi::cast()-statically-is-deprecated"
related[] = "calling-ffi::type()-statically-is-deprecated"
examples[] = ""
tags[] = "static"
tags[] = "deprecated"
