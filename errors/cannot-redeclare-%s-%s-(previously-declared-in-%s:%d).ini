id = "cannot-redeclare-%s-%s-(previously-declared-in-%s:%d)"
error = "Cannot redeclare %s %s (previously declared in %s:%d)"
phpVersion = "4.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

interface Foo {
}

interface Foo {
}

?>"
description = "A class, interface, trait or enum name can only be declared once per request, whether that happens directly in the same file or because two different, user-defined files both declare the same name. This is the general form of the redeclaration error: the first placeholder is the kind of symbol (``class``, ``interface``, ``trait`` or ``enum``), the second is its name, and the location points at the file and line of the earlier, conflicting declaration.

Unlike functions, none of these can be conditionally redeclared, even if the two declarations are byte-for-byte identical."
alternative[] = "Use include_once or require_once instead of include or require to avoid loading the same file twice."
alternative[] = "Wrap the declaration in a class_exists()/interface_exists()/trait_exists()/enum_exists() check if it may legitimately be loaded more than once."
alternative[] = "Rename one of the two symbols, or move them into different namespaces."
related[] = "cannot-redeclare-class-%s"
related[] = "cannot-redeclare-%s-%s"
related[] = "cannot-redeclare-function-%s()-(previously-declared-in-%s:%d)"
examples[] = "Cannot redeclare interface Foo (previously declared in /path/to/file.php:3)"
examples[] = "Cannot redeclare trait Foo (previously declared in /path/to/file.php:3)"
examples[] = "Cannot redeclare enum Foo (previously declared in /path/to/file.php:3)"
tags[] = "redeclare"
