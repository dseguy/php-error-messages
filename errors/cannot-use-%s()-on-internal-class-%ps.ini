id = "cannot-use-%s()-on-internal-class-%ps"
error = "Cannot use %s() on internal class %pS"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ReflectionException"
code = "<?php

$zip = new ZipArchive();

$prop = new ReflectionProperty($zip, 'status');
$prop->setRawValueWithoutLazyInitialization($zip, 0);

?>"
description = "``ReflectionProperty::setRawValueWithoutLazyInitialization()`` and ``::skipLazyInitialization()`` are part of the lazy objects API (PHP 8.4). Making an object lazy relies on the engine's default property read/write handlers, so it can intercept property access to trigger initialization. Some internal (C-implemented) classes, such as ``ZipArchive``, install their own custom property handlers instead and cannot be made lazy, so a declared property found on such a class still cannot be manipulated through these low-level, lazy-initialization-only APIs, and PHP throws instead of writing to a slot that the object's own handlers do not expect to be touched directly."
alternative[] = "Use ReflectionProperty::setValue() to set a property on an internal class instance, since setRawValueWithoutLazyInitialization()/skipLazyInitialization() only work with classes that support the engine's default property handlers and can be made lazy."
related[] = "cannot-use-%s()-on-dynamic-property-%ps::$%ps"
related[] = "cannot-use-%s()-on-static-property-%ps::$%ps"
related[] = "cannot-use-%s()-on-virtual-property-%ps::$%ps"
examples[] = "Cannot use setRawValueWithoutLazyInitialization() on internal class ZipArchive"
examples[] = "Cannot use skipLazyInitialization() on internal class ZipArchive"
tags[] = "reflection"
tags[] = "lazy-objects"
tags[] = "validation"
seeAlso[] = ""
features[] = "reflection"
features[] = "lazy-objects"
previous = ""
next = ""
