id = "implicit-conversion-from-float-string--\"%s-\"-to-int-loses-precision"
error = "Implicit conversion from float-string \\\"%s\\\" to int loses precision"
phpVersion = "8.1+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

function double(int $x) {
    return $x * 2;
}

// Weak typing lets a numeric string be passed where an int is
// declared, but '1.5' cannot become an int without losing the .5.
var_dump(double('1.5'));

?>"
description = "In weak typing mode (the default), a string argument passed where an ``int`` parameter is declared is coerced automatically, provided the string is numeric. When that string looks like a float rather than an integer -- e.g. ``'1.5'`` -- PHP still coerces it, by first converting it to a ``float`` and then truncating that float to an ``int``, silently discarding the fractional part.

As of PHP 8.1, this specific case -- a *float-shaped string* being coerced down to an int and losing precision in the process -- emits a deprecation notice. It is a sibling of the same underlying helper that also fires for float array keys and for bitwise/bitshift operators applied to float-like strings, which are documented separately since they are different call sites in practice."
alternative[] = "Round or cast the value explicitly before calling the function: double((int) round((float) $x))."
alternative[] = "Declare the parameter as int|float and handle both cases inside the function."
alternative[] = "Validate the input is an integer-shaped string (e.g. with ctype_digit()) before relying on implicit coercion."
related[] = "implicit-conversion-from-float-string-\"%s\"-to-int-loses"
related[] = "implicit-conversion-from-float-string-\"%s\"-to-int-loses-precision"
related[] = "implicit-conversion-from-float-%.*h-to-int-loses-precision"
examples[] = "Implicit conversion from float-string \"1.5\" to int loses precision"
