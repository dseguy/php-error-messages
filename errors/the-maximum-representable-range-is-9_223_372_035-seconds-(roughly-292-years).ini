id = "the-maximum-representable-range-is-9_223_372_035-seconds-(roughly-292-years)"
error = "The maximum representable range is 9_223_372_035 seconds (roughly 292 years)"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "Time\\TimeException"
code = "<?php

use Time\Duration;

$duration = Duration::fromSeconds(9_223_372_036);

?>"
description = "PHP 8.6 introduces ``Time\\Duration``, a value object representing a span of time as whole seconds plus nanoseconds. Even though a 64-bit ``zend_long`` could count seconds far beyond any realistic duration, ``$seconds`` is deliberately capped at ``9_223_372_035``, so that the whole duration can still be expressed as a single count of nanoseconds without overflowing a 64-bit integer (roughly ``PHP_INT_MAX`` divided by one billion). That works out to about 292 years.

Passing a larger number of seconds to ``Duration::fromSeconds()`` (or the constructor) throws a ``Time\\TimeException``, instead of silently producing a value that could overflow later."
alternative[] = "Keep durations within 9_223_372_035 seconds (about 292 years)."
alternative[] = "For spans of time longer than that, model them with something other than Duration, such as separate DateTimeImmutable endpoints."
related[] = "the-maximum-representable-range-is-2_147_483_647-seconds-(roughly-68-years)"
