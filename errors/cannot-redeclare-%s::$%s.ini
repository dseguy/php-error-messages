id = "cannot-redeclare-%s::$%s"
error = "Cannot redeclare %s::$%s"
phpVersion = "4.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class X {
    public $a;
    public $a;
}

?>"
description = "A property can only be declared once in a class. This error appears when the same property name is declared twice in the same class body, regardless of whether the visibility or default value differ between the two declarations.

The same restriction applies to promoted properties: a constructor parameter promoted to a property cannot share its name with a property already declared in the class body."
alternative[] = "Remove one of the two duplicate property declarations."
alternative[] = "Rename one of the two properties."
related[] = "cannot-redeclare-%s::%s()"
related[] = "cannot-declare-variadic-promoted-property"
examples[] = "Cannot redeclare X::$a"
