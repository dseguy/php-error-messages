id = "passing-a-seed-of-a-type-other-than-int-is-deprecated-because-it-is-the-same-as-setting-the-seed-to-0"
error = "Passing a seed of a type other than int is deprecated because it is the same as setting the seed to 0"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

// 'seed' is documented as an int; murmur3a treats anything else as
// though 'seed' had simply been left at its default, 0.
var_dump(hash('murmur3a', 'some data', false, ['seed' => '1234']));
var_dump(hash('murmur3a', 'some data', false, ['seed' => 0]));
// the two lines above produce the exact same hash

?>"
description = "The ``murmur3a``, ``murmur3c``, ``murmur3f``, ``xxh32`` and ``xxh64`` algorithms accept an optional ``'seed'`` entry (an ``int``) in the options array passed to ``hash()``/``hash_init()``, defaulting to ``0`` when not given. When a non-int value is passed, these algorithms' code checks the type, finds it isn't an int, and simply falls through without ever assigning it -- leaving the seed at its already-initialized default of ``0``. The visible effect is identical to never having passed ``'seed'`` at all, which is easy to miss since no error was raised.

As of PHP 8.4, passing a non-int 'seed' to one of these algorithms emits this deprecation notice. Note that ``xxh3``/``xxh128`` take a related but distinct code path for the same mistake, documented separately since their non-int seed is *ignored* rather than treated as ``0`` (the two happen to behave the same when the intended seed actually was ``0``, but not otherwise)."
alternative[] = "Pass an actual int for 'seed', e.g. ['seed' => 1234] rather than a numeric string."
alternative[] = "Cast the value explicitly if it is computed dynamically: ['seed' => (int) $value]."
alternative[] = "If a seed of 0 was genuinely intended, pass ['seed' => 0] explicitly instead of relying on a mistyped value falling back to it."
related[] = "passing-a-seed-of-a-type-other-than-int-is-deprecated-because-it-is-ignored"
related[] = "passing-a-secret-of-a-type-other-than-string-is-deprecated-because-it-implicitly-converts-to-a-string,-potentially-hiding-bugs"
examples[] = "hash(): Passing a seed of a type other than int is deprecated because it is the same as setting the seed to 0"
tags[] = "deprecation"
tags[] = "hash"
seeAlso[PHP RFC: Deprecations for PHP 8.4] = "https://wiki.php.net/rfc/deprecations_php_8_4"
seeAlso[hash manual] = "https://www.php.net/manual/en/function.hash.php"
