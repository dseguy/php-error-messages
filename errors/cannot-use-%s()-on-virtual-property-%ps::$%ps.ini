id = "cannot-use-%s()-on-virtual-property-%ps::$%ps"
error = "Cannot use %s() on virtual property %pS::$%pS"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ReflectionException"
code = "<?php

class Foo {
    public int $bar {
        get => 5;
    }
}

$obj = new Foo();

$prop = new ReflectionProperty($obj, 'bar');
$prop->setRawValueWithoutLazyInitialization($obj, 2);

?>"
description = "``ReflectionProperty::setRawValueWithoutLazyInitialization()`` and ``::skipLazyInitialization()`` are part of the lazy objects API (PHP 8.4): they reach directly into the memory slot backing an ordinary, storage-based property, bypassing the object's lazy initializer. A virtual property (a property hook declared with only ``get``/``set`` and no backing ``$this->propName`` storage, from PHP 8.4's property hooks feature) has no such slot at all, so these methods have nothing to write to and throw instead."
alternative[] = "Only call setRawValueWithoutLazyInitialization()/skipLazyInitialization() on properties that actually have backing storage, i.e. hooked properties that reference $this->propName in their get/set hooks, not purely virtual ones."
related[] = "cannot-use-%s()-on-dynamic-property-%ps::$%ps"
related[] = "cannot-use-%s()-on-static-property-%ps::$%ps"
related[] = "cannot-use-%s()-on-internal-class-%ps"
examples[] = "Cannot use setRawValueWithoutLazyInitialization() on virtual property Foo::$bar"
examples[] = "Cannot use skipLazyInitialization() on virtual property Foo::$bar"
tags[] = "reflection"
tags[] = "lazy-objects"
tags[] = "property-hook"
tags[] = "validation"
seeAlso[] = ""
