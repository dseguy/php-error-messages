id = "calling-dateperiod::__construct(string-$isostr,-int-$options-=-0)-is-deprecated,"
error = "Calling DatePeriod::__construct(string $isostr, int $options = 0) is deprecated,"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

$period = new DatePeriod('R4/2026-01-01T00:00:00Z/P1D');

foreach ($period as $date) {
    echo $date->format('Y-m-d'), PHP_EOL;
}

?>"
description = "``DatePeriod::__construct()`` has always accepted several unrelated sets of arguments: a start ``DateTimeInterface``, an interval and either an end date or a number of recurrences, or, as a third overload, a single ISO 8601 recurring interval string (such as ``R4/2026-01-01T00:00:00Z/P1D``).

Overloaded constructors that change meaning based on the number and type of arguments are error-prone and hard to document accurately. The ISO 8601 string overload is being split out into its own named constructor, and calling the constructor directly with a string is deprecated."
alternative[] = "Use ``DatePeriod::createFromISO8601String()`` instead of passing the ISO 8601 recurring interval string to the constructor."
related[] = ""
examples[] = ""
tags[] = "constructor"
tags[] = "overloaded signature"
