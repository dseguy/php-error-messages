id = "bad-class-name-in-the-catch-statement"
error = "Bad class name in the catch statement"
phpVersion = "5.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class Test
{
    public function method()
    {
        try {
            foo();
        } catch (static $e) {
        }
    }
}

?>"
description = "A ``catch`` clause lists one or more class or interface names (possibly joined with ``|``) that the caught exception must match. Those names have to be resolvable to a concrete class at compile time.

The pseudo-class ``static`` refers to ``the class the method was actually called on``, which is only known at runtime, not at compile time. Since PHP needs to know the exact catch types while compiling the ``try``/``catch`` block, ``static`` cannot be used there, even though it is otherwise allowed as a return type or inside the method body."
alternative[] = "Use the real class name instead of ``static``."
alternative[] = "Use ``self`` if the intent is to catch the class in which the method is defined."
