id = "calling-%s()-with-2-arguments-is-deprecated,"
error = "Calling %s() with 2 arguments is deprecated,"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

\$conn = pg_connect('host=localhost dbname=test');
\$result = pg_query(\$conn, 'SELECT id, name FROM users');

// 2-argument form: implicit row cursor instead of an explicit $row
echo pg_fetch_result(\$result, 'name'), \"\\n\";

?>"
description = "This is the generic shape of a family of deprecation notices introduced by the ``Deprecate functions with overloaded signatures`` RFC. Several built-in functions used to accept more than one call shape, distinguished only by how many arguments were passed, such as ``pg_fetch_result()``, ``pg_field_prtlen()`` and ``pg_field_is_null()`` (2-argument form relying on an implicit row cursor) or ``stream_context_set_option()`` (2-argument form taking a whole options array instead of a single wrapper/option/value triple).

As of PHP 8.4, calling any of these functions with the specific, older argument count that made the overload ambiguous emits this deprecation notice, naming the function and pointing to its replacement. The exact wording of the second half of the message (after the comma) depends on the function."
alternative[] = "Check the specific function's documentation for its replacement: a dedicated function (e.g. stream_context_set_options()) or the newer, explicit argument count (e.g. always passing $row to pg_fetch_result())."
related[] = "calling-pg_fetch_result()-with-2-arguments-is-deprecated,"
related[] = "calling-stream_context_set_option()-with-2-arguments-is-deprecated,"
related[] = "calling-reflectionmethod::__construct()-with-1-argument-is-deprecated,"
examples[] = "Calling pg_fetch_result() with 2 arguments is deprecated, use the 3-parameter signature with a null $row parameter instead"
examples[] = "Calling stream_context_set_option() with 2 arguments is deprecated, use stream_context_set_options() instead"
examples[] = "Calling pg_field_is_null() with 2 arguments is deprecated, use the 3-parameter signature with a null $row parameter instead"
tags[] = "deprecated"
tags[] = "overloaded-signature"
seeAlso["PHP RFC: Deprecate functions with overloaded signatures"] = "https://wiki.php.net/rfc/deprecate_functions_with_overloaded_signatures"
features[] = "deprecation"
