id = "the-pdo-extension-must-be-loaded-first-in-order-to-load-pdo-drivers"
error = "The PDO extension must be loaded first in order to load PDO drivers"
phpVersion = "5.1+"
level = "E_ERROR"
exception = ""
code = "; php.ini, with the pdo shared extension missing or disabled,
; while a PDO driver extension is still enabled

;extension=pdo
extension=pdo_sqlite"
description = "Driver extensions such as ``pdo_mysql``, ``pdo_sqlite`` or ``pdo_pgsql`` are separate shared extensions from the core ``pdo`` extension: at startup, each of them registers itself with the core PDO extension so that it can be looked up later by ``PDO::getAvailableDrivers()`` and by the ``new PDO(\"driver:...\")`` DSN syntax.

That registration only works if the core ``pdo`` extension has already finished loading and initializing by the time the driver extension's own module init runs. If ``pdo`` was never loaded at all, for instance because it was built as a shared extension and its ``extension=pdo`` line is missing, commented out, or ordered after the driver in php.ini on a setup old enough not to resolve this automatically, PHP fails to start with this fatal error the moment it tries to register the driver."
alternative[] = "Make sure extension=pdo (or a statically-built pdo) is enabled; most current PHP builds compile pdo statically or resolve module dependencies automatically, so this is mostly seen on custom or older builds."
alternative[] = "If php.ini lists extensions manually, make sure pdo is loaded before any pdo_* driver extension."
related[] = ""
examples[] = "The PDO extension must be loaded first in order to load PDO drivers"
