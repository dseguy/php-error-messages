id = "must-be-a-bitmask-of-posix_f_ok,-posix_r_ok,-posix_w_ok,-and-posix_x_ok"
error = "must be a bitmask of POSIX_F_OK, POSIX_R_OK, POSIX_W_OK, and POSIX_X_OK"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

posix_access('/etc/passwd', 999);

?>"
description = "``posix_access()`` checks whether the current process can access a file in a given way. Its ``$flags`` argument only accepts a bitmask built from ``POSIX_F_OK`` (existence), ``POSIX_R_OK`` (readable), ``POSIX_W_OK`` (writable), and ``POSIX_X_OK`` (executable).

As of PHP 8.6, passing a value with bits set outside of that set throws a ``ValueError``, instead of forwarding an unvalidated flag value straight to the underlying ``access()`` system call."
alternative[] = "Build ``$flags`` for ``posix_access()`` only out of ``POSIX_F_OK``, ``POSIX_R_OK``, ``POSIX_W_OK``, and ``POSIX_X_OK``, combined with ``|`` as needed."
related[] = ""
examples[] = "posix_access(): Argument #2 ($flags) must be a bitmask of POSIX_F_OK, POSIX_R_OK, POSIX_W_OK, and POSIX_X_OK"
tags[] = "posix"
tags[] = "filesystem"
tags[] = "validation"
seeAlso[] = ""
features[] = "posix-access"
previous = ""
next = ""
extension[] = "posix"
analyzer[] = ""
changedBehavior[] = "Previously, an out-of-range $flags value was passed through to the underlying access() call unchecked instead of being rejected."
