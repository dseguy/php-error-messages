id = "must-be-a-list-of-%s"
error = "must be a list of %s"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

new Uri\WhatWg\InvalidUrlException(
    'bad url',
    ['not a validation error object'],
);

?>"
description = "``Uri\\WhatWg\\InvalidUrlException::__construct()`` accepts an ``$errors`` argument describing every WHATWG URL validation failure that occurred. That argument must be a list (contiguous, zero-based keys) whose every value is an instance of ``Uri\\WhatWg\\UrlValidationError``. Any other array shape — associative keys, non-sequential indices, or elements that are not ``UrlValidationError`` objects — is rejected with this ``ValueError``."
alternative[] = "Pass an array of ``Uri\\WhatWg\\UrlValidationError`` instances only, built with ``array_values()`` if it might have gaps or string keys."
alternative[] = "Let the WHATWG URL parser construct and throw this exception itself, rather than constructing it manually."
related[] = "the-specified-uri-is-malformed"
examples[] = "Uri\\WhatWg\\InvalidUrlException::__construct(): Argument #2 ($errors) must be a list of Uri\\WhatWg\\UrlValidationError"
tags[] = "uri"
seeAlso[] = ""
features[] = "uri"
features[] = "list"
