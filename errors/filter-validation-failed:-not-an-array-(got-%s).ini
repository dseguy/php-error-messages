id = "filter-validation-failed:-not-an-array-(got-%s)"
error = "filter validation failed: not an array (got %s)"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "Filter\\FilterFailedException"
code = "<?php

filter_var('a', FILTER_DEFAULT, FILTER_REQUIRE_ARRAY | FILTER_THROW_ON_FAILURE);

?>"
description = "The ``FILTER_REQUIRE_ARRAY`` flag asks the filter functions to treat the input as an array and filter each element. If the value is not actually an array, this normally makes the function return ``false``. When ``FILTER_THROW_ON_FAILURE`` is combined with ``FILTER_REQUIRE_ARRAY``, that same situation instead throws ``Filter\\FilterFailedException`` naming the type that was received."
alternative[] = "Pass an array when using FILTER_REQUIRE_ARRAY, or drop that flag if a scalar is expected."
alternative[] = "Wrap the call in a try/catch and handle ``Filter\\FilterFailedException``."
related[] = "filter-validation-failed:-filter-%s-not-satisfied-by-%s"
related[] = "filter-validation-failed:-object-of-type-%s-has-no-__tostring()-method"
examples[] = "filter validation failed: not an array (got string)"
tags[] = "filter"
seeAlso[] = ""
features[] = "validation"
previous = "filter-validation-failed:-filter-%s-not-satisfied-by-%s"
next = "filter-validation-failed:-object-of-type-%s-has-no-__tostring()-method"
extension[] = "filter"
