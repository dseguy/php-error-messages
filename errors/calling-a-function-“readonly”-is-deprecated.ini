id = "calling-a-function-“readonly”-is-deprecated"
error = "Calling a function “readonly” is deprecated"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

function readonly() {
    return 'not a property modifier';
}

echo readonly();

?>"
description = "``readonly`` has been a semi-reserved word since PHP 8.1, when it was introduced as a modifier for readonly properties and classes. It could still be used as the name of a function, class, or constant, and PHP even special-cased a global function literally called ``readonly()`` so that WordPress, which ships one, would keep working.

PHP 8.6 deprecates calling such a function, as part of a broader effort to fully reserve ``readonly`` for the language. The deprecation notice is emitted every time the function is called, not when it is declared."
alternative[] = "Rename the function to something that is not ``readonly``, e.g. ``readonlyValue()`` or ``getReadonly()``."
related[] = "cannot-use-'readonly'-as-%s-modifier"
related[] = "syntax-error,-unexpected-identifier-\"readonly\",-expecting-\"function\"-or-\"const\""
examples[] = "Calling a function \"readonly\" is deprecated"
tags[] = "deprecation"
tags[] = "reserved-word"
seeAlso[] = ""
features[] = "readonly"
previous = ""
next = ""
extension[] = "Core"
analyzer[] = ""
changedBehavior[] = "Previously, a global function literally named readonly() could be declared and called without any warning, as a compatibility carve-out for WordPress. As of PHP 8.6, calling it emits a deprecation notice, in preparation for readonly becoming a fully reserved word."