id = "method-%s::%s-cannot-be-#[--nodiscard]-error_type"
error = "Method %s::%s cannot be #[\\\\NoDiscard] error_type"
phpVersion = "8.5+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class X {
    #[\NoDiscard]
    public function __clone() {}
}

$x = new X();
clone $x;

?>"
description = "The ``#[\\NoDiscard]`` attribute marks a function, method or closure so that the engine emits a warning whenever a caller ignores its return value. A number of magic methods -- ``__clone``, ``__set``, ``__unset``, ``__wakeup`` and ``__unserialize`` -- are expected to always behave as if declared ``: void``: PHP calls them purely for their side effect and never looks at, or exposes, any value they might return. Marking one of them ``#[\\NoDiscard]`` is therefore meaningless, and PHP rejects it at compile time.

This is the same wording as the message used for ``__construct`` and ``__destruct`` (see method-%s::%s-cannot-be-#[--nodiscard]), but produced by a different internal check: those two magic methods are not even allowed to declare a return type at all, whereas the methods covered here are simply always treated as implicitly ``void``. The trailing 'error_type' in this file's identifier is an artifact of how this catalog extracts messages from the PHP source; it is not part of the text PHP actually displays."
alternative[] = "Remove the ``#[\\NoDiscard]`` attribute from the magic method."
alternative[] = "If a discardable-value warning is needed, move the logic to a regular, non-magic method and mark that one instead."
related[] = "method-%s::%s-cannot-be-#[--nodiscard]"
