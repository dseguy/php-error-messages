id = "must-have-a-length-less-than-or-equal-to-%u"
error = "must have a length less than or equal to %u"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

$data = str_repeat('a', 4294967296);

bzdecompress($data);

?>"
description = "``bzdecompress()`` hands its input off to libbzip2, which tracks buffer sizes in a 32-bit unsigned integer internally. A ``$data`` string of ``4294967296`` bytes (``2^32``) or more cannot be represented by that counter and would silently overflow.

As of PHP 8.6, ``bzdecompress()`` rejects oversized input up front with a ``ValueError``, instead of risking an integer overflow while decompressing it."
alternative[] = "Do not pass strings close to or larger than 4 GB to ``bzdecompress()``; decompress the data in smaller chunks instead if possible."
related[] = "must-be-less-than-4294967295-bytes"
examples[] = "bzdecompress(): Argument #1 ($source) must have a length less than or equal to 4294967295"
tags[] = "bzip2"
tags[] = "validation"
seeAlso[] = ""
features[] = "bzdecompress"
previous = ""
next = ""
extension[] = "bz2"
analyzer[] = ""
changedBehavior[] = "Previously, oversized input could trigger an unsigned integer overflow inside bzdecompress() instead of being rejected."
