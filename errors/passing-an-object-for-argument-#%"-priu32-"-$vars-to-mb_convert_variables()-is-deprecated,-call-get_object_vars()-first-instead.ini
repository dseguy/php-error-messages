id = "passing-an-object-for-argument-#%\"-priu32-\"-$vars-to-mb_convert_variables()-is-deprecated,-call-get_object_vars()-first-instead"
error = "Passing an object for argument #%\" PRIu32 \" $vars to mb_convert_variables() is deprecated, call get_object_vars() first instead"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class Nested {
    public $inner;
}

$nested = new Nested();
$nested->inner = 'some text';

mb_convert_variables('UTF-8', 'auto', $nested);

?>"
description = "``mb_convert_variables()`` converts the character encoding of every value passed to it — strings, arrays, or objects — in place, recursing into arrays and objects alike. Each variadic argument after the first two occupies a different, dynamic position (``$vars``), so the deprecation names whichever argument number the object was actually found at, not a fixed one. PHP 8.6 deprecates passing an object anywhere in that variadic list, whether directly or nested inside an array."
alternative[] = "Convert the object to an array first with ``get_object_vars()`` and pass that instead."
alternative[] = "Convert only the scalar string properties you need, individually."
related[] = ""
examples[] = "mb_convert_variables(): Passing an object for argument #3 $vars to mb_convert_variables() is deprecated, call get_object_vars() first instead"
examples[] = "mb_convert_variables(): Passing an object for argument #7 $vars to mb_convert_variables() is deprecated, call get_object_vars() first instead"
tags[] = "mbstring"
tags[] = "deprecation"
