id = "trying-to-clone-an-uncloneable-object-of-class-%s"
error = "Trying to clone an uncloneable object of class %s"
phpVersion = "8.1+"
level = "E_ERROR"
exception = ""
code = "<?php

enum E {
    case A;
}
clone E::A;

$g = function () { yield 1; };
clone $g;

$c = function () { return 1; };
clone $c;

?>"
description = "It is not possible to instantiate certain classes. This is the case of enumerations and generators. 

It is also not possible to clone an enumeration cases, which are actually of the same type as the enumeration itself. The only usage is to access the ``cases`` of the enumeration: they are directly the expected objects.

On the other hand, it is possible to clone a closure."
alternative[] = "Use the case ``E::A``. Make sure it is not a class constant, which might be cloned."
alternative[] = "For generator, call the original variable anytime the code needs a new source for a loop."
related[] = ""
examples[] = "Trying to clone an uncloneable object of class e"
tags[] = ""
seeAlso[] = ""
features[] = "generator"
features[] = "enum"
features[] = "enum-case"
