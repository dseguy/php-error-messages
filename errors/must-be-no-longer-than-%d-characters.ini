id = "must-be-no-longer-than-%d-characters"
error = "must be no longer than %d characters"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

IntlNumberRangeFormatter::createFromSkeleton(
    '',
    str_repeat('a', 200),
    IntlNumberRangeFormatter::COLLAPSE_AUTO,
    IntlNumberRangeFormatter::IDENTITY_FALLBACK_RANGE
);

?>"
description = "``IntlNumberRangeFormatter::createFromSkeleton()``'s ``$locale`` argument is validated against ICU's internal locale-name length limit before being parsed, the same limit enforced elsewhere across the intl extension.

Passing a ``$locale`` string longer than that limit throws a ``ValueError``, instead of handing an oversized buffer to ICU's locale parser."
alternative[] = "Use a locale identifier no longer than ICU's maximum locale length (156 characters) when calling IntlNumberRangeFormatter::createFromSkeleton()."
related[] = ""
examples[] = "IntlNumberRangeFormatter::createFromSkeleton(): Argument #2 ($locale) must be no longer than 156 characters"
