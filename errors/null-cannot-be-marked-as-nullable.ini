id = "null-cannot-be-marked-as-nullable"
error = "null cannot be marked as nullable"
phpVersion = "8.2+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function test(): ?null
{
}

?>"
description = "Since PHP 8.2, ``null`` (like ``false`` and ``true``) can be used directly as a standalone type. But ``null`` already means exactly one thing: the value ``null``. Marking it nullable with a leading ``?``, as in ``?null``, would only mean ``null or null``, which is entirely redundant, so PHP rejects it."
alternative[] = "Remove the ``?`` and use ``null`` on its own."
related[] = "type-contains-both-true-and-false,-bool-must-be-used-instead"
related[] = "duplicate-type-%s-is-redundant"
