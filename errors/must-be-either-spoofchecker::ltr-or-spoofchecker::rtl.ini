id = "must-be-either-spoofchecker::ltr-or-spoofchecker::rtl"
error = "must be either Spoofchecker::LTR or Spoofchecker::RTL"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

$checker = new Spoofchecker();

$checker->getBidiSkeleton(99, 'paypal');

?>"
description = "PHP 8.6 adds ``Spoofchecker::getBidiSkeleton()`` and ``Spoofchecker::areBidiConfusable()``, which compute (or compare) the visual ``skeleton`` of a string for a given text direction, used to detect visually-confusable identifiers that mix left-to-right and right-to-left scripts. Both methods take a ``$direction`` argument that only accepts two values: ``Spoofchecker::LTR`` or ``Spoofchecker::RTL``.

Passing any other integer raises a ``ValueError``, since ICU's bidi skeleton algorithm only knows how to reason about text in one of these two directions."
alternative[] = "Pass either ``Spoofchecker::LTR`` or ``Spoofchecker::RTL`` as the ``$direction`` argument."
related[] = ""
examples[] = "Spoofchecker::getBidiSkeleton(): Argument #1 ($direction) must be either Spoofchecker::LTR or Spoofchecker::RTL"
examples[] = "Spoofchecker::areBidiConfusable(): Argument #1 ($direction) must be either Spoofchecker::LTR or Spoofchecker::RTL"
