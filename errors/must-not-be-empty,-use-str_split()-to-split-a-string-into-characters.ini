id = "must-not-be-empty,-use-str_split()-to-split-a-string-into-characters"
error = "must not be empty, use str_split() to split a string into characters"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

explode('', 'hello');

?>"
description = "``explode()`` splits a string on every occurrence of a ``$separator``. An empty separator has no well-defined meaning for that operation, so it has always been rejected.

As of PHP 8.6, the ``ValueError`` message for this case was made more actionable: instead of just saying the separator cannot be empty, it now points directly to ``str_split()``, which is the correct tool for splitting a string into its individual characters."
alternative[] = "Use ``str_split()`` instead of ``explode('', ...)`` to split a string into individual characters."
related[] = "must-not-be-empty"
examples[] = "explode(): Argument #1 ($separator) must not be empty, use str_split() to split a string into characters"
tags[] = "strings"
tags[] = "validation"
seeAlso[] = ""
features[] = "explode"
previous = ""
next = ""
extension[] = "standard"
analyzer[] = ""
changedBehavior[] = "Previously, this was reported as \"explode(): Argument #1 ($separator) cannot be empty\", without the str_split() suggestion."
