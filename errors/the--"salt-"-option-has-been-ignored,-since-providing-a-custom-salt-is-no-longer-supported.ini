id = "the--\"salt-\"-option-has-been-ignored,-since-providing-a-custom-salt-is-no-longer-supported"
error = "The \"salt\" option has been ignored, since providing a custom salt is no longer supported"
phpVersion = "8.0+"
level = "E_WARNING"
exception = ""
code = "<?php

// The salt option is ignored: password_hash() generates its own salt
$hash = password_hash('password', PASSWORD_DEFAULT, ['salt' => 'a-custom-salt-value']);

?>"
description = "``password_hash()`` used to accept a ``salt`` option, which let the caller choose the salt of the hash. This is no longer supported: the option is ignored, and ``password_hash()`` generates a random salt itself. The hash is still returned, so the code keeps running, but the custom salt does not appear in it.

A custom salt was a weak practice, as a fixed or badly chosen salt makes it easier to attack many hashes at once. Since the salt is stored inside the hash, ``password_verify()`` works without the caller managing it."
alternative[] = "Remove the ``salt`` option. ``password_hash()`` already generates a random salt for each hash."
alternative[] = "To check a password, use ``password_verify()``, which reads the salt from the stored hash."
related[] = ""
examples[] = "password_hash(): The \"salt\" option has been ignored, since providing a custom salt is no longer supported"
tags[] = "password"
tags[] = "salt"
