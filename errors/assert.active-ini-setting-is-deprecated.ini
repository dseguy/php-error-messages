id = "assert.active-ini-setting-is-deprecated"
error = "assert.active INI setting is deprecated"
phpVersion = "8.3+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

ini_set('assert.active', '0');

?>"
description = "``assert.active`` is a legacy INI directive that dates back to the pre-PHP 7 implementation of ``assert()``, where assertions could be toggled on or off at runtime through several ``assert.*`` INI settings.

Since PHP 7, assertion behavior is primarily controlled by the ``zend.assertions`` directive, which supports three modes: 1 (generate and execute code, development mode), 0 (generate code, but skip execution at runtime), and -1 (do not generate code, production mode). ``assert.active`` became redundant, only affecting whether ``assert()`` calls are executed at all, and is now deprecated.

The deprecation notice is triggered whenever ``assert.active`` is set to a falsy value, either in ``php.ini`` or through ``ini_set()``."
alternative[] = "Use the ``zend.assertions`` directive to control whether assertions are compiled and executed."
alternative[] = "Remove ``ini_set()``/``ini_get()`` calls involving ``assert.active`` from the code."
