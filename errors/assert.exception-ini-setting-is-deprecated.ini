id = "assert.exception-ini-setting-is-deprecated"
error = "assert.exception INI setting is deprecated"
phpVersion = "8.3+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

ini_set('assert.exception', '0');

?>"
description = "``assert.exception`` controls whether a failed ``assert()`` throws an ``AssertionError`` (the default since PHP 7) or falls back to the legacy behavior of emitting a warning and continuing execution.

Disabling exceptions for assertions revives pre-PHP 7 behavior that is inconsistent with the rest of the language, where failures are normally reported through exceptions or errors. As part of the cleanup of the legacy ``assert.*`` configuration, this directive is now deprecated.

The deprecation notice is triggered whenever ``assert.exception`` is set to a falsy value, either in ``php.ini`` or through ``ini_set()``."
alternative[] = "Keep ``assert.exception`` enabled (the default) and catch ``AssertionError`` where a failed assertion needs to be handled instead of propagating."
alternative[] = "Remove ``ini_set()``/``ini_get()`` calls involving ``assert.exception`` from the code."
related[] = "assert.active-ini-setting-is-deprecated"
related[] = "assert.bail-ini-setting-is-deprecated"
related[] = "assert.warning-ini-setting-is-deprecated"
examples[] = ""
