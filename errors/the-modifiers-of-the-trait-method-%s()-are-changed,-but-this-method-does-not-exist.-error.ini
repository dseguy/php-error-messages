id = "the-modifiers-of-the-trait-method-%s()-are-changed,-but-this-method-does-not-exist.-error"
error = "The modifiers of the trait method %s() are changed, but this method does not exist. Error"
phpVersion = "5.4+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

trait A {
    public function foo() {}
}

class C {
    use A {
        bar as protected;
    }
}

?>"
description = "Inside the ``use`` block of a class, a conflict-resolution rule can change the visibility of a trait method without renaming it, by writing ``method as visibility;`` -- with no trait name before the method, and no new name after the modifier.

Here, ``bar`` is not qualified with a trait name, so PHP looks for a method called ``bar`` in every trait used by the class. Since none of them declares it, and the rule does not introduce an alias (there is no new name after ``protected``), PHP reports that the modifiers of a non-existent method were changed, rather than reporting a missing alias target."
alternative[] = "Fix the typo in the method name so it matches an existing method of one of the used traits."
alternative[] = "Remove the rule if changing the visibility of that method is no longer needed."
related[] = "an-alias-was-defined-for-method-%s(),-which-exists-in-both-%s-and-%s.-use-%s::%s-or-%s::%s-to-resolve-the-ambiguity"
related[] = "a-precedence-rule-was-defined-for-%s::%s-but-this-method-does-not-exist"
examples[] = "The modifiers of the trait method bar() are changed, but this method does not exist. Error"
