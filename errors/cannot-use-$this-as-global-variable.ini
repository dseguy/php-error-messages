id = "cannot-use-$this-as-global-variable"
error = "Cannot use $this as global variable"
phpVersion = "5.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class X {
    function foo() {
        global $this;
    }
}

(new X)->foo();

?>"
description = "The pseudo-variable ``$this`` is automatically available inside every method of a class, and refers to the current object. It is not possible to import ``$this`` into the global symbol table using the ``global`` keyword. ``$this`` is special and not a regular variable that may be made global."
alternative[] = "Use ``$this`` directly inside the method, without importing it as global."
alternative[] = "Pass the object as a parameter to the function that needs it."
related[] = "cannot-re-assign-$this"
related[] = "using-$this-when-not-in-object-context"
related[] = "cannot-use-auto-global-as-lexical-variable"
