id = "passing-an-object-for-argument-#1-$data-to-http_build_query()-is-deprecated,-call-get_object_vars()-first-instead"
error = "Passing an object for argument #1 $data to http_build_query() is deprecated, call get_object_vars() first instead"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class KeyVal {
    public $public = 'input';
    protected $protected = 'hello';
    private $private = 'world';
}

echo http_build_query(new KeyVal());

?>"
description = "``http_build_query()``'s ``$data`` parameter is documented as taking an array, but has always also accepted an object, building the query string from its accessible (public, from outside the class) properties. PHP 8.6 deprecates passing an object directly as ``$data``. Passing an object nested inside the array is separately deprecated too."
alternative[] = "Convert the object to an array first with ``get_object_vars($obj)`` and pass that to http_build_query()."
alternative[] = "If the object implements a mapping interface, expose its data as an array explicitly, e.g. via a dedicated method."
related[] = "object-values-within-argument-#1-$data-to-http_build_query()-being-interpreted-as-arrays-is-deprecated,"
examples[] = ""
tags[] = "deprecation"
seeAlso[] = ""
features[] = "http"
previous = ""
next = "object-values-within-argument-#1-$data-to-http_build_query()-being-interpreted-as-arrays-is-deprecated,"
extension[] = "standard"
analyzer[] = ""
