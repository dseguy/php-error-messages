id = "must-be-one-of-array_filter_use_value,-array_filter_use_key,-or-array_filter_use_both"
error = "must be one of ARRAY_FILTER_USE_VALUE, ARRAY_FILTER_USE_KEY, or ARRAY_FILTER_USE_BOTH"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

$array = ['a' => 1, 'b' => 2];

array_filter($array, fn($v) => $v > 0, 42);

?>"
description = "``array_filter()`` uses its third argument, ``$mode``, to decide what the callback receives: the value (``ARRAY_FILTER_USE_VALUE``, the default), the key (``ARRAY_FILTER_USE_KEY``), or both (``ARRAY_FILTER_USE_BOTH``). No other mode makes sense, since the callback's signature is chosen based on exactly one of these three constants.

Before PHP 8.6, passing any other integer for ``$mode`` was silently treated as ``ARRAY_FILTER_USE_VALUE``. As of PHP 8.6, an unrecognized mode now throws a ``ValueError`` instead of falling back silently."
alternative[] = "Pass one of ``ARRAY_FILTER_USE_VALUE``, ``ARRAY_FILTER_USE_KEY``, or ``ARRAY_FILTER_USE_BOTH`` as the ``$mode`` argument to ``array_filter()``."
related[] = ""
examples[] = "array_filter(): Argument #3 ($mode) must be one of ARRAY_FILTER_USE_VALUE, ARRAY_FILTER_USE_KEY, or ARRAY_FILTER_USE_BOTH"
tags[] = "arrays"
tags[] = "validation"
seeAlso[] = ""
features[] = "array-filter-mode"
previous = ""
next = ""
extension[] = "standard"
analyzer[] = ""
changedBehavior[] = "Previously, any unrecognized ``$mode`` value was silently treated as ``ARRAY_FILTER_USE_VALUE``."
