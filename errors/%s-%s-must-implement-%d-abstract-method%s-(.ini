id = "%s-%s-must-implement-%d-abstract-method%s-("
error = "%s %s must implement %d abstract method%s ("
phpVersion = "8.5+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

interface Colorful {
    function color();
}

enum Suit implements Colorful {
    case Hearts;
}

?>"
description = "An enum, or an anonymous class, that does not provide a body for one or more of its abstract methods -- inherited via an implemented interface -- must implement all of them, since, unlike an ordinary class, neither an enum nor an anonymous class can be declared ``abstract`` to defer the implementation.

The message lists every abstract method that is still missing a concrete implementation, up to three of them; when there are more, the list ends with ``...``.

This is the templated, general-purpose version of the message: the first ``%s`` is replaced by the kind of structure (``Enum`` or ``Class``, the latter for anonymous classes), the second by its name.

Before PHP 8.5, anonymous classes used the generic ``%s %s contains %d abstract method%s and must therefore be declared abstract or implement the remaining method%s (...)`` message instead of this one, since only enums had this dedicated message. Also, before PHP 8.5, the wording for enums included the word 'private' (``must implement %d abstract private method%s``), which was corrected."
alternative[] = "Implement the missing method(s), with a body, in the enum or the anonymous class."
alternative[] = "Remove the ``implements`` clause that brings in the abstract method."
related[] = "%s-%s-contains-%d-abstract-method%s-and-must-therefore-be-declared-abstract-or-implement-the-remaining-method%s-("
related[] = "class-%s-contains-%d-abstract-method%s-and-must-therefore-be-declared-abstract-or-implement-the-remaining-methods"
related[] = "anonymous-class-method-%s()-must-not-be-abstract"
related[] = "%s-method-%s::%s()-must-not-be-abstract"
examples[] = "Enum Suit must implement 1 abstract method (Colorful::color)"
examples[] = "Class Colorful@anonymous must implement 1 abstract method (Colorful::color)"
