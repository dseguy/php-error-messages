id = "calling-ldap_exop()-with-more-than-4-arguments-is-deprecated,-use-ldap_exop_sync()-instead"
error = "Calling ldap_exop() with more than 4 arguments is deprecated, use ldap_exop_sync() instead"
phpVersion = "8.3+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

$ldap = ldap_connect('ldap://ldap.example.com');
ldap_bind($ldap);

ldap_exop($ldap, LDAP_EXOP_WHO_AM_I, null, null, $response_data, $response_oid);

?>"
description = "``ldap_exop()`` used to serve two purposes at once: sending an LDAP extended operation and, when called with 5 or 6 arguments, also synchronously waiting for the response and returning its data and OID through reference parameters (``&$response_data``, ``&$response_oid``).

Mixing the asynchronous, low-level operation with an optional synchronous, high-level convenience wrapper in a single overloaded function made the API harder to reason about. Calling ``ldap_exop()`` with more than 4 arguments is now deprecated in favor of a dedicated synchronous function."
alternative[] = "Use ``ldap_exop_sync()`` when you need to send the operation and immediately read back its response data and OID."
