id = "passing-the-$mode-parameter-is-deprecated-since-8.4,-as-it-has-been-ignored-since-8.1"
error = "Passing the $mode parameter is deprecated since 8.4, as it has been ignored since 8.1"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

\$mysqli = new mysqli('localhost', 'user', 'password', 'database');
\$mysqli->query('SELECT id FROM users', MYSQLI_USE_RESULT);

\$result = \$mysqli->store_result(MYSQLI_STORE_RESULT_COPY_DATA);

?>"
description = "``mysqli_store_result()`` (and ``mysqli::store_result()``) used to accept an optional ``\$mode`` flag, ``MYSQLI_STORE_RESULT_COPY_DATA``, telling mysqlnd to copy fetched data out of its internal buffer instead of referencing it directly. As of PHP 8.1, mysqlnd's internal buffering changed and this flag no longer has any effect: the parameter is silently ignored no matter what is passed.

Since code could keep passing ``\$mode`` for years without any indication that it did nothing, PHP 8.4 adds a deprecation notice specifically for that: passing the parameter at all, regardless of its value, is now reported as deprecated."
alternative[] = "Stop passing the $mode argument (and the MYSQLI_STORE_RESULT_COPY_DATA constant) to store_result(); it has had no effect since PHP 8.1."
related[] = ""
examples[] = "Passing the $mode parameter is deprecated since 8.4, as it has been ignored since 8.1"
tags[] = "mysqli"
tags[] = "deprecated"
seeAlso["mysqli::store_result()"] = "https://www.php.net/manual/en/mysqli.store-result.php"
seeAlso["PHP RFC: Deprecations for PHP 8.4"] = "https://wiki.php.net/rfc/deprecations_php_8_4"
features[] = "mysqli"
previous = ""
next = ""
extension[] = "mysqli"
analyzer[] = ""
changedBehavior[] = "The $mode parameter (MYSQLI_STORE_RESULT_COPY_DATA) already stopped having any effect in PHP 8.1, without any notice. PHP 8.4 only adds the deprecation notice; the (lack of) behavior itself is unchanged."