id = "calling-%s(resource-$stub"
error = "Calling %s(resource $stub"
phpVersion = "8.3+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

$phar = new Phar('/tmp/test.phar');

$stream = fopen('php://memory', 'r+');
fwrite($stream, \"<?php __HALT_COMPILER(); ?>\");
rewind($stream);

// Passing a resource plus an explicit length is the overloaded,
// now-deprecated signature.
$phar->setStub($stream, 20);

fclose($stream);

?>"
description = "``Phar::setStub()`` (and ``PharData::setStub()``) historically accepted two different signatures: a plain ``string $stub``, or a ``resource $stub`` together with an ``int $length`` telling PHP how many bytes to read from the stream. Overloaded signatures like this make the function harder to reason about and to type-check.

As of PHP 8.3, calling the method with the ``(resource $stub, int $length)`` form is deprecated in favour of the single ``string $stub`` signature; the resource variant will be removed in PHP 9.0."
alternative[] = "Read the resource into a string first and pass that string: $phar->setStub(stream_get_contents($stub))."
alternative[] = "If the resource is a file, read its contents with file_get_contents() instead of fopen()+fread()."
related[] = ""
examples[] = "Calling Phar::setStub(resource $stub, int $length) is deprecated"
examples[] = "Calling PharData::setStub(resource $stub, int $length) is deprecated"
tags[] = "deprecation"
tags[] = "phar"
seeAlso[Phar::setStub] = "https://www.php.net/manual/en/phar.setstub.php"
seeAlso[PHP RFC: Deprecate functions with overloaded signatures] = "https://wiki.php.net/rfc/deprecate_functions_with_overloaded_signatures"
features[] = "phar"
