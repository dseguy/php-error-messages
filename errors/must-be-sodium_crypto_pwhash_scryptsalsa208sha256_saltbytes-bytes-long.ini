id = "must-be-sodium_crypto_pwhash_scryptsalsa208sha256_saltbytes-bytes-long"
error = "must be SODIUM_CRYPTO_PWHASH_SCRYPTSALSA208SHA256_SALTBYTES bytes long"
phpVersion = "7.2+"
level = "E_ERROR"
exception = "SodiumException"
code = "<?php

// The salt must be exactly SODIUM_CRYPTO_PWHASH_SCRYPTSALSA208SHA256_SALTBYTES (32) bytes long
$key = sodium_crypto_pwhash_scryptsalsa208sha256(
    16,
    'password',
    'short',
    SODIUM_CRYPTO_PWHASH_SCRYPTSALSA208SHA256_OPSLIMIT_INTERACTIVE,
    SODIUM_CRYPTO_PWHASH_SCRYPTSALSA208SHA256_MEMLIMIT_INTERACTIVE
);

?>"
description = "``sodium_crypto_pwhash_scryptsalsa208sha256()`` derives a key from a password using the scrypt algorithm, and it needs a salt as its third argument. The salt must be exactly ``SODIUM_CRYPTO_PWHASH_SCRYPTSALSA208SHA256_SALTBYTES`` bytes long, which is 32 bytes. Any other length throws a ``SodiumException``.

This constant is different from ``SODIUM_CRYPTO_PWHASH_SALTBYTES``, which is used by ``sodium_crypto_pwhash()``. A salt that works with one function does not necessarily work with the other.

The salt should be random and unique for each password. Generate it with ``random_bytes(SODIUM_CRYPTO_PWHASH_SCRYPTSALSA208SHA256_SALTBYTES)``, and store it with the derived key."
alternative[] = "Generate the salt with ``random_bytes(SODIUM_CRYPTO_PWHASH_SCRYPTSALSA208SHA256_SALTBYTES)``, so its length always matches."
alternative[] = "Check that the constant matches the function: use ``SODIUM_CRYPTO_PWHASH_SALTBYTES`` with ``sodium_crypto_pwhash()``, and this constant with ``sodium_crypto_pwhash_scryptsalsa208sha256()``."
related[] = "must-be-sodium_crypto_pwhash_saltbytes-bytes-long"
examples[] = "sodium_crypto_pwhash_scryptsalsa208sha256(): Argument #3 ($salt) must be SODIUM_CRYPTO_PWHASH_SCRYPTSALSA208SHA256_SALTBYTES bytes long"
