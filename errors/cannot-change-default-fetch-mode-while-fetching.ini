id = "cannot-change-default-fetch-mode-while-fetching"
error = "Cannot change default fetch mode while fetching"
phpVersion = "8.2+"
level = "E_ERROR"
exception = "Error"
code = "<?php

class Test {
    public string $val1;
    public string $val2;

    public function __construct(mixed $stmt) {
        if ($stmt instanceof PDOStatement) {
            // Re-entrant call -- the statement is still fetching the current row
            $stmt->setFetchMode(PDO::FETCH_CLASS, self::class, [$this->val2]);
        }
    }
}

$stmt = $pdo->prepare('SELECT val1, val2 FROM example');
$stmt->setFetchMode(PDO::FETCH_CLASS, Test::class, [$stmt]);
$stmt->execute();

$stmt->fetch();

?>"
description = "``PDOStatement::setFetchMode()`` refuses to run while the statement is in the middle of fetching a row. This happens when ``PDO::FETCH_CLASS`` is used and the constructor of the target class receives the statement object itself (via the constructor arguments) and calls ``setFetchMode()`` on it before the current ``fetch()`` call has finished.

Prior to this guard, such a re-entrant call could corrupt the statement's internal fetch state and lead to a use-after-free. PDO now detects the situation and throws an ``Error`` instead."
alternative[] = "Call ``setFetchMode()`` before ``fetch()``/``fetchAll()`` starts, never from within a constructor triggered by the fetch itself."
alternative[] = "Avoid passing the live ``PDOStatement`` as a constructor argument to the fetched class; pass the data it needs instead."
alternative[] = "If the fetch mode must change mid-iteration, finish consuming the current row first, then call ``setFetchMode()`` before the next ``fetch()``."
related[] = ""
examples[] = ""
