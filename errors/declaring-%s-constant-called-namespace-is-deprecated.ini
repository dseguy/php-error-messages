id = "declaring-%s-constant-called-namespace-is-deprecated"
error = "Declaring %s constant called namespace is deprecated"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class Foo {
    const NAMESPACE = 'bar';
}

echo Foo::NAMESPACE;

?>"
description = "``namespace`` is a reserved word in PHP, but a historical lexer exception let it be used as the name of a class, interface, trait or enum constant, as well as a static property. PHP 8.6 deprecates that exception for constants, so that ``namespace`` can be reserved for a possible future ``::namespace`` pseudo-constant, analogous to the existing ``::class``.

The deprecation notice is emitted when the constant is declared, not when it is used."
alternative[] = "Rename the constant to something other than NAMESPACE."
related[] = "cannot-use-'namespace'-as-namespace-name"
related[] = "namespace-%s-is-an-invalid-class-name"
examples[] = "Declaring class constant \"namespace\" is deprecated"
examples[] = "Declaring interface constant \"namespace\" is deprecated"
examples[] = "Declaring enum constant \"namespace\" is deprecated"
tags[] = "deprecation"
tags[] = "reserved-word"
seeAlso[] = ""
features[] = "namespace"
previous = ""
next = ""
extension[] = "Core"
analyzer[] = ""
changedBehavior[] = "Previously, namespace could be freely used as the name of a class/interface/trait/enum constant. As of PHP 8.6, declaring it emits a deprecation notice, reserving the word for a possible future ::namespace pseudo-constant."