id = "producing-output-from-user-output-handler-%s-is-deprecated"
error = "Producing output from user output handler %s is deprecated"
phpVersion = "8.5+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

ob_start(function (string \$buffer): string {
    // Directly emitting output from the handler, instead of
    // only returning the transformed buffer.
    echo 'debug: ', strlen(\$buffer), \" bytes\\n\";

    return \$buffer;
});

echo 'Hello world';
ob_end_flush();

?>"
description = "A user output handler registered with ``ob_start()`` is expected to receive the current buffer contents and return the (possibly transformed) string to send further down the output stack. Historically, nothing prevented such a handler from also producing its own output directly (for instance with ``echo`` or ``print``), in addition to returning a value.

Output produced this way bypasses the normal buffering contract and is silently discarded, which usually indicates a bug in the handler rather than an intentional behavior. As of PHP 8.5.0, doing so raises a deprecation notice naming the offending handler."
alternative[] = "Only communicate the processed content through the handler's return value; do not ``echo``/``print`` from within it."
related[] = ""
examples[] = ""
tags[] = ""
seeAlso[] = ""
features[] = "output-buffering"
previous = ""
next = ""
extension[] = "core"
analyzer[] = "none"
changedBehavior[] = "ob_start"
