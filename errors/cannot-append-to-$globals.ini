id = "cannot-append-to-$globals"
error = "Cannot append to $GLOBALS"
phpVersion = "8.1+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

$GLOBALS[] = 'value';

?>"
description = "$GLOBALS is not a regular array: each of its entries is really a reference to a variable in the global scope, identified by its name. Appending with the empty-bracket operator, which would normally pick the next integer key, has no matching global variable to bind to, so PHP 8.1 turned this previously-meaningless operation into a compile-time error instead of silently creating a global variable literally named \"0\"."
alternative[] = "Assign to an explicit, named key instead: $GLOBALS['name'] = 'value';"
related[] = "cannot-use-[]-for-unsetting"
examples[] = ""
tags[] = ""
seeAlso[] = ""
features[] = "globals"
previous = ""
next = ""
extension[] = ""
analyzer[] = ""
changedBehavior[] = "As of PHP 8.1, $GLOBALS is treated more strictly by the compiler, and several previously-tolerated usages, including appending to it, now raise a compile error."