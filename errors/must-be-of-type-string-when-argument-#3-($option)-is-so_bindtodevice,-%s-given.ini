id = "must-be-of-type-string-when-argument-#3-($option)-is-so_bindtodevice,-%s-given"
error = "must be of type string when argument #3 ($option) is SO_BINDTODEVICE, %s given"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "TypeError"
code = "<?php

$socket = socket_create(AF_INET, SOCK_STREAM, SOL_TCP);

socket_set_option($socket, SOL_SOCKET, SO_BINDTODEVICE, 123);

?>"
description = "``SO_BINDTODEVICE`` (Linux) binds a socket to a specific network interface, identified by its name, e.g. ``\"eth0\"``. ``socket_set_option()`` requires ``$value`` (argument #4) to be a string for this option; any other type, such as the integer above, is rejected."
alternative[] = "Pass the network interface name as a string."
alternative[] = "Use php_uname() or /sys/class/net to discover the correct interface name if unsure."
related[] = "must-be-of-type-string-when-argument-#3-($option)-is-so_acceptfilter,-%s-given"
related[] = "must-be-of-type-string-when-argument-#3-($option)-is-tcp_congestion,-%s-given"
examples[] = "socket_set_option(): Argument #4 ($value) must be of type string when argument #3 ($option) is SO_BINDTODEVICE, int given"
tags[] = "sockets"
tags[] = "networking"
tags[] = "validation"
seeAlso[] = ""
features[] = "socket-options"
