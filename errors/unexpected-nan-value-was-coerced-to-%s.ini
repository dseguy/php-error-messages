id = "unexpected-nan-value-was-coerced-to-%s"
error = "unexpected NAN value was coerced to %s"
phpVersion = "8.1+"
level = "E_WARNING"
exception = ""
code = "<?php

// NAN coerced to int
$a = (int) NAN;
// $a = 0

// NAN coerced to string
$b = (string) NAN;
// $b = \"\" 

// NAN passed to an integer parameter
function foo(int \$x) {} 
foo(NAN);

?>"
description = "When a ``NAN`` (Not a Number) float value is coerced to another type such as ``int`` or ``string``, PHP emits this warning. ``NAN`` is a special float value that represents an undefined or unrepresentable result of a floating-point operation.

Coercing ``NAN`` to ``int`` produces ``0``, and coercing it to ``string`` produces an empty string. These results are misleading since ``NAN`` is not equivalent to zero or empty. The warning alerts developers that a ``NAN`` value is silently converted, which is almost certainly unintended.

``NAN`` is produced by operations like ``acos(8)``, ``log(-1)``, ``sqrt(-1)``, or ``0.0/0.0``."
alternative[] = "Check for ``is_nan()`` before coercing or passing the value to a typed parameter."
alternative[] = "Handle ``NAN`` explicitly at its source by validating the result of math operations."
alternative[] = "Use ``is_finite()`` to filter out both ``NAN`` and ``INF`` before using a float value."
related[] = "must-be-a-finite-value"
related[] = "a-non-numeric-value-encountered"
examples[] = "unexpected NAN value was coerced to int"
examples[] = "unexpected NAN value was coerced to string"
tags[] = "nan"
tags[] = "coercion"
tags[] = "type-juggling"
seeAlso["float"] = "https://www.php.net/manual/en/language.types.float.php"
seeAlso["is_nan"] = "https://www.php.net/manual/en/function.is-nan.php"
