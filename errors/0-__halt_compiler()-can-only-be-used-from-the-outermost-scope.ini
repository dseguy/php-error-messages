id = "0-__halt_compiler()-can-only-be-used-from-the-outermost-scope"
error = "0 __HALT_COMPILER() can only be used from the outermost scope"
phpVersion = "5.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function boot() {
	__halt_compiler();
}

boot();

?>"
description = "__HALT_COMPILER() stops the compiler at the exact point it is encountered; everything that follows in the file is no longer parsed as PHP code but kept as raw data, readable through the __COMPILER_HALT_OFFSET__ constant and a file handle on the same script. Because it changes how the rest of the file is interpreted, it is only meaningful once, at the very top level of the file, and cannot be placed inside a function, a class, a conditional block, or any other nested structure. The leading \"0\" in this entry's error text is a data artifact and not part of the actual PHP message."
alternative[] = "Move the __halt_compiler() call out of the function/class/block, to the outermost level of the file."
