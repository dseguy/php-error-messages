id = "passing-a-secret-of-a-type-other-than-string-is-deprecated-because-it-implicitly-converts-to-a-string,-potentially-hiding-bugs"
error = "Passing a secret of a type other than string is deprecated because it implicitly converts to a string, potentially hiding bugs"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

try {
    // 'secret' is documented as a string; passing an int silently
    // converts it with (string) instead of being used as given.
    hash('xxh3', 'some data', false, ['secret' => 12345]);
} catch (\Throwable $e) {
    // xxh3 also requires the secret to be at least 136 bytes long once
    // converted to a string -- unrelated to the type deprecation itself.
}

?>"
description = "The ``xxh3`` and ``xxh128`` hashing algorithms accept an optional ``'secret'`` entry in the options array passed to ``hash()``/``hash_init()``, used instead of a plain integer seed to initialize the hash. It is documented as a ``string``, but PHP did not previously enforce that: any other type was silently converted with an implicit ``(string)`` cast, so a programmer who passed, say, an ``int`` would get a working-looking hash computed from an unintended value, with no indication anything was wrong.

As of PHP 8.4, passing a non-string 'secret' emits this deprecation notice before the implicit conversion happens, so the mistake is no longer silent. A future version is expected to throw a ``ValueError`` instead."
alternative[] = "Pass a string directly for 'secret', e.g. a value produced by random_bytes()."
alternative[] = "If the value naturally isn't a string, convert it explicitly and document why, e.g. ['secret' => (string) $value]."
alternative[] = "Use the 'seed' option (an int) instead of 'secret' when a full custom secret is not actually needed."
related[] = "passing-a-seed-of-a-type-other-than-int-is-deprecated-because-it-is-ignored"
related[] = "passing-a-seed-of-a-type-other-than-int-is-deprecated-because-it-is-the-same-as-setting-the-seed-to-0"
examples[] = "hash(): Passing a secret of a type other than string is deprecated because it implicitly converts to a string, potentially hiding bugs"
tags[] = "deprecation"
tags[] = "hash"
seeAlso[PHP RFC: Deprecations for PHP 8.4] = "https://wiki.php.net/rfc/deprecations_php_8_4"
seeAlso[hash manual] = "https://www.php.net/manual/en/function.hash.php"
