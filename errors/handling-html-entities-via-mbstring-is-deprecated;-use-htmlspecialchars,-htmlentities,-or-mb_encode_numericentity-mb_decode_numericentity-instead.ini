id = "handling-html-entities-via-mbstring-is-deprecated;-use-htmlspecialchars,-htmlentities,-or-mb_encode_numericentity-mb_decode_numericentity-instead"
error = "Handling HTML entities via mbstring is deprecated; use htmlspecialchars, htmlentities, or mb_encode_numericentity/mb_decode_numericentity instead"
phpVersion = "8.2+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

mb_convert_encoding('foo', 'HTML-ENTITIES');

?>"
description = "Since PHP 8.2, several pseudo-encodings were dropped from mbstring, including ``HTML-ENTITIES``, which converted characters to and from their HTML numeric/named entity representation.

This functionality overlapped with dedicated, better-maintained functions, and its removal simplifies the mbstring encoding conversion tables. It remains usable until PHP 9, when it will be removed entirely."
alternative[] = "Use ``htmlspecialchars()`` or ``htmlentities()`` to encode text as HTML entities."
alternative[] = "Use ``mb_encode_numericentity()``/``mb_decode_numericentity()`` for numeric entity conversion."
related[] = "handling-qprint-via-mbstring-is-deprecated;-use-quoted_printable_encode-quoted_printable_decode-instead"
related[] = "handling-base64-via-mbstring-is-deprecated;-use-base64_encode-base64_decode-instead"
related[] = "handling-uuencode-via-mbstring-is-deprecated;-use-convert_uuencode-convert_uudecode-instead"
examples[] = ""
