id = "variadic-parameter-cannot-have-a-default-value"
error = "Variadic parameter cannot have a default value"
phpVersion = "5.6+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function foo(...$a = []) {}

?>"
description = "A variadic parameter, marked with ``...``, already collects zero or more arguments into an array: when no argument is passed for it, it is simply an empty array. There is no meaning in giving it a default value, since the parameter itself can never be missing from the call, only empty.

This is a compile time check."
alternative[] = "Remove the default value from the variadic parameter."
alternative[] = "Check inside the function body whether the collected array is empty, instead of relying on a default value."
related[] = "only-the-last-parameter-can-be-variadic"
related[] = "cannot-declare-variadic-promoted-property"
