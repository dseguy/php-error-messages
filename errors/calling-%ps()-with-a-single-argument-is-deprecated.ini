id = "calling-%ps()-with-a-single-argument-is-deprecated"
error = "Calling %pS() with a single argument is deprecated"
phpVersion = "8.3+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class X {
    public static int $count = 0;
}

$prop = new ReflectionProperty(X::class, 'count');

// deprecated: the object argument is missing
$prop->setValue(42);

var_dump(X::$count);

?>"
description = "``ReflectionProperty::setValue()`` accepts an object as its 1st argument and the new value as its 2nd argument. Static properties have no associated object, so PHP historically allowed calling ``setValue()`` with a single argument (the value only) to set a static property.

Since this single-argument form is ambiguous with the two-argument form used for instance properties, it is deprecated as of PHP 8.3. The 1st argument must now be passed explicitly, using ``null`` to mean \"this is a static property\"."
alternative[] = "Call ``setValue(null, $value)`` instead of ``setValue($value)`` to set a static property."
alternative[] = "For instance properties, always pass the object as the 1st argument: ``setValue($object, $value)``."
alternative[] = "Use ``ReflectionClass::setStaticPropertyValue()`` as an alternative way to set a static property by reflection."
related[] = "calling-%ps()-with-a-1st-argument-which-is-not-null-or-an-object-is-deprecated"
examples[] = "Calling ReflectionProperty::setValue() with a single argument is deprecated"
tags[] = "reflection"
tags[] = "static-property"
tags[] = "deprecation"
seeAlso[ReflectionProperty::setValue] = "https://www.php.net/manual/en/reflectionproperty.setvalue.php"
seeAlso[ReflectionClass::setStaticPropertyValue] = "https://www.php.net/manual/en/reflectionclass.setstaticpropertyvalue.php"
features[] = "reflection"
features[] = "static-property"
