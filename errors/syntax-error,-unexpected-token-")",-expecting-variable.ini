id = "syntax-error,-unexpected-token-\")\",-expecting-variable"
error = "syntax error, unexpected token \")\", expecting variable"
phpVersion = "8.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function foo(string $a, #[SomeAttribute]) {}

?>"
description = "An attribute placed inside a parameter list must be immediately followed by the parameter it decorates. Here, the attribute is the last thing before the closing parenthesis, so PHP expects a variable to declare the parameter, but finds the closing parenthesis instead."
alternative[] = "Add the missing parameter, with its ``$`` variable, right after the attribute."
alternative[] = "Remove the trailing attribute if no extra parameter was intended."
related[] = "syntax-error,-unexpected-token-\"#[\",-expecting-\")\""
related[] = "syntax-error,-unexpected-token-\"{\",-expecting-variable"
related[] = "syntax-error,-unexpected-variable-\"$%s\",-expecting-\")\""
related[] = "syntax-error,-unexpected-variable-\"$task\",-expecting-\")\""
examples[] = ""
