id = "cannot-combine-nullsafe-operator-with-closure-creation"
error = "Cannot combine nullsafe operator with Closure creation"
phpVersion = "8.1+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class X {
    public function foo() {}
}

$x = new X();

$closure = $x?->foo(...);

?>"
description = "PHP 8.1 introduced the first class callable syntax, using ``(...)`` to create a ``Closure`` from a method or function call, without invoking it.

The nullsafe operator ``?->`` short-circuits the call when the object is ``null``, evaluating to ``null`` instead. Combined with Closure creation, this would mean the expression sometimes returns a ``Closure`` and sometimes ``null``, which is not a coherent result for the engine to compile.

This combination is therefore forbidden, and detected at compile time."
alternative[] = "Use the ``->`` operator instead of ``?->``, making sure the object is never ``null`` at that point."
alternative[] = "Check the object for ``null`` explicitly, before creating the Closure."
related[] = "can't-use-nullsafe-operator-in-write-context"
