id = "parameter-$%s-of-%s-hook-%s::$%s-must-not-have-a-default-value"
error = "Parameter $%s of %s hook %s::$%s must not have a default value"
phpVersion = "8.4+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class X
{
    public string $property {
        set(string $value = 'default') {
            $this->property = $value;
        }
    }
}

?>"
description = "The parameter of a ``set`` property hook cannot declare a default value. The hook is always invoked with the value being assigned to the property, so a default value would never actually be used, and PHP rejects it as meaningless."
alternative[] = "Remove the default value from the hook's parameter."
alternative[] = "If a fallback value is needed, assign a default to the property itself, or handle it inside the hook's body."
related[] = "parameter-$%s-of-%s-hook-%s::$%s-must-not-be-pass-by-reference"
related[] = "parameter-$%s-of-%s-hook-%s::$%s-must-not-be-variadic"
related[] = "%s-hook-of-property-%s::$%s-must-accept-exactly-one-parameters"
examples[] = "Parameter $value of set hook X::$property must not have a default value"
tags[] = "property hook"
tags[] = "default value"
seeAlso[] = ""
features[] = "property-hook"
