id = "looking-up-the-dsn-from-a-uri-is-deprecated-due-to-possible-security-concerns-with-dsns-coming-from-remote-uris"
error = "Looking up the DSN from a URI is deprecated due to possible security concerns with DSNs coming from remote URIs"
phpVersion = "8.5+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

$pdo = new PDO('uri:file:///etc/myapp/dsn.txt');

?>"
description = "PDO supports a ``uri:`` DSN prefix: instead of passing the real DSN, an application could pass ``uri:`` followed by a URI, and PDO would fetch the actual DSN string from the resource that URI points to. The URI could name a local file, but could also be a remote URL fetched through a stream wrapper.

Fetching connection credentials from an arbitrary, potentially remote, URI on every connection is risky: with drivers such as SQLite it could be abused to read arbitrary files on the server, and remote URIs add an unpredictable performance cost and an extra trust boundary. This lookup mechanism is therefore deprecated."
alternative[] = "Read the DSN from the file yourself in userland code (for example with ``file_get_contents()`` against a local, trusted path) and pass the resulting string directly to the ``PDO`` constructor."
related[] = ""
examples[] = ""
tags[] = "security"
tags[] = "deprecated"
seeAlso[] = ""
