id = "intllistformatter-object-is-already-constructed"
error = "IntlListFormatter object is already constructed"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "Error"
code = "<?php

$formatter = new IntlListFormatter('en_US');

// Calling the constructor a second time on the same instance
$formatter->__construct('fr_FR');

?>"
description = "``IntlListFormatter``, added in PHP 8.5, wraps ICU's list formatter to render lists such as ``\"a, b, and c\"`` according to locale rules. Like other ``intl`` classes, its constructor guards against being run twice on the same object: the first successful call allocates the underlying ICU formatter, and a second call would leak that resource and leave the object in an inconsistent state.

Calling ``__construct()`` explicitly a second time -- directly, or indirectly through code that re-runs construction on an already built instance -- throws this error."
alternative[] = "Create a new ``IntlListFormatter`` instance instead of reusing and reconstructing the same object."
alternative[] = "Never call ``__construct()`` manually after the object has already been created with ``new``."
related[] = "datetimezone-object-is-unconstructed"
