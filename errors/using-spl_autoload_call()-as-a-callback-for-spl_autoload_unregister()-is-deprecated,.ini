id = "using-spl_autoload_call()-as-a-callback-for-spl_autoload_unregister()-is-deprecated,"
error = "Using spl_autoload_call() as a callback for spl_autoload_unregister() is deprecated,"
phpVersion = "8.5+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

spl_autoload_register(function ($class) {
    // custom autoloading logic
});

// Passing the internal spl_autoload_call() as a callback is a
// magic value that unregisters every registered autoloader at once.
spl_autoload_unregister('spl_autoload_call');

?>"
description = "``spl_autoload_unregister()`` normally removes one specific autoload function that was previously registered with ``spl_autoload_register()``. As an undocumented side effect, passing the engine's own ``spl_autoload_call()`` function as the callback acted as a magic value that unregistered *all* autoloaders at once, regardless of how many were registered or by which part of the code.

This implicit, all-or-nothing shortcut is deprecated as of PHP 8.5 because it is easy to trigger by accident (any code that unregisters its own autoloader using the wrong callable name) and because it silently affects autoloaders registered by unrelated libraries. Use ``spl_autoload_functions()`` to list every registered autoloader and unregister them individually instead."
alternative[] = "Iterate over spl_autoload_functions() and call spl_autoload_unregister() on each entry to unregister every autoloader explicitly."
alternative[] = "Keep a reference to the specific autoloader callable your own code registered, and unregister only that one instead of relying on the magic shortcut."
related[] = ""
examples[] = "Using spl_autoload_call() as a callback for spl_autoload_unregister() is deprecated, use spl_autoload_functions() and spl_autoload_unregister() on each entry instead"
tags[] = "deprecation"
tags[] = "autoload"
tags[] = "spl"
seeAlso[spl_autoload_unregister] = "https://www.php.net/manual/en/function.spl-autoload-unregister.php"
