seeAlso[spl_autoload_functions] = "https://www.php.net/manual/en/function.spl-autoload-functions.php"
seeAlso[PHP RFC: Deprecations for PHP 8.5] = "https://wiki.php.net/rfc/deprecations_php_8_5"
