id = "decrement-on-non-numeric-string-has-no-effect-and-is-deprecated"
error = "Decrement on non-numeric string has no effect and is deprecated"
phpVersion = "8.3+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

$str = 'abc';
$str--;
var_dump($str);
// still string(3) \"abc\" -- the decrement had no effect at all

?>"
description = "Unlike ``++``, which performs a Perl-style alphanumeric string increment (turning ``'z'`` into ``'aa'``, for example), the ``--`` operator was never given an equivalent behaviour for non-numeric strings: applying it to something like ``'abc'`` simply leaves the string untouched. That asymmetry -- ``++`` transforms the string but ``--`` silently no-ops -- is confusing and easy to miss, since no warning was previously raised.

As of PHP 8.3, decrementing a non-numeric, non-empty string emits this deprecation notice so the no-op is no longer silent. The string itself is still left unchanged, but relying on that will trigger a warning today and is expected to change behaviour in PHP 9.0."
alternative[] = "Do not use -- on strings that are not guaranteed to be numeric; check is_numeric() first if the intent really is arithmetic."
alternative[] = "If the goal was a Perl-style string decrement, use str_decrement() instead, which raises a ValueError for invalid input rather than doing nothing."
alternative[] = "Cast to int explicitly if an arithmetic decrement starting from 0 was intended: $n = (int) $str; $n--;"
related[] = "decrement-on-empty-string-is-deprecated-as-non-numeric"
related[] = "increment-on-non-alphanumeric-string-is-deprecated"
