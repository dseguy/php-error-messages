id = "case-%s-of-non-backed-enum-%s-must-not-have-a-value"
error = "Case %s of non-backed enum %s must not have a value"
phpVersion = "8.1+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

enum Suit
{
    case Hearts = 1;
    case Spades;
}

?>"
description = "An enum is either purely a set of named cases (a ``pure`` enum), or it is a ``backed`` enum, where every case is associated with an ``int`` or ``string`` value declared after the enum name, like ``enum Suit: int``.

Once an enum does not declare a backing type, none of its cases may be given a value. Assigning a value to a case, like ``case Hearts = 1;``, requires the enum itself to declare a backing type."
alternative[] = "Remove the value from the case declaration, to keep the enum a pure enum."
alternative[] = "Add a backing type to the enum declaration, such as ``enum Suit: int``, so every case can carry a value."
related[] = "enum-case-type-%s-does-not-match-enum-backing-type-%s"
related[] = "enum-backing-type-must-be-int-or-string"
related[] = "duplicate-value-in-enum-%s-for-cases-%s-and-%s"
examples[] = "Case Hearts of non-backed enum Suit must not have a value"
