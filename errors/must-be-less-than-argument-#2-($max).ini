id = "must-be-less-than-argument-#2-($max)"
error = "must be less than argument #2 ($max)"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

gmp_random_range(10, 5);

?>"
description = "``gmp_random_range()`` returns a random GMP number in the inclusive range ``[$min, $max]``. That range only makes sense when ``$min`` is strictly less than ``$max``.

This has thrown a ``ValueError`` for a non-positive range since PHP 8.0; PHP 8.6 only corrected the argument name referenced in the message, from the stub's actual parameter name ``$max`` (it previously said ``$maximum``, which never matched the real signature)."
alternative[] = "Make sure $min is strictly less than $max when calling gmp_random_range()."
related[] = ""
examples[] = "gmp_random_range(): Argument #1 ($min) must be less than argument #2 ($max)"
tags[] = "gmp"
tags[] = "math"
tags[] = "validation"
seeAlso[] = ""
features[] = "gmp-random"
previous = ""
next = ""
extension[] = "gmp"
analyzer[] = ""
changedBehavior[] = "PHP 8.0 through 8.5 threw the same ValueError but referenced the second argument as \"$maximum\", which did not match the function's actual $max parameter name."
