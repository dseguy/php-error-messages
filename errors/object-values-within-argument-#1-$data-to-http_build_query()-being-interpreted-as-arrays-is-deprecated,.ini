id = "object-values-within-argument-#1-$data-to-http_build_query()-being-interpreted-as-arrays-is-deprecated,"
error = "object values within argument #1 $data to http_build_query() being interpreted as arrays is deprecated,"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class KeyVal {
    public $public = 'input';
}

$o = new KeyVal();
$nested = new KeyVal();
$o->public = $nested;

echo http_build_query($o);

?>"
description = "``http_build_query()`` walks its ``$data`` argument recursively, and treats any object value it finds along the way — not just the top-level argument — as if it were an array, iterating its public properties to build nested query keys such as ``public[public]=input``. PHP 8.6 deprecates this implicit array-like treatment of nested object values, on top of the separate deprecation for passing an object as the top-level ``$data`` argument itself."
alternative[] = "Convert nested objects to arrays with ``get_object_vars()`` before assigning them, so the structure passed to http_build_query() is plain arrays all the way down."
alternative[] = "Restructure the data so query parameters are built from arrays rather than objects."
related[] = "passing-an-object-for-argument-#1-$data-to-http_build_query()-is-deprecated,-call-get_object_vars()-first-instead"
examples[] = "http_build_query(): object values within argument #1 $data to http_build_query() being interpreted as arrays is deprecated, instead the $data argument should be preprocessed with get_object_vars()"
tags[] = "deprecation"
seeAlso[] = ""
features[] = "http"
previous = "passing-an-object-for-argument-#1-$data-to-http_build_query()-is-deprecated,-call-get_object_vars()-first-instead"
next = ""
