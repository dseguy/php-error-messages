id = "use-of-warnings-for-sqlite3-is-deprecated"
error = "Use of warnings for SQLite3 is deprecated"
phpVersion = "8.3+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

\$db = new SQLite3(':memory:');

// Explicitly keeps the legacy, warning-based error mode.
\$db->enableExceptions(false);

?>"
description = "The SQLite3 extension historically reported errors (such as a failed query) by emitting an ``E_WARNING`` and returning ``false``, which is inconsistent with the exception-based error handling used elsewhere in PHP, and requires manual checking of every return value. ``SQLite3::enableExceptions(true)`` switches to throwing ``SQLite3Exception`` instead, and has been available for a long time as an opt-in.

As of PHP 8.3.0, the legacy warning-based mode is deprecated: calling ``SQLite3::enableExceptions()`` with ``false`` (or not calling it at all, since ``false`` is the default) raises a deprecation notice."
alternative[] = "Call ``\$db->enableExceptions(true)`` right after opening the connection, and handle ``SQLite3Exception`` instead of checking return values for ``false``."
