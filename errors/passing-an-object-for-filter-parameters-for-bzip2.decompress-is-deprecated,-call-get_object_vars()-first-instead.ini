id = "passing-an-object-for-filter-parameters-for-bzip2.decompress-is-deprecated,-call-get_object_vars()-first-instead"
error = "Passing an object for filter parameters for bzip2.decompress is deprecated, call get_object_vars() first instead"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class ParamsDecompress {
    public bool $concatenated = true;
    public bool $small = true;
}

$fp = fopen('php://output', 'w');
stream_filter_append($fp, 'bzip2.decompress', STREAM_FILTER_WRITE, new ParamsDecompress());

?>"
description = "The ``bzip2.decompress`` stream filter accepts its parameters as an associative array (``small``, ``concatenated``), but has always also accepted an object, or a plain boolean, reading the array-equivalent keys off an object's public properties. PHP 8.6 deprecates passing an object here, matching the equivalent deprecation for ``bzip2.compress`` and for the zlib filters."
alternative[] = "Convert the object to an array first with ``get_object_vars($obj)`` and pass that as the filter parameters."
alternative[] = "Pass an associative array literal instead of building an options object."
related[] = "passing-an-object-for-filter-parameters-for-bzip2.compress-is-deprecated,-call-get_object_vars()-first-instead"
related[] = "passing-an-object-for-filter-parameters-for-%s-is-deprecated,-call-get_object_vars()-first-instead"
examples[] = ""
tags[] = "deprecation"
seeAlso[] = ""
