id = "multiple-%s-modifiers-are-not-allowed"
error = "Multiple %s modifiers are not allowed"
phpVersion = "7.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class X {
    final final function foo() {}
}

?>"
description = "A single modifier keyword (``final``, ``static``, ``readonly``, or a visibility keyword such as ``public``, ``protected``, ``private``) is enough to apply that property to a class member. Repeating the same kind of modifier twice in a declaration is redundant and rejected by the parser.

This is a generic, templated message: the concrete modifier name takes the place of ``%s``. There are dedicated, more specific messages for each modifier family: ``final``, ``static``, ``readonly``, and the access-type (visibility) modifiers."
alternative[] = "Remove the duplicate modifier, keeping only one occurrence."
related[] = "multiple-final-modifiers-are-not-allowed"
related[] = "multiple-static-modifiers-are-not-allowed"
related[] = "multiple-readonly-modifiers-are-not-allowed"
related[] = "multiple-access-type-modifiers-are-not-allowed"
