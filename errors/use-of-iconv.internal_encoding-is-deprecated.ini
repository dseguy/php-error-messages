id = "use-of-iconv.internal_encoding-is-deprecated"
error = "Use of iconv.internal_encoding is deprecated"
phpVersion = "5.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

ini_set('iconv.internal_encoding', 'UTF-8');

?>"
description = "``iconv.internal_encoding`` used to control the encoding the ``iconv_*()`` functions assumed for strings when no encoding was given explicitly, alongside the separate, more general ``mbstring.internal_encoding``/``mbstring.language`` and the character encoding used when generating output. Having several overlapping encoding-related INI settings, each affecting only part of the request, was a frequent source of mismatched-encoding bugs.

As of PHP 5.6, setting ``iconv.internal_encoding`` (whether in php.ini or via ``ini_set()``/``iconv_set_encoding()``) emits this deprecation notice; the single, extension-agnostic ``default_charset`` setting should be used instead."
alternative[] = "Leave iconv.internal_encoding unset and rely on default_charset instead."
alternative[] = "Pass the encoding explicitly to each iconv_*() call rather than relying on any implicit internal encoding."
related[] = "use-of-iconv.input_encoding-is-deprecated"
related[] = "use-of-iconv.output_encoding-is-deprecated"
examples[] = "ini_set(): Use of iconv.internal_encoding is deprecated"
examples[] = "iconv_set_encoding(): Use of iconv.internal_encoding is deprecated"
tags[] = "deprecation"
tags[] = "iconv"
tags[] = "ini-setting"
seeAlso[default_charset manual] = "https://www.php.net/manual/en/ini.core.php#ini.default-charset"
seeAlso[iconv runtime configuration manual] = "https://www.php.net/manual/en/iconv.configuration.php"
features[] = "iconv"
features[] = "directive"
