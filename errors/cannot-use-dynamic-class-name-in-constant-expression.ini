id = "cannot-use-dynamic-class-name-in-constant-expression"
error = "Cannot use dynamic class name in constant expression"
phpVersion = "8.1+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

$className = 'DateTime';

class Bar {
	public function baz($obj = new $className()) {}
}

?>"
description = "\"New in initializers\" (PHP 8.1) lets new SomeClass(...) appear in constant-expression contexts, such as default parameter values, but only when the class name is written literally, or via self/parent, something resolvable without evaluating an arbitrary expression. A dynamic class name taken from a variable or another expression cannot be resolved once and for all in that fixed, deferred context, so it is rejected at compile time."
alternative[] = "Use a literal class name instead of a variable."
alternative[] = "Move the object creation into the function body instead of the parameter default."
related[] = "cannot-use-anonymous-class-in-constant-expression"
related[] = "static::-\"-is-not-allowed-in-compile-time-constants"
