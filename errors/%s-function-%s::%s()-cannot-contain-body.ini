id = "%s-function-%s::%s()-cannot-contain-body"
error = "%s function %s::%s() cannot contain body"
phpVersion = "5.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

interface Colorful {
    function color() {
        return 'red';
    }
}

?>"
description = "A method that is abstract -- either explicitly declared ``abstract``, or implicitly abstract because it belongs to an interface -- is only a signature: it must not have an implementation.

The first ``%s`` in the message is ``Interface`` when the method is declared inside an ``interface``, and ``Abstract`` when it is an explicitly ``abstract`` method of a class or trait."
alternative[] = "Remove the method body, keeping only the signature followed by a semicolon."
alternative[] = "Remove the `abstract` keyword, or move the method out of the interface, if it should have an implementation."
related[] = "%s-method-%s::%s()-must-not-be-abstract"
related[] = "non-abstract-method-%s::%s()-must-contain-body"
examples[] = "Interface function Colorful::color() cannot contain body"
examples[] = "Abstract function C::color() cannot contain body"
