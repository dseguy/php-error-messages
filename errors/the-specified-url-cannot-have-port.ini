id = "the-specified-url-cannot-have-port"
error = "The specified URL cannot have port"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "Uri\\WhatWg\\InvalidUrlException"
code = "<?php

use Uri\WhatWg\Url;

$url = new Url('file:///path/to/file');

$url = $url->withPort(8080);

?>"
description = "The WHATWG URL Standard, implemented by the ``Uri\\WhatWg\\Url`` class introduced in PHP 8.5, forbids credentials and a port on ``file:`` URLs: a local file path has no notion of a remote network endpoint. Calling ``withPort()`` on a URL whose scheme is ``file`` therefore throws instead of silently producing an invalid URL."
alternative[] = "Do not set a port on a ``file:`` URL."
alternative[] = "Use a scheme that supports a port component, such as ``http`` or ``ftp``, if a network endpoint is actually needed."
related[] = "the-specified-url-cannot-have-username"
related[] = "the-specified-url-cannot-have-password"
