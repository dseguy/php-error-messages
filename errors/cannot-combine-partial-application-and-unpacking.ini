id = "cannot-combine-partial-application-and-unpacking"
error = "Cannot combine partial application and unpacking"
phpVersion = "8.5+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function add($a, $b, $c) {
	return $a + $b + $c;
}

$args = [1, 2];

$curried = add(...$args, ...);

?>"
description = "PHP 8.5 extends the first-class callable syntax with partial application: a lone ... placeholder as the last argument of a call turns it into a Closure over the remaining, not-yet-supplied parameters. The same ... token is already used for argument unpacking (spreading an array's values as arguments), so a call that both spreads an array and ends with the placeholder is ambiguous between \"spread this array, then partially apply\" and a typo, and PHP rejects it outright."
alternative[] = "Wrap the call in an explicit closure instead: $curried = fn($c) => add(...$args, $c);"
related[] = "variadic-placeholder-may-only-appear-once"
related[] = "variadic-placeholder-must-be-last"
