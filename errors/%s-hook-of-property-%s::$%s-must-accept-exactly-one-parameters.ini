id = "%s-hook-of-property-%s::$%s-must-accept-exactly-one-parameters"
error = "%s hook of property %s::$%s must accept exactly one parameters"
phpVersion = "8.4+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class X
{
    public string $property {
        set($a, $b) {
            $this->property = $a;
        }
    }
}

?>"
description = "When the ``set`` hook of a property is declared with an explicit parameter list, that list must contain exactly one parameter: the value being assigned. Declaring zero, two, or more parameters is not allowed.

This is different from omitting the parenthesis altogether, in which case the hook implicitly receives the value through a variable named ``$value``."
alternative[] = "Keep only one parameter in the hook's parameter list."
alternative[] = "Remove the parameter list entirely and use the implicit ``$value`` variable instead."
related[] = "get-hook-of-property-%s::$%s-must-not-have-a-parameter-list"
related[] = "parameter-$%s-of-%s-hook-%s::$%s-must-not-be-variadic"
related[] = "parameter-$%s-of-%s-hook-%s::$%s-must-not-have-a-default-value"
related[] = "parameter-$%s-of-%s-hook-%s::$%s-must-not-be-pass-by-reference"
examples[] = "set hook of property X::$property must accept exactly one parameters"
tags[] = "property hook"
tags[] = "function"
