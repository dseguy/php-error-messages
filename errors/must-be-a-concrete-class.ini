id = "must-be-a-concrete-class"
error = "must be a concrete class"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

abstract class MyProtocol {}

stream_wrapper_register('myproto', MyProtocol::class);

?>"
description = "``stream_wrapper_register()`` and ``stream_filter_register()`` associate a class name with a protocol (or filter) name; the streams layer instantiates that class itself whenever the protocol is opened or the filter is applied. Passing an abstract class, or an interface, means there is nothing the streams layer could ever instantiate.

Previously, this only failed later, when PHP actually tried to open a stream using the unusable class. As of PHP 8.6, both functions check that the class is instantiable up front and throw immediately, instead of registering a class that is guaranteed to fail on first use."
alternative[] = "Register a concrete (non-abstract) class that implements the expected stream wrapper or filter interface."
related[] = ""
examples[] = "stream_wrapper_register(): Argument #2 ($class) must be a concrete class"
