id = "cannot-use--\"%s-\"-as-%s"
error = "Cannot use \\\"%s\\\" as %s"
phpVersion = "7.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class Int {}
interface Void {}
trait Object {}
enum Iterable {}

?>"
description = "This is the generic, truncated form of a family of errors PHP raises when a reserved word is used where an identifier for a class, interface, trait, enum, or type is expected. The first ``%s`` is the reserved word as written by the user, the second ``%s`` describes the context (``class name``, ``interface name``, ``trait name``, ``enum name``, ``a type name``, etc.). The full runtime message continues with `` as it is reserved``.

The list of reserved words has grown over time: ``bool``, ``int``, ``float``, ``string``, ``true``, ``false``, ``null``, ``self``, ``parent`` and ``static`` since PHP 7.0; ``void`` and ``iterable`` since PHP 7.1; ``object`` since PHP 7.2; ``mixed`` since PHP 8.0; ``never`` since PHP 8.1. ``array`` and ``callable`` are also reserved for this purpose, although they cannot even reach the parser as identifiers, since they are proper tokens.

The same underlying check is also used, with a different second argument, when a reserved word is written with a leading backslash in a type declaration, such as ``\array``."
alternative[] = "Use another name; reserved words cannot be used as class, interface, trait, or enum names."
alternative[] = "Check the exact list of reserved words for the PHP version being targeted."
