id = "session-callback-must-have-a-return-value-of-type-bool,-%s-returned"
error = "Session callback must have a return value of type bool, %s returned"
phpVersion = "8.0+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

session_set_save_handler(
    open: fn (string \$path, string \$name): bool => true,
    close: fn (): bool => true,
    read: fn (string \$id): string => '',
    // Legacy convention: 0 for success, -1 for failure,
    // instead of returning a real bool.
    write: fn (string \$id, string \$data): int => 0,
    destroy: fn (string \$id): bool => true,
    gc: fn (int \$max_lifetime): int => 0,
);

session_start();

?>"
description = "The callbacks registered through ``session_set_save_handler()`` (``open``, ``close``, ``read``, ``write``, ``destroy``, ``gc``, etc.) are expected to return a value of type ``bool`` to report success or failure, matching the signatures declared by ``SessionHandlerInterface``.

Some older session handlers followed the pre-PHP 7 convention of C-style save handlers, returning an integer (``0`` for success, a negative value such as ``-1`` for failure) instead of ``true``/``false``. PHP still accepts ``0`` and ``-1`` for backward compatibility, but as of PHP 8.0.0 it emits a deprecation notice naming the actual type/value returned; any other non-bool return value triggers a ``TypeError`` instead."
alternative[] = "Make every session handler callback explicitly return ``true`` or ``false``."
alternative[] = "Implement ``SessionHandlerInterface`` on a dedicated class instead of passing loose callables, so the return types are enforced."
