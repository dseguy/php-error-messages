id = "must-be-one-of-the-pathinfo_*-constants"
error = "must be one of the PATHINFO_* constants"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

pathinfo('/tmp/example.txt', 9999);

?>"
description = "``pathinfo()`` takes an optional ``$flags`` argument built from the ``PATHINFO_DIRNAME``, ``PATHINFO_BASENAME``, ``PATHINFO_EXTENSION``, ``PATHINFO_FILENAME``, and ``PATHINFO_ALL`` constants, describing which parts of the path to return.

Previously, passing a value outside this set was silently accepted and produced an empty (or nonsensical) result. As of PHP 8.6, ``pathinfo()`` validates that ``$flags`` is actually built from these constants and throws a ``ValueError`` otherwise, instead of silently returning incomplete information."
alternative[] = "Only pass a combination of ``PATHINFO_DIRNAME``, ``PATHINFO_BASENAME``, ``PATHINFO_EXTENSION``, ``PATHINFO_FILENAME``, or ``PATHINFO_ALL`` as the ``$flags`` argument."
related[] = "must-be-only-one-of-the-pathinfo_*-constants"
examples[] = "pathinfo(): Argument #2 ($flags) must be one of the PATHINFO_* constants"
tags[] = "filesystem"
tags[] = "validation"
seeAlso[] = ""
features[] = "pathinfo-flags"
previous = ""
next = ""
extension[] = "standard"
analyzer[] = ""
changedBehavior[] = "Previously, an invalid ``$flags`` value was silently accepted and returned incomplete or empty results instead of throwing."
