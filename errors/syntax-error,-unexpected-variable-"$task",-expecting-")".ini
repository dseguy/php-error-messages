id = "syntax-error,-unexpected-variable-\"$task\",-expecting-\")\""
error = "syntax error, unexpected variable \"$task\", expecting \")\""
phpVersion = "7.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function schedule(string $name $task) {}

?>"
description = "In a function, method or closure signature, each parameter must be separated from the next one by a comma. Here, the comma between ``$name`` and ``$task`` is missing, so once PHP has parsed ``$name`` as a complete, typed parameter, it expects either another comma or the closing parenthesis of the argument list; instead it finds another variable, ``$task``.

This is the generic \"unexpected variable, expecting )\" message, reported here with the concrete variable name found in the offending code, ``$task``."
alternative[] = "Add the missing comma between the two parameters."
alternative[] = "Remove the extra variable if it was left over from editing."
related[] = "syntax-error,-unexpected-variable-\"$%s\",-expecting-\")\""
related[] = "syntax-error,-unexpected-token-\")\",-expecting-variable"
