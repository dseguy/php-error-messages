id = "io--poll--handle-cannot-be-implemented-by-user-classes"
error = "Io\\\\Poll\\\\Handle cannot be implemented by user classes"
phpVersion = "8.6+"
level = "E_ERROR"
exception = ""
code = "<?php

class MyHandle implements Io\Poll\Handle {
}

?>"
description = "PHP 8.6 introduces a native Polling API (``Io\\Poll``) for waiting on readiness of multiple I/O resources at once, backed by ``epoll`` or ``kqueue`` at the system level. ``Io\\Poll\\Handle`` is the marker interface that identifies a resource as pollable; it declares no methods of its own.

Every concrete handle type must register a low-level ``php_poll_handle_ops`` operations table that tells the polling backend how to obtain the underlying file descriptor and check the handle's validity. Userland classes have no way to provide that table, so implementing ``Io\\Poll\\Handle`` directly from PHP code is rejected with a fatal error at class-declaration time, rather than producing a handle that would silently fail to work with the poller."
alternative[] = "Use one of the internal classes that already implement Io\\Poll\\Handle (such as a stream or socket resource wrapper), instead of implementing the interface yourself."
alternative[] = "Wrap or compose an existing pollable resource rather than trying to make an arbitrary object pollable."
related[] = ""
examples[] = "Io\\Poll\\Handle cannot be implemented by user classes"
