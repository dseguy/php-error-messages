id = "returning-a-value-from-a-constructor-is-deprecated"
error = "Returning a value from a constructor is deprecated"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class X {
    public function __construct() {
        return 42;
    }
}

$x = new X;
var_dump($x);

?>"
description = "``new X`` always evaluates to the newly created instance, no matter what ``__construct()`` returns: any value returned from a constructor is discarded.

Since explicitly returning a value from ``__construct()`` is therefore always misleading dead code, PHP 8.6 deprecates it. A bare ``return;`` with no expression, used purely to exit the constructor early, remains unaffected."
alternative[] = "Use a bare ``return;`` (with no expression) to exit the constructor early."
alternative[] = "If you need to build and hand back an object based on some logic, use a static factory method instead of relying on ``new`` and a constructor return value."
