id = "cannot-mix-bracketed-namespace-declarations"
error = "Cannot mix bracketed namespace declarations"
phpVersion = "5.3+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

namespace A {
    // bracketed syntax
}

namespace B;
// unbracketed syntax, in the same file

?>"
description = "PHP supports two syntaxes to declare a namespace: the unbracketed form, ``namespace Foo;``, which applies to the rest of the file (or until the next ``namespace`` statement), and the bracketed form, ``namespace Foo { ... }``, which delimits the namespace explicitly.

A single file must consistently use one form or the other; mixing bracketed and unbracketed declarations together is not allowed. The full message reads: ``Cannot mix bracketed namespace declarations with unbracketed namespace declarations``."
alternative[] = "Convert every ``namespace`` statement in the file to the bracketed form."
alternative[] = "Convert every ``namespace`` statement in the file to the unbracketed form."
alternative[] = "Split the file so that each file only uses one of the two forms."
related[] = "namespace-declarations-cannot-be-nested"
related[] = "no-code-may-exist-outside-of-namespace-{}"
related[] = "namespace-declaration-statement-has-to-be"
