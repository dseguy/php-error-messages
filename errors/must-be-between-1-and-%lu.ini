id = "must-be-between-1-and-%lu"
error = "must be between 1 and %lu"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

gmp_root('27', PHP_INT_MAX);

?>"
description = "``gmp_root()`` and ``gmp_rootrem()`` compute the integer part of the ``$nth`` root of ``$num``. Internally, ``$nth`` is passed to GMP as an unsigned long, so it must be at least 1 and cannot exceed the platform's ``ULONG_MAX``.

As of PHP 8.6, an ``$nth`` outside this range throws a ``ValueError`` naming the exact upper bound, instead of only rejecting non-positive values and letting an oversized ``$nth`` overflow when narrowed to an unsigned long."
alternative[] = "Pass an $nth argument to gmp_root()/gmp_rootrem() between 1 and PHP_INT_MAX (or the platform's ULONG_MAX, whichever is smaller)."
related[] = "must-be-odd-if-argument-#1-($num)-is-negative"
examples[] = "gmp_root(): Argument #2 ($nth) must be between 1 and 18446744073709551615"
examples[] = "gmp_rootrem(): Argument #2 ($nth) must be between 1 and 18446744073709551615"
tags[] = "gmp"
tags[] = "math"
tags[] = "validation"
seeAlso[] = ""
features[] = "gmp-root"
previous = ""
next = ""
extension[] = "gmp"
analyzer[] = ""
changedBehavior[] = "Previously, gmp_root() rejected only $nth <= 0 (\"must be greater than 0\") and gmp_rootrem() rejected only $nth < 1 (\"must be greater than or equal to 1\"), without an upper bound."
