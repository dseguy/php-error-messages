id = "syntax-error,-unexpected-token-\"?\",-expecting-identifier"
error = "syntax error, unexpected token \"?\", expecting identifier"
phpVersion = "8.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

const ?int GLOBAL_TYPED = true;

?>"
description = "This error happens when trying to add a type to a global constant. Only class constants can be typed, since PHP 8.3; a top-level ``const`` declaration never supports a type, so the parser expects the constant's identifier right after the ``const`` keyword and rejects the ``?`` (or any other type token) that appears instead."
alternative[] = "Make the constant a class constant, which can be typed since PHP 8.3."
alternative[] = "Remove the type from the constant definition."
