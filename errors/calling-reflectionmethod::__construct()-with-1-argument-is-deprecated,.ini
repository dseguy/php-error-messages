id = "calling-reflectionmethod::__construct()-with-1-argument-is-deprecated,"
error = "Calling ReflectionMethod::__construct() with 1 argument is deprecated,"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

// Single string argument, combining class and method with '::'
\$method = new ReflectionMethod('DateTime::format');

echo \$method->getName(), \"\\n\";

?>"
description = "``ReflectionMethod::__construct()`` originally accepted two call shapes: two arguments, ``new ReflectionMethod(\$classOrObject, \$methodName)``, or a single string combining both as ``\"Class::method\"``. Overloading the constructor based on argument count made its signature harder to type and to document.

PHP 8.3 added ``ReflectionMethod::createFromMethodName()`` as a dedicated factory method for the single-string form. As of PHP 8.4, calling the constructor with only 1 argument is deprecated in favor of that factory method."
alternative[] = "Use ReflectionMethod::createFromMethodName('Class::method') instead of new ReflectionMethod('Class::method')."
alternative[] = "Use the 2-argument constructor, new ReflectionMethod(\$classOrObject, \$methodName), when the class and method are already available separately."
related[] = "calling-%s()-with-2-arguments-is-deprecated,"
examples[] = "Calling ReflectionMethod::__construct() with 1 argument is deprecated, use ReflectionMethod::createFromMethodName() instead"
tags[] = "reflection"
tags[] = "deprecated"
tags[] = "overloaded-signature"
seeAlso["PHP RFC: Deprecate functions with overloaded signatures"] = "https://wiki.php.net/rfc/deprecate_functions_with_overloaded_signatures"
seeAlso["ReflectionMethod::createFromMethodName()"] = "https://www.php.net/manual/en/reflectionmethod.createfrommethodname.php"
features[] = "reflection"
