id = "stream-filter-%s-is-seekable-only-to-start-position"
error = "Stream filter %s is seekable only to start position"
phpVersion = "8.6+"
level = "E_WARNING"
exception = ""
code = "<?php

$stream = fopen('php://temp', 'r+');
fwrite($stream, str_repeat('a', 100));
rewind($stream);

stream_filter_append($stream, 'zlib.deflate', STREAM_FILTER_READ);

fread($stream, 10);
fseek($stream, 5, SEEK_CUR);

?>"
description = "PHP 8.6 fixes a long-standing inconsistency (bug #49874) between ``fseek()``/``ftell()`` and stream filters: seeking a stream now checks whether every filter attached to the affected chain can actually tolerate the requested seek, instead of blindly repositioning the stream.

Reading through a decompression filter such as ``zlib.inflate`` (which ``zlib.deflate`` also uses on its read side) can always be restarted from position 0, since that simply means decompressing the underlying data again from the beginning. But it cannot jump to an arbitrary byte offset elsewhere in the stream, since that offset has no meaning inside the compressed byte stream. Seeking anywhere other than back to the very start now emits this warning and fails, instead of repositioning the stream to a location that no longer matches what has actually been decompressed."
alternative[] = "Only rewind a stream read through such a filter back to position 0 (e.g. with rewind()); don't seek to an arbitrary offset while the filter is attached."
related[] = "stream-filter-%s-is-never-seekable"
related[] = "stream-filter-seeking-for-%s-failed"
examples[] = "Stream filter zlib.deflate is seekable only to start position"
tags[] = "streams"
tags[] = "stream-filter"
tags[] = "validation"
seeAlso[] = ""
features[] = "stream-filter"
previous = ""
next = ""
extension[] = "stream"
analyzer[] = ""
changedBehavior[] = "Prior to PHP 8.6, fseek() did not consult filter seekability at all: seeking a stream with a decompression filter attached always appeared to succeed, even when the requested offset had no valid meaning for the filter."
