id = "type-of-%s::%s-must-be-compatible-with-%s::%s-of-type-%s"
error = "Type of %s::%s must be compatible with %s::%s of type %s"
phpVersion = "8.3+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

interface Colorful {
    const string COLOR = 'unknown';
}

class Item implements Colorful {
    const int COLOR = 1;
}

?>"
description = "PHP 8.3 introduced typed class constants: a class constant may declare the type of value it holds, and that type is enforced. When a class overrides a typed constant inherited from a parent class or an implemented interface, the overriding constant's type must be covariant with the parent's, meaning it must be the same type, or a subtype of it, never a wider or unrelated one.

Here, ``Colorful::COLOR`` is typed ``string``, but ``Item`` redeclares it as ``int``, which is not a subtype of ``string``. Since callers relying on ``Colorful::COLOR`` expect a ``string``, PHP rejects the mismatch at compile time."
alternative[] = "Use the same type as the parent constant, or a subtype of it."
alternative[] = "Remove the type declaration from the child constant's declaration, if the language version allows omitting it."
alternative[] = "Rename the constant, if it is not meant to override the parent one."
related[] = "declaration-of-%s::%s()-must-be-compatible-with-%s::%s()"
related[] = "type-of-%s::$%s-must-be-%s%s-(as-in-class-%s)"
examples[] = "Type of Item::COLOR must be compatible with Colorful::COLOR of type string"
