id = "type-%s-is-redundant-with-type-%s"
error = "Type %s is redundant with type %s"
phpVersion = "8.2+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

interface X {}

use A as B;

function foo(): (X&A)|(X&B) {}

?>"
description = "In a DNF (Disjunctive Normal Form) type, two intersection groups can look textually different while describing the exact same combination of types once names are resolved. Here, ``B`` is only a local alias for ``A`` (introduced by ``use A as B;``), so ``X&A`` and ``X&B`` are, in fact, the very same intersection written twice.

PHP resolves ``use`` aliases at compile time, notices that the second group adds nothing over the first, and reports it as redundant."
alternative[] = "Remove the duplicated intersection group."
alternative[] = "Use the class's real name consistently, instead of mixing the name and its alias."
related[] = "type-%s-is-redundant-as-it-is-more-restrictive-than-type-%s"
related[] = "duplicate-type-%s-is-redundant"
examples[] = "Type X&A is redundant with type X&A"
tags[] = "type"
tags[] = "dnf"
seeAlso[] = ""
features[] = "dnf-type"
features[] = "intersection-type"
