id = "must-contain-a-type-for-object-id-%s"
error = "must contain a type for object ID %s"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

$snmp = new SNMP(SNMP::VERSION_2c, 'localhost', 'private');

$snmp->set(
    ['.1.3.6.1.2.1.1.6.0'],
    [],
    ['New location']
);

?>"
description = "``SNMP::set()`` lets ``$objectId``, ``$type``, and ``$value`` each be passed as parallel arrays, matched up element by element. Every object ID in ``$objectId`` needs a corresponding entry in ``$type`` describing what kind of SNMP value is being set.

If ``$type`` runs out of elements before ``$objectId`` does, the object ID that has no matching type now throws a ``ValueError`` naming that OID, instead of silently skipping it with a warning."
alternative[] = "Make sure the $type array passed to SNMP::set() has one entry for every object ID in $objectId."
related[] = "must-contain-a-value-for-object-id-%s"
related[] = "must-not-be-empty-when-passed-as-an-array"
examples[] = "SNMP::set(): Argument #2 ($type) must contain a type for object ID '.1.3.6.1.2.1.1.6.0'"
tags[] = "snmp"
tags[] = "networking"
tags[] = "validation"
seeAlso[] = ""
features[] = "snmp-set"
previous = ""
next = ""
extension[] = "snmp"
analyzer[] = ""
changedBehavior[] = "Previously, this emitted an E_WARNING (\"'%s': no type set\") and silently skipped the affected object ID, instead of throwing."
