id = "a-void-%s-does-not-return-a-value"
error = "A void %s does not return a value, but #[\\\\NoDiscard] requires a return value"
phpVersion = "8.5+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

#[\\NoDiscard]
function foo(): void {}

?>"
description = "The ``#[\\NoDiscard]`` attribute marks a function, method or closure so that the engine emits a warning whenever a caller ignores its return value. A ``void``-returning function never produces a value to begin with, so requiring the caller to use one is a contradiction, and PHP rejects the combination at compile time."
alternative[] = "Remove the ``void`` return type, and actually return a meaningful value."
alternative[] = "Remove the ``#[\\NoDiscard]`` attribute, since there is nothing to discard."
related[] = "a-void-%s-must-not-return-a-value"
related[] = "a-never-returning-%s-does-not-return-a-value"
related[] = "method-%s::%s-cannot-be-#[--nodiscard]"
related[] = "method-%s::%s-cannot-be-#[--nodiscard]-error_type"
examples[] = "A void function does not return a value, but #[\\NoDiscard] requires a return value"
examples[] = "A void method does not return a value, but #[\\NoDiscard] requires a return value"
