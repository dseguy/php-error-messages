id = "call-to-%s-%s::__destruct()-from-global-scope-during-shutdown-ignored"
error = "Call to %s %s::__destruct() from global scope during shutdown ignored"
phpVersion = "8.0+"
level = "E_WARNING"
exception = ""
code = "<?php

class X {
    public function __destruct() {
        echo \"Destroying\\n\";
    }
}

register_shutdown_function(function() {
    $x = new X;
});

?>"
description = "During PHP shutdown, destructors are called for remaining objects. When a ``__destruct()`` method is invoked from global scope (i.e. not as part of object destruction triggered by the garbage collector or script end), PHP emits this warning and ignores the call.

This typically happens when a ``register_shutdown_function()`` callback creates an object whose destructor is called during the final cleanup phase. The object is destroyed immediately, but the invocation from global scope is considered invalid.

The warning ensures that destructors are only called in their expected context: as part of object lifetime management, not from arbitrary global code."
alternative[] = "Move the logic from ``__destruct()`` into a regular method and call it explicitly before the object is destroyed."
alternative[] = "Avoid creating objects inside shutdown functions if you rely on their destructor behavior."
alternative[] = "Use a dedicated lifecycle method instead of relying on ``__destruct()`` for cleanup logic."
related[] = ""
examples[] = "Call to public X::__destruct() from global scope during shutdown ignored"
examples[] = "Call to protected X::__destruct() from global scope during shutdown ignored"
tags[] = "destructor"
tags[] = "shutdown"
tags[] = "garbage-collection"
seeAlso[__destruct] = "https://www.php.net/manual/en/language.oop5.decon.php"
seeAlso[register_shutdown_function] = "https://www.php.net/manual/en/function.register-shutdown-function.php"
