id = "a-class-constant-must-not-be-called-class;-it-is-reserved-for-class-name-fetching-ce->type-==-zend_internal_class-?-e_core_error-:"
error = "A class constant must not be called class; it is reserved for class name fetching ce->type == ZEND_INTERNAL_CLASS ? E_CORE_ERROR :"
phpVersion = "5.5+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class Foo {
	const class = 'Foo';
}

?>"
description = "class is a reserved pseudo-constant name: writing Foo::class already resolves, at compile time, to the fully-qualified name of Foo without ever looking up a real constant. Declaring an actual class constant named class would collide with that built-in mechanism, so it is forbidden. The message's noisy tail (ce->type == ZEND_INTERNAL_CLASS ? E_CORE_ERROR :) is an artifact of the C ternary Zend uses internally to pick between E_CORE_ERROR, for constants declared on classes registered by the engine or an extension, and E_COMPILE_ERROR for constants declared in ordinary user scripts."
alternative[] = "Use a different name for the constant."
