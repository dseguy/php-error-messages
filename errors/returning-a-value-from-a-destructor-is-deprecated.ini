id = "returning-a-value-from-a-destructor-is-deprecated"
error = "Returning a value from a destructor is deprecated"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class X {
    public function __destruct() {
        return 42;
    }
}

$x = new X;
unset($x);

?>"
description = "``__destruct()`` is invoked automatically by PHP's garbage collector when an object is about to be destroyed; nothing ever reads or uses its return value.

Since explicitly returning a value from ``__destruct()`` is therefore always dead code, PHP 8.6 deprecates it. A bare ``return;`` with no expression, used purely to exit the destructor early, remains unaffected."
alternative[] = "Use a bare ``return;`` (with no expression) to exit the destructor early."
alternative[] = "Remove the ``return $value;`` statement; if you need to signal something to calling code, do it before the object is unset, not from the destructor."
related[] = "returning-a-value-from-a-constructor-is-deprecated"
related[] = "making-a-destructor-a-generator-is-deprecated"
related[] = "destructors-cannot-declare-a-return-type"
examples[] = "Returning a value from a destructor is deprecated"
