id = "passing-connection-object-as-an-argument-is-deprecated"
error = "Passing connection object as an argument is deprecated"
phpVersion = "8.1+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

\$mysqli = mysqli_connect('localhost', 'user', 'password');

// The connection argument is ignored by this function.
echo mysqli_get_client_info(\$mysqli);

?>"
description = "``mysqli_get_client_info()`` reports the version of the underlying MySQL client library that PHP was compiled/linked against. This information is a property of the client library itself, not of any particular connection, so the function never actually needed a connection argument, even though its procedural signature historically accepted one for consistency with other ``mysqli_*`` functions.

Passing a connection object to this function has no effect on the result, and is deprecated as of PHP 8.1.0 to make that clear."
alternative[] = "Call ``mysqli_get_client_info()`` without arguments, e.g. ``mysqli_get_client_info()``."
alternative[] = "When using the object-oriented API, use ``mysqli_get_client_info()`` (not a method call), since the client info is not connection-specific."
related[] = "automatic-fetching-of-postgresql-connection-is-deprecated"
