id = "an-alias-was-defined-for-method-%s(),-which-exists-in-both-%s-and-%s.-use-%s::%s-or-%s::%s-to-resolve-the-ambiguity"
error = "An alias was defined for method %s(), which exists in both %s and %s. Use %s::%s or %s::%s to resolve the ambiguity"
phpVersion = "5.4+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

trait A {
    public function foo() {}
}

trait B {
    public function foo() {}
}

class C {
    use A, B {
        foo as bar;
    }
}

?>"
description = "Inside the ``use`` block of a class, an alias rule can rename a trait method without stating which trait it comes from, by writing ``method as alias;``.

When several of the traits used by the class declare a method with that exact name, PHP has no way to decide which one the alias should refer to, since the unqualified form only works when the name is unambiguous. The class composition fails until the origin trait is made explicit."
alternative[] = "Qualify the reference with the trait it should come from, as in `A::foo as bar;`."
alternative[] = "Rename or remove the method in one of the conflicting traits so only one of them still declares it."
related[] = "the-modifiers-of-the-trait-method-%s()-are-changed,-but-this-method-does-not-exist.-error"
related[] = "a-precedence-rule-was-defined-for-%s::%s-but-this-method-does-not-exist"
examples[] = "An alias was defined for method foo(), which exists in both A and B. Use A::foo or B::foo to resolve the ambiguity"
