id = "cannot-use-%s()-on-static-property-%ps::$%ps"
error = "Cannot use %s() on static property %pS::$%pS"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ReflectionException"
code = "<?php

class Foo {
    public static int $counter = 0;
}

$obj = new Foo();

$prop = new ReflectionProperty(Foo::class, 'counter');
$prop->setRawValueWithoutLazyInitialization($obj, 5);

?>"
description = "``ReflectionProperty::setRawValueWithoutLazyInitialization()`` and ``::skipLazyInitialization()`` are part of the lazy objects API (PHP 8.4): they exist to manipulate the storage slot of a lazily-initialized instance property without triggering (or interfering with) the object's lazy initializer. A static property belongs to the class, not to any particular instance, and is never subject to per-object lazy initialization, so these methods refuse to act on it."
alternative[] = "Use ReflectionProperty::setValue() for static properties instead of setRawValueWithoutLazyInitialization()/skipLazyInitialization(), which only make sense for lazily-initialized instance properties."
related[] = "cannot-use-%s()-on-dynamic-property-%ps::$%ps"
related[] = "cannot-use-%s()-on-virtual-property-%ps::$%ps"
related[] = "cannot-use-%s()-on-internal-class-%ps"
examples[] = "Cannot use setRawValueWithoutLazyInitialization() on static property Foo::$counter"
examples[] = "Cannot use skipLazyInitialization() on static property Foo::$counter"
tags[] = "reflection"
tags[] = "lazy-objects"
tags[] = "validation"
seeAlso[] = ""
features[] = "reflection"
features[] = "lazy-objects"
