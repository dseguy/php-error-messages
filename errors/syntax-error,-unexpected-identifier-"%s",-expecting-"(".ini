id = "syntax-error,-unexpected-identifier-\"%s\",-expecting-\"(\""
error = "syntax error, unexpected identifier \"%s\", expecting \"(\""
phpVersion = "7.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function foo bar() {}

?>"
description = "After the ``function`` keyword and the function's name, PHP expects the opening parenthesis of the argument list. Here, a second identifier was found instead, which usually means an extra word was typed, or a comma or a return-type colon was forgotten between two declarations."
alternative[] = "Remove the extra identifier, keeping only the function name."
alternative[] = "If a return type was intended, add a colon before it: ``function foo(): bar {}``."
alternative[] = "If two functions were meant to be declared, close the first one and start a new ``function`` statement."
related[] = "syntax-error,-unexpected-identifier-\"%s\",-expecting-\";\"-or-\"{\""
examples[] = "syntax error, unexpected identifier \"bar\", expecting \"(\""
tags[] = "syntax-error"
seeAlso[] = ""
features[] = "function"
features[] = "method"
