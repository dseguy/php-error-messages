id = "cannot-set-a-userinfo-without-having-a-host"
error = "Cannot set a userinfo without having a host"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "Uri\\InvalidUriException"
code = "<?php

$builder = new Uri\Rfc3986\UriBuilder();
$builder->setUserInfo('user:pass');

$uri = $builder->build();

?>"
description = "Per RFC 3986, the userinfo component (``user:pass@``) only exists as part of an authority, and an authority always includes a host. There is no valid way to serialize a URI that carries userinfo but no host. ``Uri\\Rfc3986\\UriBuilder::build()`` (and the equivalent ``withUserInfo()`` call on an already-hostless URI) rejects that combination instead of producing a URI that would be ambiguous or unparsable when read back."
alternative[] = "Set a host on the builder (or the URI) before, or at the same time as, setting the userinfo."
alternative[] = "If the URI genuinely has no authority (e.g. a ``mailto:`` URI), do not set userinfo on it."
related[] = "failed-to-update-the-userinfo"
related[] = "the-specified-userinfo-is-malformed"
examples[] = ""
