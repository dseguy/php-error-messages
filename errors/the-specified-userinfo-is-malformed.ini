id = "the-specified-userinfo-is-malformed"
error = "The specified userinfo is malformed"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "Uri\\InvalidUriException"
code = "<?php

$uri = Uri\Rfc3986\Uri::parse('https://example.com');

$uri = $uri->withUserInfo('us/r:password');

?>"
description = "The userinfo component of a URI may only contain unreserved characters, the sub-delimiters, ``:``, and percent-encoded octets (RFC 3986, section 3.2.1). ``Uri\\Rfc3986\\Uri::withUserInfo()`` and ``Uri\\Rfc3986\\UriBuilder::setUserInfo()`` throw when the given string contains a character outside that set — here, the unencoded ``/``."
alternative[] = "Percent-encode any reserved or non-ASCII character before passing it as userinfo."
alternative[] = "Restrict userinfo to unreserved characters, sub-delimiters and ``:``."
related[] = "cannot-set-a-userinfo-without-having-a-host"
related[] = "failed-to-update-the-userinfo"
examples[] = ""
tags[] = "uri"
seeAlso[] = ""
features[] = "uri"
