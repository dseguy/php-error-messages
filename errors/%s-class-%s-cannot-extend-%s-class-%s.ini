id = "%s-class-%s-cannot-extend-%s-class-%s"
error = "%s class %s cannot extend %s class %s"
phpVersion = "8.2+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

readonly class Foo
{
}

class Bar extends Foo
{
}

?>"
description = "This is the generic form of the error emitted when a ``readonly`` class and a non-``readonly`` class try to extend one another: the first two ``%s`` are ``Readonly``/``Non-readonly`` plus the child class name, the last two are ``readonly``/``non-readonly`` plus the parent class name.

``readonly`` is a class-wide modifier: it applies to every property declared in the class. Because a subclass inherits all of its parent's properties, mixing a ``readonly`` class with a non-``readonly`` one in the same hierarchy would leave some properties ambiguous about whether they can be written to after construction. PHP forbids this by requiring every class in an inheritance chain to share the same ``readonly`` status."
alternative[] = "Make both classes readonly."
alternative[] = "Make both classes non-readonly."
alternative[] = "Make both classes non-readonly and apply readonly per property instead."
related[] = "readonly-class-%s-cannot-extend-non-readonly-class-%s"
related[] = "non-readonly-class-%s-cannot-extend-readonly-class-%s"
examples[] = "Readonly class Bar cannot extend non-readonly class Foo"
examples[] = "Non-readonly class Bar cannot extend readonly class Foo"
tags[] = ""
seeAlso[] = ""
features[] = "readonly"
features[] = "inheritance"
