id = "must-be-a-valid-normalization-form"
error = "must be a valid normalization form"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

Normalizer::normalize('café', 999);

?>"
description = "``Normalizer::normalize()`` and ``Normalizer::isNormalized()`` accept a ``$form`` argument built from ICU's Unicode normalization forms: ``Normalizer::FORM_D``, ``::FORM_KD``, ``::FORM_C`` (the default), ``::FORM_KC``, or ``::FORM_KC_CF``. Any other integer does not correspond to a form ICU knows how to normalize to.

This has thrown a ``ValueError`` since PHP 8.0; PHP 8.6 only corrected a typo in the message text itself, which previously doubled the word \"a\"."
alternative[] = "Pass one of Normalizer::FORM_D, ::FORM_KD, ::FORM_C, ::FORM_KC, or ::FORM_KC_CF as the $form argument."
related[] = ""
examples[] = "Normalizer::normalize(): Argument #2 ($form) must be a valid normalization form"
examples[] = "Normalizer::isNormalized(): Argument #2 ($form) must be a valid normalization form"
tags[] = "intl"
tags[] = "unicode"
tags[] = "validation"
seeAlso[] = ""
features[] = "unicode-normalization"
previous = ""
next = ""
extension[] = "intl"
analyzer[] = ""
changedBehavior[] = "PHP 8.0 through 8.5 threw the same ValueError but with a typo in the message: \"must be a a valid normalization form\" (doubled \"a\")."
