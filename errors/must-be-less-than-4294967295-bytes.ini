id = "must-be-less-than-4294967295-bytes"
error = "must be less than 4294967295 bytes"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

$hash = sodium_crypto_pwhash_str(str_repeat('a', 4294967295), SODIUM_CRYPTO_PWHASH_OPSLIMIT_INTERACTIVE, SODIUM_CRYPTO_PWHASH_MEMLIMIT_INTERACTIVE);

?>"
description = "``sodium_crypto_pwhash()`` and ``sodium_crypto_pwhash_str()`` derive a key, or a storable hash, from a password using the Argon2 algorithm. Internally, libsodium tracks the length of the password (and of the derived key or salt) in a 32-bit unsigned integer, so any input of ``4294967295`` bytes (``2^32 - 1``) or more cannot be represented and can never be processed.

As of PHP 8.6, these out-of-range length checks throw a ``ValueError`` naming the offending argument. Earlier versions threw a generic ``SodiumException`` instead for the same underlying condition."
alternative[] = "Do not pass passwords, salts or derived keys anywhere near 4 GB in size; hash a digest of the material instead if it is genuinely that large."
related[] = ""
examples[] = "sodium_crypto_pwhash_str(): Argument #1 ($password) must be less than 4294967295 bytes"
