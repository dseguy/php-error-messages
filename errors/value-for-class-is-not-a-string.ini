id = "value-for-class-is-not-a-string"
error = "Value for class is not a string"
phpVersion = "5.0+"
level = "E_WARNING"
exception = ""
code = "<?php

$e = new Exception();

$ref = new ReflectionProperty($e, 'trace');
$ref->setValue($e, [
    ['class' => null, 'type' => '::', 'function' => 'foo'],
]);

echo $e->getTraceAsString();

?>"
description = "``Exception::getTraceAsString()`` (and the trace formatting used when an uncaught exception is printed) rebuilds a readable string from the exception's internal ``trace`` array, one frame at a time. Each frame is expected to store its ``class`` entry, when present, as a string.

The trace array is normally built by the engine and always well-formed, but it can be replaced or altered by user code, typically through ``ReflectionProperty::setValue()`` on the ``trace`` property. If a frame's ``class`` entry is present but is not a string, this warning is raised while the frame is rendered as ``[unknown]`` instead of the real class name."
alternative[] = "Do not overwrite the trace property of an exception with malformed frame data; if you need custom trace-like data, use a separate property."
alternative[] = "When constructing trace frames manually, make sure class, function and type are always strings."
related[] = "object-of-class-%s-could-not-be-converted-to-string"
examples[] = "Value for class is not a string"
tags[] = "exceptions"
tags[] = "reflection"
seeAlso[] = ""
features[] = "getTraceAsString"
