id = "static::-\"-is-not-allowed-in-compile-time-constants"
error = "static::\\\" is not allowed in compile-time constants"
phpVersion = "5.6+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class Base {
	const A = 1;
	const B = static::A * 2;
}

?>"
description = "Class constants are meant to hold a single, fixed value shared identically by the declaring class and every subclass that inherits it. Referencing static:: inside a constant expression would make the value depend on late static binding, i.e. on whichever subclass actually reads it, which contradicts a constant's fixed nature, so PHP rejects it at compile time."
alternative[] = "Use self:: instead if the intent is to always refer to the declaring class's own member."
alternative[] = "Compute the value in a static method instead of a constant."
related[] = "static-\"-is-not-allowed-in-compile-time-constants"
related[] = "static::class-cannot-be-used-for-compile-time-class-name-resolution"
related[] = "cannot-use-dynamic-class-name-in-constant-expression"
