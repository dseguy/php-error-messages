id = "making-a-destructor-a-generator-is-deprecated"
error = "Making a destructor a Generator is deprecated"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class X {
    public function __destruct() {
        yield 1;
    }
}

$x = new X;
unset($x);

?>"
description = "Using ``yield`` anywhere in the body of ``__destruct()`` turns it into a Generator function. A Generator only starts executing once something iterates it, but nothing iterates the return value of a destructor: PHP just calls it during garbage collection and discards the result. As a consequence, the body of such a destructor never actually runs, silently skipping any cleanup code it contains.

Since this pattern is virtually always a mistake, PHP 8.6 deprecates making a destructor a Generator."
alternative[] = "Move the code that uses ``yield`` into a separate, regular method that ``__destruct()`` calls directly."
alternative[] = "If the destructor only needs to release resources, replace ``yield`` with plain statements."
related[] = "making-a-constructor-a-generator-is-deprecated"
related[] = "returning-a-value-from-a-destructor-is-deprecated"
related[] = "destructors-cannot-declare-a-return-type"
examples[] = "Making a destructor a Generator is deprecated"
