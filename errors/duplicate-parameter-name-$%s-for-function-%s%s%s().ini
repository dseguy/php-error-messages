id = "duplicate-parameter-name-$%s-for-function-%s%s%s()"
error = "Duplicate parameter name $%s for function %s%s%s()"
phpVersion = "7.4+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function foo($a, $a, $a) {}

?>"
description = "It is not allowed to have several times the same parameter in a method, closure or function signature. All the parameters must have different names.

This error appears only in PHP debug mode."
alternative[] = "Remove the parameters with duplicate names."
alternative[] = "Rename the parameters with duplicate names."
