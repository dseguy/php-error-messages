id = "unparenthesized-`a-?:-b-?-c-:-d`-is-not-supported."
error = "Unparenthesized `a ?: b ? c : d` is not supported."
phpVersion = "8.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

$x = $a ?: $b ? $c : $d;

?>"
description = "Mixing the short ternary operator (``?:``) with a full ternary requires a clear definition of priorities, by using parenthesis.

The code above could be understood as `($a ?: $b) ? $c : $d` or `$a ?: ($b ? $c : $d)`. Until PHP 8.0, the engine chose the first option, since the ternary operator was left-associative; since then, it must be explicitly written.

Note that, in the error message, the letters represent a full expression. They may be variables, as in the illustration, but any other expression."
alternative[] = "Write the expression as `($a ?: $b) ? $c : $d`."
alternative[] = "Write the expression as `$a ?: ($b ? $c : $d)`."
alternative[] = "Rewrite the expression as an if/then."
related[] = "unparenthesized-`a-?-b-:-c-?-d-:-e`-is-not-supported."
related[] = "unparenthesized-`a-?-b-:-c-?:-d`-is-not-supported."
