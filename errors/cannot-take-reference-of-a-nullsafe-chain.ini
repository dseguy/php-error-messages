id = "cannot-take-reference-of-a-nullsafe-chain"
error = "Cannot take reference of a nullsafe chain"
phpVersion = "8.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class Address {
    public string $city = '';
}

class User {
    public ?Address $address = null;
}

$user = new User();

$city = &$user?->address->city;

?>"
description = "The nullsafe operator ``?->`` short-circuits the whole access chain to ``null`` as soon as one segment is ``null``: the rest of the chain is never evaluated. A reference, on the other hand, must point to a concrete storage location (a variable, array slot, or property); there is no such location to bind to when the chain may short-circuit to a plain ``null`` value instead.

This error is raised whenever ANY segment of a chain used in a by-reference context contains a nullsafe operator, whether the reference is taken with ``&``, passed to a by-reference function or method parameter, or used in a by-reference ``foreach``. It is a compile-time error, detected regardless of whether the chain would actually short-circuit at runtime."
alternative[] = "Use the regular ``->`` operator instead of ``?->``, after making sure the intermediate value cannot be null."
alternative[] = "Split the expression: check for null first, then take the reference with ``->``."
related[] = "can't-use-nullsafe-operator-in-write-context"
