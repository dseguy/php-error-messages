id = "type-of-parameter-$%s-of-hook-%s::$%s::set-must-be-compatible-with-property-type"
error = "Type of parameter $%s of hook %s::$%s::set must be compatible with property type"
phpVersion = "8.4+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class Test {
    public string|array $prop {
        set(string $prop) {}
    }
}

?>"
description = "When a ``set`` hook declares an explicit parameter type, that type is what callers of ``\$object->prop = \$value`` are constrained to. Because the hook is the only way to write to the property, its parameter type must be able to accept every value that the property's own declared type allows; it must be the same as, or wider (contravariant) than, the property type, never narrower.

In the example, ``\$prop`` is declared as ``string|array``, but the ``set`` hook only accepts ``string``. An assignment of an ``array`` would satisfy the property's declared type but be rejected by the hook's parameter type, which PHP considers an incompatible, and therefore invalid, declaration.

The same error occurs when the property itself has no explicit type (implicitly ``mixed``) but the ``set`` hook restricts its parameter to a specific type, since ``mixed`` is wider than any concrete type."
alternative[] = "Widen the ``set`` hook's parameter type so that it accepts everything the property's declared type allows, e.g. change ``set(string \$prop)`` to ``set(string|array \$prop)``."
alternative[] = "Remove the explicit type from the ``set`` hook's parameter, letting it default to the property's type."
alternative[] = "Narrow the property's declared type to match what the ``set`` hook is willing to accept."
related[] = "set-type-of-%s::$%s-must-be-supertype-of-%s-(as-in-%s-%s)"
related[] = "get-hook-of-property-%s::$%s-must-not-have-a-parameter-list"
related[] = "get-hook-of-backed-property-%s::%s-with-set-hook-may-not-return-by-reference"
examples[] = "Type of parameter $prop of hook Test::$prop::set must be compatible with property type"
