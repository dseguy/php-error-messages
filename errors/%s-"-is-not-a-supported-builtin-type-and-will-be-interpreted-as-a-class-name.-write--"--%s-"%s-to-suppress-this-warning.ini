id = "%s-\"-is-not-a-supported-builtin-type-and-will-be-interpreted-as-a-class-name.-write--\"--%s-\"%s-to-suppress-this-warning"
error = "%s\\\" is not a supported builtin type and will be interpreted as a class name. Write \\\"\\\\%s\\\"%s to suppress this warning"
phpVersion = "7.0+"
level = "E_COMPILE_WARNING"
exception = ""
code = "<?php

function readFile(resource $handle): void {
    fclose($handle);
}

?>"
description = "``resource`` looks like it should be a builtin type, since it is one of the values returned by ``gettype()``, but it was never turned into an actual type declaration: there is no way to name a specific kind of resource (file handle, curl handle...) in a type.

Since ``resource`` is not a reserved word, PHP does not reject it: it silently treats it as the name of a class or interface called ``resource``, which almost never exists, and any call with an actual resource argument then fails with a TypeError.

To help catch the mistake, the compiler emits this warning as soon as it sees the bare word ``resource`` in a type position and no class or interface with that name has been imported: it assumes a builtin type was intended. The comparison is case-sensitive, so a capitalized ``Resource`` -- more plausible as a genuine class name -- does not trigger it."
alternative[] = "Remove the type declaration, or replace it with ``mixed``, since resources cannot be typed more precisely."
alternative[] = "Prefix the name with a backslash, as in ``\\resource``, to tell PHP that a class actually called ``resource`` is meant, which suppresses the warning."
alternative[] = "If a class or interface named ``resource`` exists in the current namespace, import it with a ``use`` statement so PHP recognizes it, which also suppresses the warning."
related[] = "%s-\"-will-be-interpreted-as-a-class-name.-did-you-mean--\"%s-\"?-write--\"--%s-\"%s-to-suppress-this-warning"
examples[] = "\"resource\" is not a supported builtin type and will be interpreted as a class name. Write \"\\resource\" to suppress this warning"
tags[] = "surprise"
seeAlso[] = ""
features[] = "type"
features[] = "resource"
