id = "class-%s-implementing-sessionhandlerinterface-is-missing-the-create_sid()-method-which-will-be-required-in-php-9.0"
error = "Class %s implementing SessionHandlerInterface is missing the create_sid() method which will be required in PHP 9.0"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class MySessionHandler implements SessionHandlerInterface {
    public function open($path, $name): bool { return true; }
    public function close(): bool { return true; }
    public function read($id): string|false { return ''; }
    public function write($id, $data): bool { return true; }
    public function destroy($id): bool { return true; }
    public function gc($max_lifetime): int|false { return 0; }
}

session_set_save_handler(new MySessionHandler());
session_start();

?>"
description = "``SessionIdInterface::create_sid()`` is currently optional: a class only needs it when it also implements ``SessionIdInterface`` (as ``SessionHandler`` does internally). PHP is moving toward merging ``SessionIdInterface`` into ``SessionHandlerInterface`` itself, so that every custom session handler is required to provide its own session-id generation strategy. Starting with this deprecation, any class implementing ``SessionHandlerInterface`` without a ``create_sid()`` method triggers a warning, because in PHP 9.0 the method will become mandatory and its absence will be a fatal error."
alternative[] = "Add a public ``create_sid(): string`` method to the class."
alternative[] = "Extend ``SessionHandler`` instead of implementing ``SessionHandlerInterface`` directly; it already provides a default ``create_sid()`` implementation."
related[] = "class-%s-implementing-sessionhandlerinterface-is-missing-the-validateid()-method-which-will-be-required-in-php-9.0"
examples[] = "Class MySessionHandler implementing SessionHandlerInterface is missing the create_sid() method which will be required in PHP 9.0"
