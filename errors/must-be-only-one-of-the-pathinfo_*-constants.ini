id = "must-be-only-one-of-the-pathinfo_*-constants"
error = "must be only one of the PATHINFO_* constants"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

pathinfo('/tmp/example.txt', PATHINFO_DIRNAME | PATHINFO_EXTENSION);

?>"
description = "Unlike most bitmask arguments, ``pathinfo()``'s ``$flags`` argument (aside from the catch-all ``PATHINFO_ALL``) is meant to select exactly one part of the path at a time: ``PATHINFO_DIRNAME``, ``PATHINFO_BASENAME``, ``PATHINFO_EXTENSION``, or ``PATHINFO_FILENAME``. Combining two of them with ``|`` does not make sense, since the function then wouldn't know which single value to return.

As of PHP 8.6, combining more than one of these single-part constants (without using ``PATHINFO_ALL``) throws a ``ValueError``, instead of silently returning just one of the requested parts."
alternative[] = "Pass exactly one of ``PATHINFO_DIRNAME``, ``PATHINFO_BASENAME``, ``PATHINFO_EXTENSION``, or ``PATHINFO_FILENAME``, or use ``PATHINFO_ALL`` to get all of them as an array."
related[] = "must-be-one-of-the-pathinfo_*-constants"
examples[] = "pathinfo(): Argument #2 ($flags) must be only one of the PATHINFO_* constants"
tags[] = "filesystem"
tags[] = "validation"
seeAlso[] = ""
features[] = "pathinfo-flags"
previous = ""
next = ""
extension[] = "standard"
analyzer[] = ""
changedBehavior[] = "Previously, combining multiple single-part PATHINFO_* constants silently returned only one of the requested parts instead of throwing."
