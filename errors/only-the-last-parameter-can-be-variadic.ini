id = "only-the-last-parameter-can-be-variadic"
error = "Only the last parameter can be variadic"
phpVersion = "5.6+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function foo(...$a, $b) {}

?>"
description = "A variadic parameter, marked with ``...``, collects every remaining argument passed to the function into an array. Since it consumes all the arguments left, no parameter can follow it: it must be the last one in the parameter list.

This is checked at compile time, as soon as a parameter is declared after a variadic one."
alternative[] = "Move the variadic parameter to the end of the parameter list."
alternative[] = "Use named arguments instead, if the extra parameter needs to keep a fixed conceptual position."
related[] = "variadic-parameter-cannot-have-a-default-value"
related[] = "cannot-declare-variadic-promoted-property"
