id = "the-specified-uri-is-malformed"
error = "The specified URI is malformed"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "Uri\\InvalidUriException"
code = "<?php

new Uri\Rfc3986\Uri('://example.com');

?>"
description = "``Uri\\Rfc3986\\Uri::__construct()`` and ``Uri\\Rfc3986\\Uri::parse()`` reject any input string that does not conform to the RFC 3986 URI grammar as a whole — as opposed to a failure on a single component such as the scheme or host. An empty scheme before ``://``, as above, is one such case, but any structurally invalid URI string triggers it.

The WHATWG-flavored ``Uri\\WhatWg\\Url`` (used via ``Uri\\WhatWg\\Url::parse()`` or its constructor) throws ``Uri\\WhatWg\\InvalidUrlException`` with the same base message, but appends the specific WHATWG validation failure in parentheses, e.g. ``The specified URI is malformed (HostMissing)``, and exposes the full list of validation errors through the exception's ``errors`` property."
alternative[] = "Validate or normalize the URI string before parsing it, or wrap the parse call in a try/catch."
alternative[] = "When using the WHATWG parser, inspect the exception's ``errors`` property for the precise reason."
related[] = "the-specified-scheme-is-malformed"
related[] = "the-specified-userinfo-is-malformed"
related[] = "must-be-a-list-of-%s"
