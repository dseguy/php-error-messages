id = "the-$key_length-parameter-is-deprecated-as-it-is-either-ignored-or-truncates-the-key"
error = "the $key_length parameter is deprecated as it is either ignored or truncates the key"
phpVersion = "8.5+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

\$sharedSecret = openssl_pkey_derive(\$peerPublicKey, \$privateKey, 32);

?>"
description = "``openssl_pkey_derive()`` computes a shared secret from a private key and a peer's public key (for DH or ECDH key agreement), and accepts an optional ``\$key_length`` argument that was documented as controlling the length of the derived secret.

In practice, this parameter is either ignored entirely (when it is larger than or equal to the natural size of the underlying prime/curve) or silently truncates the derived key (when it is smaller), which can give a false sense of control over the output length and lead to weakened, truncated secrets being used unknowingly. As of PHP 8.5.0, passing a value for ``\$key_length`` raises a deprecation notice."
alternative[] = "Stop passing ``\$key_length`` to ``openssl_pkey_derive()``, and if a specific length is required, derive it explicitly from the full secret afterwards (e.g. with a KDF such as ``hash_hkdf()``)."
related[] = ""
examples[] = ""
