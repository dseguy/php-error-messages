id = "cannot-use-argument-unpacking-after-named-arguments"
error = "Cannot use argument unpacking after named arguments"
phpVersion = "8.1+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function foo($a, $b, $c) {}

$rest = ['c' => 3];

foo(a: 1, b: 2, ...$rest);

?>"
description = "PHP 8.1 allows named arguments and argument unpacking (...$array) to be combined in the same call, but the unpacked array must come before any named arguments. Argument unpacking supplies its own set of positions/keys, and allowing it to appear after arguments already identified by name would make the resulting parameter order ambiguous, so it is rejected at compile time based on the call's syntax alone."
alternative[] = "Move the unpacked array before the named arguments, adjusting keys as needed: foo(...$rest, a: 1, b: 2);"
alternative[] = "Turn the unpacked array's values into individual named arguments."
related[] = "cannot-combine-named-arguments-and-argument-unpacking"
related[] = "cannot-use-positional-argument-after-named-argument-during-unpacking"
