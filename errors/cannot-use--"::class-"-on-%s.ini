id = "cannot-use--\"::class-\"-on-%s"
error = "Cannot use \\\"::class\\\" on %s"
phpVersion = "8.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

echo 10::class;

?>"
description = "Since PHP 8.0, expr::class can be used on any object expression to retrieve its class name, not only on class names, self, static or parent. When the expression is a scalar literal, such as an integer, float, string or boolean, PHP can already tell at compile time that it will never hold an object, and rejects the construct right away instead of waiting for a runtime error. %s is replaced with a description of the offending value."
alternative[] = "Only use ::class on a class name, or on an expression that can hold an object."
related[] = "cannot-use-dynamic-class-name-in-constant-expression"
examples[] = ""
tags[] = ""
seeAlso[] = ""
features[] = "class-name-resolution"
