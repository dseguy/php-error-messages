id = "define():-argument-#3-($case_insensitive)-is-ignored-and-treated-as-false-since-declaration-of-case-insensitive-constants-is-no-longer-supported,-passing-the-argument-explicitly-is-unnecessary"
error = "define(): Argument #3 ($case_insensitive) is ignored and treated as false since declaration of case-insensitive constants is no longer supported, passing the argument explicitly is unnecessary"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

define('FOO', 'bar', false);

?>"
description = "Case-insensitive constants were deprecated in PHP 7.3 and their support was removed in PHP 8.0: the third argument of ``define()`` has been ignored and always treated as ``false`` ever since. This deprecation goes one step further and flags every explicit call that still passes a (falsy) value for ``$case_insensitive``, since doing so no longer has any effect and only adds noise to the call."
alternative[] = "Call ``define()`` with only two arguments: the constant name and its value."
related[] = "define():-argument-#3-($case_insensitive)-is-ignored-since-declaration-of-case-insensitive-constants-is-no-longer-supported,-this-will-be-an-error-in-php-9.0"
examples[] = "define(): Argument #3 ($case_insensitive) is ignored and treated as false since declaration of case-insensitive constants is no longer supported, passing the argument explicitly is unnecessary"
tags[] = "constant"
tags[] = "define"
seeAlso[] = ""
features[] = "constant"
