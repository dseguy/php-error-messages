id = "use-of--\"static-\"-in-callables-is-deprecated"
error = "Use of \\\"static\\\" in callables is deprecated"
phpVersion = "8.2+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class Foo {
    public static function bar() {
        return 'Foo::bar called';
    }

    public static function make() {
        // The string is built here, inside Foo, but 'static' is NOT
        // resolved against Foo -- see where it is actually invoked below.
        return 'static::bar';
    }
}

class Base {
    public static function bar() {
        return 'Base::bar called';
    }

    public static function run($callable) {
        // 'static' resolves against the called scope active HERE
        // (Sub, since run() was invoked as Sub::run()), not against Foo.
        var_dump(call_user_func($callable));
    }
}

class Sub extends Base {
    public static function bar() {
        return 'Sub::bar called';
    }
}

$callable = Foo::make(); // the string 'static::bar'
Sub::run($callable); // prints 'Sub::bar called', not 'Foo::bar called'

?>"
description = "The relative class names ``self``, ``parent`` and ``static`` only have a meaning inside a class body, resolved against the scope currently active. Nothing stops a string or array callable from containing ``static``, e.g. ``'static::method'`` or ``['static', 'method']``, but such a callable has no fixed target: PHP resolves ``static`` using late static binding against whatever called scope happens to be active where the callable is finally *invoked* (through ``call_user_func()``, ``is_callable()``, etc.), which can be a completely different class than the one where the string was built.

As of PHP 8.2, resolving a callable that uses ``static`` this way emits ``Use of \"static\" in callables is deprecated``. The callable still works for now -- and keeps resolving against the invocation-time called scope -- but this implicit, moving-target behaviour is expected to be removed in a future version."
alternative[] = "Replace 'static::method' with static::class . '::method' so the callable is no longer context-dependent."
alternative[] = "For array callables, use [static::class, 'method'] instead of ['static', 'method']."
alternative[] = "Use first-class callable syntax (PHP 8.1+), e.g. static::method(...), when the callable is created and used in the same place."
related[] = "use-of--\"self-\"-in-callables-is-deprecated"
related[] = "use-of--\"parent-\"-in-callables-is-deprecated"
related[] = "callables-of-the-form-[-\"%s"
examples[] = "Use of \"static\" in callables is deprecated"
tags[] = "deprecation"
