id = "passing-bool-is-deprecated,-use-1-or--1-instead"
error = "Passing bool is deprecated, use 1 or -1 instead"
phpVersion = "8.1+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

$cal = IntlCalendar::createInstance('UTC');

// true/false used to mean 'roll up'/'roll down', mirroring the
// underlying ICU API, which actually expects a signed amount.
$cal->roll(IntlCalendar::FIELD_HOUR_OF_DAY, true);

?>"
description = "``IntlCalendar::roll()`` (and the procedural ``intlcal_roll()``) add an amount to a calendar field, wrapping around instead of carrying into the next field -- e.g. rolling the hour field past 23 wraps back to 0 rather than advancing the day. The ``$value`` argument is meant to be a signed int amount, but PHP has always also special-cased a ``bool``: ``true`` is interpreted as ``1`` and ``false`` as ``-1`` -- not the ``0`` that PHP's normal bool-to-int coercion would produce, which is itself a common source of confusion, and does not appear to serve any purpose the plain integers ``1``/``-1`` don't already cover.

As of PHP 8.1, passing a ``bool`` for this argument emits this deprecation notice; it still works exactly as before for now, but relying on this special-cased, non-standard coercion is expected to stop being supported in a future version."
alternative[] = "Pass 1 instead of true to roll the field up by one."
alternative[] = "Pass -1 instead of false to roll the field down by one."
alternative[] = "Pass any other signed int to roll by more than one step in either direction."
related[] = ""
examples[] = "IntlCalendar::roll(): Passing bool is deprecated, use 1 or -1 instead"
