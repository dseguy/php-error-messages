id = "strict_types-declaration-must-be"
error = "strict_types declaration must be"
phpVersion = "7.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

namespace App;

declare(strict_types = 1);

?>"
description = "This is the same placement rule documented in full under ``strict_types declaration must be the very first statement in the script``: the ``declare(strict_types = ...)`` pragma changes how the whole file is compiled, so PHP must see it before compiling anything else. Here, the ``namespace`` statement, itself harmless, is still a statement, and it pushes the ``declare()`` out of first position.

Only a preceding ``declare()`` call (for ``ticks`` or ``encoding``) is tolerated before it; any other statement is not."
alternative[] = "Move the ``declare(strict_types = 1)`` statement to be the very first statement in the file."
