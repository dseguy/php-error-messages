id = "the-pdo::fetch_serialize-mode-is-deprecated"
error = "The PDO::FETCH_SERIALIZE mode is deprecated"
phpVersion = "8.1+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

$pdo = new PDO('sqlite::memory:');
$pdo->exec('CREATE TABLE t (x TEXT)');
$stmt = $pdo->query('SELECT x FROM t');

// Combined with FETCH_CLASS, this flag was meant to automatically
// unserialize() the raw column into the target class.
$stmt->setFetchMode(PDO::FETCH_CLASS | PDO::FETCH_SERIALIZE, 'stdClass');

?>"
description = "Combined with ``PDO::FETCH_CLASS``, the ``PDO::FETCH_SERIALIZE`` flag was meant to fetch a row by ``unserialize()``-ing one of its columns into an instance of the target class, relying on that class implementing the ``Serializable`` interface. Beyond depending on ``Serializable`` -- which is itself being phased out in favour of ``__serialize()``/``__unserialize()`` -- the flag has a long-standing implementation bug that makes it not actually usable as documented.

As of PHP 8.1, setting or using this fetch mode emits this deprecation notice, ahead of its planned removal in PHP 9.0."
alternative[] = "Fetch the raw column value with a plain fetch mode, then call unserialize() on it explicitly and assign the result where needed."
alternative[] = "Store structured data as JSON instead of a serialized PHP value, and decode it with json_decode() after fetching."
related[] = "%s-implements-the-serializable-interface"
examples[] = "PDOStatement::setFetchMode(): The PDO::FETCH_SERIALIZE mode is deprecated"
examples[] = "PDOStatement::fetch(): The PDO::FETCH_SERIALIZE mode is deprecated"
tags[] = "deprecation"
tags[] = "pdo"
seeAlso[PHP.Watch: PDO::FETCH_SERIALIZE deprecated] = "https://php.watch/versions/8.1/PDO-FETCH_SERIALIZE-deprecated"
seeAlso[PDO fetch modes manual] = "https://www.php.net/manual/en/pdo.constants.fetch-modes.php"
