id = "syntax-error,-unexpected-variable-\"$this\",-expecting-\";\"-or-\"{\""
error = "syntax error, unexpected variable \"$this\", expecting \";\" or \"{\""
phpVersion = "7.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

abstract class X {
    abstract function foo() $this;
}

?>"
description = "An abstract method's signature must be terminated with a semicolon, since it has no body, and a concrete method's signature must be followed by a ``{`` opening the body. Here, the variable ``$this`` was found right after the closing parenthesis of the argument list, where PHP expected one of those two terminators.

``$this`` cannot appear here in any case: it is a read-only pseudo-variable, automatically bound to the current object inside a non-static method, and it can never be declared, assigned or used as a standalone statement outside of an expression."
alternative[] = "Remove ``$this`` and terminate the abstract method with a semicolon."
alternative[] = "If a method body was intended, replace ``$this`` with ``{`` and the method's code."
related[] = "syntax-error,-unexpected-identifier-\"%s\",-expecting-\";\"-or-\"{\""
examples[] = ""
tags[] = "syntax-error"
seeAlso[] = ""
features[] = "abstract"
features[] = "method"
features[] = "\$this"
