id = "returning-null-from-%s::__debuginfo()-is-deprecated,-make-the-return-type-non-nullable-and-return-an-empty-array-instead"
error = "Returning null from %s::__debugInfo() is deprecated, make the return type non-nullable and return an empty array instead"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class X {
    public function __debugInfo(): ?array {
        return null;
    }
}

var_dump(new X);

?>"
description = "The ``__debugInfo()`` magic method controls what ``var_dump()`` displays for instances of the class. It must return an array; historically, returning ``null`` was also tolerated and treated the same as an empty array (hiding all properties).

This message is emitted at class-declaration time whenever ``__debugInfo()`` is declared with a return type that allows ``null`` (``?array``, ``array|null``, and similar), regardless of whether the method is ever actually called or ever really returns ``null``. Since ``null`` and ``[]`` are handled identically, keeping the return type nullable serves no purpose, so PHP 8.6 deprecates it in favor of a strict ``array`` return type.

This is a compile-time counterpart to \"Returning null from %s::__debugInfo() is deprecated, return an empty array instead\", which instead fires at call time for a method that has no return type declared at all but returns ``null`` anyway."
alternative[] = "Declare ``__debugInfo(): array`` instead of ``__debugInfo(): ?array`` (or ``array|null``)."
alternative[] = "Return an empty array ``[]`` instead of ``null`` from ``__debugInfo()``."
related[] = "returning-null-from-%s::__debuginfo()-is-deprecated,-return-an-empty-array-instead"
examples[] = "Returning null from X::__debugInfo() is deprecated, make the return type non-nullable and return an empty array instead"
tags[] = "magic-method"
tags[] = "debugging"
tags[] = "deprecation"
tags[] = "return-type"
seeAlso[__debugInfo] = "https://www.php.net/manual/en/language.oop5.magic.php#language.oop5.magic.debuginfo"
seeAlso[var_dump] = "https://www.php.net/manual/en/function.var-dump.php"
features[] = "__debuginfo"
