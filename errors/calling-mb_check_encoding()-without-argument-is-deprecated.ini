id = "calling-mb_check_encoding()-without-argument-is-deprecated"
error = "Calling mb_check_encoding() without argument is deprecated"
phpVersion = "8.1+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

// Called without any argument.
var_dump(mb_check_encoding());

?>"
description = "``mb_check_encoding()`` normally takes a string (or an array of strings) and checks whether it is valid in a given encoding. It could also be called with no arguments at all, in which case the documentation claimed it would check ``\$_GET``, ``\$_POST``, ``\$_SERVER``, and other superglobal input for encoding validity.

In practice, this zero-argument form was never fully implemented: it only reported whether any invalid byte sequences had been detected so far during the request, rather than actually checking all of the input again. Because this behavior is confusing and unreliable, calling ``mb_check_encoding()`` without an argument is deprecated as of PHP 8.1.0."
alternative[] = "Pass the value to check explicitly, e.g. ``mb_check_encoding(\$value, 'UTF-8')``."
alternative[] = "Validate each relevant superglobal entry individually instead of relying on the implicit whole-request check."
