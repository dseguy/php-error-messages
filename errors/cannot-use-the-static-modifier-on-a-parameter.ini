id = "cannot-use-the-static-modifier-on-a-parameter"
error = "Cannot use the static modifier on a parameter"
phpVersion = "8.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

    class X {
        function foo(static $argument) {
        
        }
    }

?>"
description = "It is not possible to use ``static`` as a type for a parameter. It is possible for a return value, but not for parameters, not properties."
alternative[] = "Use self pseudo-type."
alternative[] = "Use the name of the class as type."
alternative[] = "Use one of the interface as type."
