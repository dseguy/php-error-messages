id = "deriving-$_server['argv']-from-the-query-string-is-deprecated.-configure-register_argc_argv=0-to-turn-this-message-off"
error = "Deriving $_SERVER['argv'] from the query string is deprecated. Configure register_argc_argv=0 to turn this message off"
phpVersion = "8.5+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

    var_dump($_SERVER['argv']);

?>"
description = "When the ``register_argc_argv`` INI directive is enabled and PHP is running under a non-CLI SAPI (such as CGI/FastCGI), ``$_SERVER['argv']`` and ``$_SERVER['argc']`` used to be reconstructed from the raw query string, splitting it on ``+`` the same way a shell would split command-line arguments. This behaviour only makes sense for the CLI SAPI, where a real argument vector exists, and is now deprecated for every other SAPI.

To reproduce this message, run a script under the CGI SAPI with a non-empty query string, for instance: ``php-cgi -d register_argc_argv=1`` with ``QUERY_STRING=foo=bar`` set in the environment, the way a web server would when forwarding a request."
alternative[] = "Set ``register_argc_argv=0`` in php.ini to silence the message; ``$_SERVER['argv']`` will simply not be populated outside of the CLI SAPI."
alternative[] = "Use ``$_GET`` to read individual query string parameters instead of parsing ``$_SERVER['argv']``."
alternative[] = "Use ``$_SERVER['QUERY_STRING']`` if the raw, unparsed query string is needed."
related[] = ""
examples[] = ""
tags[] = ""
seeAlso[register_argc_argv] = "https://www.php.net/manual/en/ini.core.php#ini.register-argc-argv"
features[] = "\$argv"
features[] = "cgi"
features[] = "query-string"
