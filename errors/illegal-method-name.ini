id = "illegal-method-name"
error = "Illegal method name"
phpVersion = "8.5+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class X {
    public static function foo() { return 1; }
}

const C = X::{0}(...);

var_dump(C);

?>"
description = "PHP 8.5 allows first-class callable syntax (``(...)``) to be used inside a constant expression, so that a static method call can be turned into a ``Closure`` at compile time. To build that closure, the compiler needs the method name as a string that it can resolve at compile time.

Here, the braced expression ``{0}`` is a compile-time constant, but it is an integer, not a string, so it cannot be used as a method name. PHP reports this as an illegal method name.

This differs from 'Cannot use dynamic method name in constant expression', which is reported when the braced expression cannot be resolved to a constant value at all (for example, because it depends on a variable or is a non-scalar value such as an array)."
alternative[] = "Use a string, instead of a number or another scalar, for the method name."
alternative[] = "Ensure the method name is a literal string, or an expression that PHP can resolve to one at compile time."
related[] = "cannot-use-dynamic-method-name-in-constant-expression"
related[] = "illegal-function-name"
related[] = "cannot-use-dynamic-function-name-in-constant-expression"
