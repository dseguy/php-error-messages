id = "use-of-mbstring.http_output-is-deprecated"
error = "Use of mbstring.http_output is deprecated"
phpVersion = "5.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

ini_set('mbstring.http_output', 'UTF-8');

?>"
description = "``mbstring.http_output`` used to tell the mbstring extension which encoding to convert outgoing HTTP response data to, so it could transparently re-encode output (in combination with ``mbstring.encoding_translation`` and the ``mb_output_handler`` output buffer handler).

This mechanism predates, and overlaps with, the language-level ``output_encoding`` directive, and having two separate configuration surfaces for the same concern is a frequent source of confusion. ``mbstring.http_output`` has been deprecated since PHP 5.6.0, though the deprecation notice is only emitted when the directive is actually set."
alternative[] = "Use the ``output_encoding`` INI directive instead of ``mbstring.http_output``."
related[] = "use-of-mbstring.http_input-is-deprecated"
related[] = "use-of-mbstring.internal_encoding-is-deprecated"
