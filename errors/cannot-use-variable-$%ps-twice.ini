id = "cannot-use-variable-$%ps-twice"
error = "Cannot use variable $%pS twice"
phpVersion = "5.3+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function foo() {
    $a = 1;

    return function () use ($a, $a) {
        return $a;
    };
}

?>"
description = "The ``use`` clause of a closure lists the variables imported from the enclosing scope. Each variable can only appear once in that list: importing the same variable twice, whether by value or by reference, is redundant and not allowed.

This is checked at compile time, as the ``use`` list is processed."
alternative[] = "Remove the duplicate entry in the ``use`` clause."
related[] = ""
examples[] = "Cannot use variable $a twice"
tags[] = "closure"
seeAlso[] = ""
features[] = "closure"
features[] = "use"
