id = "declare(%s)-value-must-be-a-literal"
error = "declare(%s) value must be a literal"
phpVersion = "4.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

define('TICK_VALUE', 1);

declare(ticks = TICK_VALUE) {
    echo 'Done';
}

?>"
description = "``declare()`` directives (``ticks``, ``encoding``, ``strict_types``) are processed by the compiler while the file is being parsed, before any code actually runs. At that point, constants, variables, and function calls are not yet available, so only a literal value, such as ``1``, ``0``, or a quoted string, can be given as the directive's value.

This applies equally to every directive: ``ticks``, ``encoding``, and ``strict_types`` all require a literal."
alternative[] = "Replace the constant, variable, or expression with its literal value."
related[] = "strict_types-declaration-must-have-0-or-1-as-its-value"
related[] = "strict_types-declaration-must-be-the-very-first-statement-in-the-script"
related[] = "encoding-declaration-pragma-must-be"
examples[] = "declare(ticks) value must be a literal"
examples[] = "declare(strict_types) value must be a literal"
examples[] = "declare(encoding) value must be a literal"
tags[] = "declare"
