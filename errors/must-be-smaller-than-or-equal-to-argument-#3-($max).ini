id = "must-be-smaller-than-or-equal-to-argument-#3-($max)"
error = "must be smaller than or equal to argument #3 ($max)"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

clamp(5, 10, 1);

?>"
description = "PHP 8.6 introduces the ``clamp()`` function, which returns ``$value`` restricted to the inclusive range ``[$min, $max]``. For that range to mean anything, ``$min`` must not be greater than ``$max``.

Passing a ``$min`` that is greater than ``$max`` throws a ``ValueError`` for the second argument, naming ``$max`` as the argument it must not exceed, instead of silently returning a nonsensical result."
alternative[] = "Make sure the ``$min`` argument to ``clamp()`` is not greater than ``$max``; swap them if they were passed in the wrong order."
related[] = "must-not-be-nan"
examples[] = "clamp(): Argument #2 ($min) must be smaller than or equal to argument #3 ($max)"
