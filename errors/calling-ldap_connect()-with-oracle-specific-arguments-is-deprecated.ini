id = "calling-ldap_connect()-with-oracle-specific-arguments-is-deprecated"
error = "Calling ldap_connect() with Oracle-specific arguments is deprecated"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

$ldap = ldap_connect('ldap.example.com', 389, '/path/to/wallet', 'wallet_password', 1);

?>"
description = "When PHP's LDAP extension is built against Oracle Instant Client, ``ldap_connect()`` gained two extra, Oracle-specific parameters (``$wallet`` and ``$wallet_passwd``, plus an ``$auth_mode`` flag) on top of the hostname and port, to authenticate using an Oracle wallet.

This Oracle-only overload is now deprecated along with the rest of ``ldap_connect()``'s multi-argument forms, in favor of a dedicated function that only exists in Oracle-enabled builds."
alternative[] = "Use ``ldap_connect_wallet()`` to connect with an Oracle wallet instead of passing wallet arguments to ``ldap_connect()``."
related[] = "usage-of-ldap_connect-with-two-arguments-is-deprecated"
examples[] = ""
tags[] = "argument"
tags[] = "deprecated"
seeAlso[] = ""
features[] = "ldap"
previous = ""
next = ""
extension[] = "ldap"
analyzer[] = ""
changedBehavior[] = ""
