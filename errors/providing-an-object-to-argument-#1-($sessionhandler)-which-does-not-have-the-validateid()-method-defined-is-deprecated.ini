id = "providing-an-object-to-argument-#1-($sessionhandler)-which-does-not-have-the-validateid()-method-defined-is-deprecated"
error = "Providing an object to argument #1 ($sessionhandler) which does not have the validateId() method defined is deprecated"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class SessionHandlerTester implements SessionHandlerInterface {
    public function close(): bool { return true; }
    public function destroy($id): bool { return true; }
    public function gc($max_lifetime): int|false { return 1; }
    public function open($path, $name): bool { return true; }
    public function read($id): string { return ''; }
    public function write($id, $data): bool { return true; }
    // validateId() intentionally not implemented
}

session_set_save_handler(new SessionHandlerTester());
session_start();

?>"
description = "``validateId()`` currently lives on the optional ``SessionUpdateTimestampHandlerInterface``, so a handler passed to ``session_set_save_handler()`` can implement only ``SessionHandlerInterface`` and lack it; with ``session.use_strict_mode`` enabled, PHP falls back to accepting any externally supplied session ID without validating it, weakening the protection strict mode is meant to provide. ``validateId()`` is being folded into ``SessionHandlerInterface`` itself, so PHP 8.6 deprecates supplying a handler object that doesn't define it — it will become mandatory in PHP 9.0."
alternative[] = "Implement a public validateId(string $id): bool method on the session handler that checks whether the given ID already exists in storage."
alternative[] = "Implement SessionUpdateTimestampHandlerInterface (which also adds updateTimestamp()) explicitly so the requirement is visible at the class declaration."
related[] = "providing-an-object-to-argument-#1-($sessionhandler)-which-does-not-have-the-create_sid()-method-defined-is-deprecated"
