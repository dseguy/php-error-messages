id = "use-of-mbstring.internal_encoding-is-deprecated"
error = "Use of mbstring.internal_encoding is deprecated"
phpVersion = "5.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

ini_set('mbstring.internal_encoding', 'UTF-8');

?>"
description = "``mbstring.internal_encoding`` used to set the default encoding assumed by mbstring functions when no explicit encoding argument is given (e.g. ``mb_strlen(\$str)``).

This mechanism predates, and overlaps with, the language-level ``default_charset`` directive, which mbstring functions now fall back to when their own internal encoding has not been set explicitly at runtime via ``mb_internal_encoding()``. Having two separate configuration surfaces for the same concern is a frequent source of confusion. ``mbstring.internal_encoding`` has been deprecated since PHP 5.6.0, though the deprecation notice is only emitted when the directive is actually set."
alternative[] = "Use the ``default_charset`` INI directive instead of ``mbstring.internal_encoding``."
alternative[] = "Call ``mb_internal_encoding()`` at runtime if a specific encoding must be set programmatically."
related[] = "use-of-mbstring.http_input-is-deprecated"
related[] = "use-of-mbstring.http_output-is-deprecated"
