id = "namespace-declaration-statement-has-to-be"
error = "Namespace declaration statement has to be"
phpVersion = "5.3+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

echo 'Hello';

namespace App;

?>"
description = "A ``namespace`` declaration must be the very first statement of the file, or immediately follow a ``declare()`` call (such as ``declare(strict_types=1);``). Any other statement, including a simple ``echo``, a comment that generates output, or whitespace before the opening ``<?php`` tag, placed before the ``namespace`` statement makes it invalid.

The full message reads: ``Namespace declaration statement has to be the very first statement or after any declare call in the script``."
alternative[] = "Move the ``namespace`` statement to be the first statement in the file, right after the opening ``<?php`` tag."
alternative[] = "Only keep a ``declare()`` call before the ``namespace`` statement, and move everything else after it."
alternative[] = "Remove any whitespace or output before the opening ``<?php`` tag."
related[] = "no-code-may-exist-outside-of-namespace-{}"
related[] = "strict_types-declaration-must-be-the-very-first-statement-in-the-script"
related[] = "cannot-mix-bracketed-namespace-declarations"
related[] = "encoding-declaration-pragma-must-be"
examples[] = "Namespace declaration statement has to be the very first statement or after any declare call in the script"
