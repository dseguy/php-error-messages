id = "the-$context-parameter-has-no-effect-for-finfo_buffer()"
error = "The $context parameter has no effect for finfo_buffer()"
phpVersion = "8.5+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

\$finfo = new finfo(FILEINFO_MIME_TYPE);
\$context = stream_context_create();

echo \$finfo->buffer('some data', FILEINFO_NONE, \$context);

?>"
description = "``finfo_buffer()`` (and ``finfo::buffer()``) accept an optional ``\$context`` parameter, mirroring the signature of stream-related functions. Unlike ``finfo_file()``, which does use a stream context to open the file it inspects, ``finfo_buffer()`` operates directly on an in-memory string and never opens a stream, so the ``\$context`` argument has never had any effect.

As of PHP 8.5.0, passing a value for ``\$context`` raises a deprecation notice to reflect that fact."
alternative[] = "Stop passing a ``\$context`` argument to ``finfo_buffer()``/``finfo::buffer()``."
related[] = ""
