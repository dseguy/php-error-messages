id = "never-can-only-be-used-as-a-standalone-type"
error = "never can only be used as a standalone type"
phpVersion = "8.1+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function foo(): int|never {}

?>"
description = "``never`` is a special return type, indicating that a function or method never returns control to its caller: it always throws, calls ``exit()``, or otherwise never completes normally.

Because ``never`` represents the absence of any return at all, it cannot be combined with other types in a union, nor made nullable: it can only be used on its own, as the sole return type of a function or method."
alternative[] = "Remove the other types, and use ``never`` alone."
alternative[] = "Remove ``never``, and keep the other type(s) alone."
