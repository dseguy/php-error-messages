id = "cannot-create-closure-for-parent-property-hook-call"
error = "Cannot create Closure for parent property hook call"
phpVersion = "8.4+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class Base {
	public string $name = '' {
		get => $this->name;
	}
}

class Child extends Base {
	public string $name = '' {
		get {
			$fn = parent::$name::get(...);
			return $fn();
		}
	}
}

?>"
description = "parent::$property::get() (and ::set()) is dedicated syntax, resolved at compile time, that invokes the property hook implementation the current class overrides. It does not correspond to a standalone, independently callable method the way parent::method() does, so it cannot be captured as a first-class callable / Closure."
alternative[] = "Call the parent hook directly instead of turning it into a Closure: parent::$name::get()."
alternative[] = "Wrap the call yourself in an ordinary closure: $fn = fn() => parent::$name::get();"
related[] = "cannot-use-the-static-modifier-on-a-property-hook"
examples[] = ""
tags[] = ""
seeAlso[] = ""
features[] = "property-hook"
features[] = "first-class-callable"
