id = "use-of-iconv.output_encoding-is-deprecated"
error = "Use of iconv.output_encoding is deprecated"
phpVersion = "5.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

ini_set('iconv.output_encoding', 'UTF-8');

?>"
description = "``iconv.output_encoding`` used to tell PHP which encoding to convert output into, via the iconv extension's own output handler. Having several overlapping encoding-related INI settings, each affecting only part of the request, was a frequent source of mismatched-encoding bugs.

As of PHP 5.6, setting ``iconv.output_encoding`` (whether in php.ini or via ``ini_set()``/``iconv_set_encoding()``) emits this deprecation notice; the single, extension-agnostic ``default_charset`` setting should be used instead."
alternative[] = "Leave iconv.output_encoding unset and rely on default_charset instead."
alternative[] = "Convert generated output explicitly with iconv() where a specific output encoding must be guaranteed."
related[] = "use-of-iconv.internal_encoding-is-deprecated"
related[] = "use-of-iconv.input_encoding-is-deprecated"
examples[] = "ini_set(): Use of iconv.output_encoding is deprecated"
examples[] = "iconv_set_encoding(): Use of iconv.output_encoding is deprecated"
tags[] = "deprecation"
tags[] = "iconv"
tags[] = "ini-setting"
seeAlso[default_charset manual] = "https://www.php.net/manual/en/ini.core.php#ini.default-charset"
seeAlso[iconv runtime configuration manual] = "https://www.php.net/manual/en/iconv.configuration.php"
