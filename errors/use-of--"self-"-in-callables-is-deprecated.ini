id = "use-of--\"self-\"-in-callables-is-deprecated"
error = "Use of \\\"self\\\" in callables is deprecated"
phpVersion = "8.2+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class Foo {
    public static function bar() {
        return 'Foo::bar called';
    }

    public static function make() {
        // The string is built here, inside Foo, but 'self' is NOT
        // resolved against Foo -- see where it is actually invoked below.
        return 'self::bar';
    }
}

class Other {
    public static function bar() {
        return 'Other::bar called';
    }

    public function run($callable) {
        // 'self' resolves against THIS scope (Other), the one active
        // where the callable is invoked, not where the string was built.
        var_dump(call_user_func($callable));
    }
}

$callable = Foo::make(); // the string 'self::bar'
(new Other)->run($callable); // prints 'Other::bar called', not 'Foo::bar called'

?>"
description = "The relative class names ``self``, ``parent`` and ``static`` only have a meaning inside a class body, resolved against the scope currently active. Nothing stops a string or array callable from containing one of them, e.g. ``'self::method'`` or ``['self', 'method']``, but such a callable has no fixed target: PHP resolves ``self`` against whatever class scope happens to be active where the callable is finally *invoked* (through ``call_user_func()``, ``is_callable()``, etc.), which can be a completely different class than the one where the string was built.

As of PHP 8.2, resolving a callable that uses ``self`` this way emits ``Use of \"self\" in callables is deprecated``. The callable still works for now -- and keeps resolving against the invocation-time scope -- but this implicit, moving-target behaviour is expected to be removed in a future version."
alternative[] = "Replace 'self::method' with self::class . '::method' (or the target class's own name) so the callable is no longer context-dependent."
alternative[] = "For array callables, use [self::class, 'method'] instead of ['self', 'method']."
alternative[] = "Use first-class callable syntax (PHP 8.1+), e.g. self::method(...), when the callable is created and used in the same place."
related[] = "use-of--\"parent-\"-in-callables-is-deprecated"
related[] = "use-of--\"static-\"-in-callables-is-deprecated"
related[] = "callables-of-the-form-[-\"%s"
examples[] = "Use of \"self\" in callables is deprecated"
tags[] = "deprecation"
