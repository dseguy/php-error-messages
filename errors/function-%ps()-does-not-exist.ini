id = "function-%ps()-does-not-exist"
error = "Function %pS() does not exist"
phpVersion = "5.0+"
level = "E_ERROR"
exception = "ReflectionException"
code = "<?php

$reflection = new ReflectionFunction('does_not_exist');

?>"
description = "The ``ReflectionFunction`` constructor requires the name of an existing user-defined or internal function. When the given name does not match any declared function, the Reflection API cannot build the requested introspection object and throws a ``ReflectionException`` instead."
alternative[] = "Check the function name for typos."
alternative[] = "Make sure any file declaring the function has been included before creating the ``ReflectionFunction``."
alternative[] = "Use ``function_exists()`` to check the function is available before reflecting on it."
related[] = "method-%ps::%ps()-does-not-exist"
examples[] = "Function does_not_exist() does not exist"
tags[] = "reflection"
seeAlso[] = ""
features[] = "reflection"
