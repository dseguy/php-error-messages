id = "variadic-placeholder-may-only-appear-once"
error = "Variadic placeholder may only appear once"
phpVersion = "8.5+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function add($a, $b, $c) {
	return $a + $b + $c;
}

$curried = add(..., ...);

?>"
description = "The ... placeholder used for partial function application (PHP 8.5) stands for all of the function's remaining, not-yet-supplied parameters, which become the parameters of the resulting Closure. Using it more than once in the same call is ambiguous, since there is only one set of \"remaining parameters\" to represent, so PHP allows at most one placeholder per call."
alternative[] = "Use a single ... placeholder per call; wrap the result in an extra closure for any additional free parameters."
related[] = "variadic-placeholder-must-be-last"
related[] = "cannot-combine-partial-application-and-unpacking"
