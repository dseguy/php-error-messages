id = "must-be-odd-if-argument-#1-($num)-is-negative"
error = "must be odd if argument #1 ($num) is negative"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

gmp_root(-27, 4);

?>"
description = "``gmp_root()`` and ``gmp_rootrem()`` compute the integer part of the ``$nth`` root of ``$num``. A negative number only has a real ``$nth`` root when ``$nth`` is odd (for example, the cube root of -27 is -3), so an even ``$nth`` combined with a negative ``$num`` has no meaningful integer result.

This validation has thrown a ``ValueError`` since PHP 8.0; PHP 8.6 only corrected the argument name referenced in the message, from the stub's actual parameter name ``$num`` (it previously said ``$a``, which never matched the real signature)."
alternative[] = "Only request an even $nth root of a negative $num if you actually mean a complex result; otherwise pass a non-negative $num or an odd $nth to gmp_root()/gmp_rootrem()."
related[] = "must-be-between-1-and-%lu"
examples[] = "gmp_root(): Argument #2 ($nth) must be odd if argument #1 ($num) is negative"
examples[] = "gmp_rootrem(): Argument #2 ($nth) must be odd if argument #1 ($num) is negative"
tags[] = "gmp"
tags[] = "math"
tags[] = "validation"
seeAlso[] = ""
features[] = "gmp-root"
previous = ""
next = ""
extension[] = "gmp"
analyzer[] = ""
changedBehavior[] = "PHP 8.0 through 8.5 threw the same ValueError but referenced the first argument as \"$a\", which did not match the function's actual $num parameter name."
