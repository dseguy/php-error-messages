id = "curlpipe_http1-is-deprecated"
error = "CURLPIPE_HTTP1 is deprecated"
phpVersion = "7.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

\$mh = curl_multi_init();
curl_multi_setopt(\$mh, CURLMOPT_PIPELINING, CURLPIPE_HTTP1);

?>"
description = "``CURLPIPE_HTTP1`` is a flag that used to enable HTTP/1.1 pipelining when passed to ``curl_multi_setopt()`` with the ``CURLMOPT_PIPELINING`` option. Support for HTTP/1.1 pipelining was removed from libcurl itself in version 7.62.0, because it proved fragile and was superseded by HTTP/2 multiplexing.

When PHP is linked against a libcurl older than 7.62.0, setting this flag still works but now raises an ``E_DEPRECATED`` notice. When linked against libcurl 7.62.0 or later (the common case on current systems), the same code instead raises an ``E_WARNING`` stating that ``CURLPIPE_HTTP1`` is no longer supported, and the flag has no effect either way."
alternative[] = "Remove ``CURLPIPE_HTTP1`` from the value passed to ``curl_multi_setopt(\$mh, CURLMOPT_PIPELINING, ...)``."
alternative[] = "Use ``CURLPIPE_MULTIPLEX`` to enable HTTP/2 multiplexing instead."
related[] = ""
examples[] = ""
