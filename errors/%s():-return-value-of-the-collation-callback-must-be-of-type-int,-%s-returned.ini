id = "%s():-return-value-of-the-collation-callback-must-be-of-type-int,-%s-returned"
error = "%s(): Return value of the collation callback must be of type int, %s returned"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "TypeError"
code = "<?php

$pdo = new Pdo\Sqlite('sqlite::memory:');

$pdo->createCollation('natcmp', function (string $a, string $b) {
    // strcmp() convention expected -- negative, zero or positive int
    return $a <=> $b ? strnatcasecmp($a, $b) <=> 0 : 0;
});

$pdo->exec('CREATE TABLE test (name TEXT)');
$pdo->query('SELECT name FROM test ORDER BY name COLLATE natcmp');

?>"
description = "``Pdo\Sqlite::createCollation()`` registers a userland function to be used as an SQL collating sequence. Like ``strcmp()``, the callback receives two strings and must return a negative, zero, or positive ``int`` depending on whether the first string sorts before, the same as, or after the second one.

As of PHP 8.5, the return value of the callback is strictly checked. Returning anything that is not an ``int`` -- for instance a ``bool`` from a ``<=>`` comparison used incorrectly, or nothing at all because of a missing ``return`` -- raises a ``TypeError``, instead of the previous behavior where a non-int value silently made the collation undefined.

The legacy ``PDO::sqliteCreateCollation()`` method, kept for backward compatibility, is affected by the same strict check."
alternative[] = "Make sure the callback always returns an ``int``, following the ``strcmp()`` convention of negative/zero/positive."
alternative[] = "Use the spaceship operator ``<=>`` directly on the two strings, or on a derived comparable value, since it already returns an ``int``."
alternative[] = "Declare an ``int`` return type on the callback to catch a wrong return value while writing it."
related[] = "%s():-return-value-of-the-authorizer-callback-must-be-of-type-int,-%s-returned"
related[] = "the-sqlite3-object-has-not-been-correctly-initialised-or-is-already-closed"
examples[] = "Pdo\\Sqlite::createCollation(): Return value of the collation callback must be of type int, bool returned"
