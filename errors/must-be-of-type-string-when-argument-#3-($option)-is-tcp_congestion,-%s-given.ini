id = "must-be-of-type-string-when-argument-#3-($option)-is-tcp_congestion,-%s-given"
error = "must be of type string when argument #3 ($option) is TCP_CONGESTION, %s given"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "TypeError"
code = "<?php

$socket = socket_create(AF_INET, SOCK_STREAM, SOL_TCP);

socket_set_option($socket, IPPROTO_TCP, TCP_CONGESTION, 123);

?>"
description = "``TCP_CONGESTION`` selects the congestion-control algorithm for a TCP socket, by name, e.g. ``\"cubic\"`` or ``\"bbr\"``. ``socket_set_option()`` requires ``$value`` (argument #4) to be a string for this option; any other type, such as the integer above, is rejected."
alternative[] = "Pass the congestion-control algorithm name as a string."
alternative[] = "List available algorithms via ``/proc/sys/net/ipv4/tcp_available_congestion_control`` on Linux."
related[] = "must-be-of-type-string-when-argument-#3-($option)-is-so_bindtodevice,-%s-given"
related[] = "must-be-of-type-string-when-argument-#3-($option)-is-tcp_function_blk,-%s-given"
examples[] = "socket_set_option(): Argument #4 ($value) must be of type string when argument #3 ($option) is TCP_CONGESTION, int given"
tags[] = "sockets"
tags[] = "networking"
tags[] = "validation"
seeAlso[] = ""
features[] = "socket-options"
