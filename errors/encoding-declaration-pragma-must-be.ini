id = "encoding-declaration-pragma-must-be"
error = "Encoding declaration pragma must be"
phpVersion = "5.3+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

echo 'Hello';

declare(encoding = 'ISO-8859-1');

?>"
description = "The ``declare(encoding = ...)`` pragma sets the source encoding PHP uses to parse the rest of the script, so, like ``strict_types``, it has to be known before anything else in the file is compiled. It must therefore be the very first statement in the script, exactly like the ``strict_types`` declaration.

The full message reads: ``Encoding declaration pragma must be the very first statement in the script``. In practice, this directive only has an effect when the ``zend.multibyte`` ini setting is enabled; otherwise it is silently ignored, but the placement rule is still enforced."
alternative[] = "Move the ``declare(encoding = ...)`` statement to be the very first statement in the file."
alternative[] = "Remove any characters or statements placed before the opening ``<?php`` tag."
related[] = "strict_types-declaration-must-be-the-very-first-statement-in-the-script"
related[] = "namespace-declaration-statement-has-to-be"
related[] = "declare(%s)-value-must-be-a-literal"
examples[] = "Encoding declaration pragma must be the very first statement in the script"
