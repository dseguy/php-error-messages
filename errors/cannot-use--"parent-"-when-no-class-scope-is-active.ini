id = "cannot-use--\"parent-\"-when-no-class-scope-is-active"
error = "Cannot use \\\"parent\\\" when no class scope is active"
phpVersion = "5.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function foo() {
    parent::bar();
}

?>"
description = "``parent::`` can only be used inside a class, trait, or enum, referring to the parent of the class in scope. It cannot be used in a plain function, nor at the top level of a script, where there is no class scope at all.

This differs from using ``parent::`` inside a class that has no parent: that case is a distinct, related error."
alternative[] = "Move the code inside a class that extends another class."
alternative[] = "Call the target method directly, on an instance or via its class name."
related[] = "cannot-use--\"parent-\"-when-current-class-scope-has-no-parent"
related[] = "cannot-use--\"%s-\"-when-no-class-scope-is-active"
