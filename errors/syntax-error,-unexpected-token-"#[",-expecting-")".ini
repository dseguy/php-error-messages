id = "syntax-error,-unexpected-token-\"#[\",-expecting-\")\""
error = "syntax error, unexpected token \"#[\", expecting \")\""
phpVersion = "8.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

try {
} catch (Exception #[SomeAttribute] $e) {
}

?>"
description = "Attributes can only be placed in front of the declarations that support them, such as classes, functions, methods and parameters. A ``catch`` block's caught-exception clause does not accept an attribute: PHP was expecting the closing parenthesis of the ``catch (...)`` clause, and found the beginning of an attribute, ``#[``, instead."
alternative[] = "Remove the attribute from the ``catch`` clause."
alternative[] = "Move the attribute to a declaration that supports it, such as the enclosing method."
related[] = "syntax-error,-unexpected-token-\")\",-expecting-variable"
examples[] = ""
tags[] = "syntax-error"
seeAlso[Attributes] = "https://www.php.net/manual/en/language.attributes.php"
features[] = "attribute"
features[] = "try-catch"
previous = ""
next = ""
extension[] = ""
analyzer[] = ""
changedBehavior[] = ""
