id = "cannot-redefine-class-constant-%s::%s-ce->type-==-zend_internal_class-?-e_core_error-:"
error = "Cannot redefine class constant %s::%s ce->type == ZEND_INTERNAL_CLASS ? E_CORE_ERROR :"
phpVersion = "8.3+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

trait T1 {
	const FOO = 1;
}

trait T2 {
	const FOO = 2;
}

class C {
	use T1, T2;
}

?>"
description = "PHP 8.3 allows traits to declare their own constants. %s and %s are replaced with the class and constant name involved. When a class composes two traits that each declare a constant of the same name with different values, or when a class or trait tries to redeclare a constant it already inherits with a different value, PHP cannot pick one unambiguously and raises this error; redeclaring a constant is only allowed when every declaration agrees on the exact same value. As with the reserved class constant name, the message's C-ternary tail simply reflects whether the class involved is one registered internally by the engine or an extension (E_CORE_ERROR), or an ordinary user class (E_COMPILE_ERROR)."
alternative[] = "Rename one of the conflicting constants."
alternative[] = "Declare the constant explicitly on the class with the intended value; an explicit class-level declaration takes precedence over the traits."
alternative[] = "Make sure every trait/class that declares the constant uses the exact same value."
related[] = "a-class-constant-must-not-be-called-class;-it-is-reserved-for-class-name-fetching-ce->type-==-zend_internal_class-?-e_core_error-:"
