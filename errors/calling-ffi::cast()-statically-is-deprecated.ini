id = "calling-ffi::cast()-statically-is-deprecated"
error = "Calling FFI::cast() statically is deprecated"
phpVersion = "8.3+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

$ffi = FFI::cdef('typedef struct { int x; int y; } point;');

$mem = $ffi->new('point');

$casted = FFI::cast('int', $mem);

?>"
description = "``cast()``, ``new()`` and ``type()`` are instance methods of the object returned by ``FFI::cdef()`` or ``FFI::load()``: each loaded C definition scope has its own set of types, so casting or instantiating should happen on that specific instance.

For convenience, PHP also allowed calling these methods statically as ``FFI::cast()``, ``FFI::new()`` and ``FFI::type()``, in which case they implicitly operated on an anonymous, definition-less scope. This static shortcut is ambiguous about which set of C declarations is being used, and is now deprecated."
alternative[] = "Call ``cast()`` on the ``FFI`` instance returned by ``FFI::cdef()`` or ``FFI::load()`` instead of calling it statically: ``$ffi->cast(...)``."
related[] = "calling-ffi::new()-statically-is-deprecated"
related[] = "calling-ffi::type()-statically-is-deprecated"
examples[] = ""
tags[] = "static"
tags[] = "deprecated"
