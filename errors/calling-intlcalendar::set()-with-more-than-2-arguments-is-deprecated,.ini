id = "calling-intlcalendar::set()-with-more-than-2-arguments-is-deprecated,"
error = "Calling IntlCalendar::set() with more than 2 arguments is deprecated,"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

$calendar = IntlCalendar::createInstance('UTC');

$calendar->set(2026, 0, 1, 12, 30, 0);

?>"
description = "``IntlCalendar::set()`` (and the procedural ``intlcal_set()``) used to accept between 2 and 6 arguments: a single field/value pair, or up to a year, month, day, hour, minute and second all at once. Squeezing several different call shapes into one method made the signature hard to read and to type correctly.

Calling it with more than 2 arguments — i.e. using it to set several date or time components at once — is now deprecated in favor of two dedicated methods."
alternative[] = "Use ``IntlCalendar::setDate()`` to set the year, month and day, or ``IntlCalendar::setDateTime()`` to also set the hour, minute and second."
related[] = "calling-intlgregoriancalendar::__construct()-with-more-than-2-arguments-is-deprecated,"
