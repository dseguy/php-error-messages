id = "static::class-cannot-be-used-for-compile-time-class-name-resolution"
error = "static::class cannot be used for compile-time class name resolution"
phpVersion = "5.5+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class Base {
	const NAME = static::class;
}

?>"
description = "static::class resolves to the class name of whichever subclass is actually in scope at runtime, through late static binding. A class constant, on the other hand, is resolved once and shared identically by the declaring class and every class that inherits it, so it cannot hold a value that is meant to vary per subclass. self::class is accepted in the same spot because it never varies."
alternative[] = "Use self::class if a fixed class name is acceptable."
alternative[] = "Expose it through a method instead: public static function name(): string { return static::class; }"
related[] = "static::-\"-is-not-allowed-in-compile-time-constants"
related[] = "static-\"-is-not-allowed-in-compile-time-constants"
