id = "strict_types-declaration-must-have-0-or-1-as-its-value"
error = "strict_types declaration must have 0 or 1 as its value"
phpVersion = "7.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

declare(strict_types = 2);

?>"
description = "The ``strict_types`` pragma is a switch: ``0`` keeps the usual weak typing (with type coercion for scalar type declarations), and ``1`` turns on strict typing for the current file. No other value makes sense, so PHP only accepts the literal integers ``0`` and ``1``; anything else, including ``true``, ``false``, or any other number, is rejected."
alternative[] = "Use ``1`` to enable strict typing, or ``0`` to keep weak typing."
related[] = "declare(%s)-value-must-be-a-literal"
related[] = "strict_types-declaration-must-be-the-very-first-statement-in-the-script"
related[] = "strict_types-declaration-must-not"
examples[] = "strict_types declaration must have 0 or 1 as its value"
