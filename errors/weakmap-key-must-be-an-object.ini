id = "weakmap-key-must-be-an-object"
error = "WeakMap key must be an object"
phpVersion = "8.0+"
level = "E_ERROR"
exception = "TypeError"
code = "<?php

$map = new WeakMap();

// WeakMap keys are held weakly, so they must be objects
$map['name'] = 'Damien';

?>"
description = "``WeakMap`` associates data with objects, and it holds its keys weakly: when a key object is destroyed, its entry is removed automatically. Because of this, only objects can be used as keys. Any other value, such as a string, an integer, an array or ``null``, triggers a ``TypeError``.

The check applies to every access to a ``WeakMap`` through array syntax: assignment, reading, ``isset()``, ``empty()`` and ``unset()``.

If you need to index data by a scalar value, use a regular ``array`` instead."
alternative[] = "Use an object as the key, such as the instance the data relates to."
alternative[] = "Use a regular array when the keys are strings or integers, as arrays do not need weak references."
alternative[] = "Check the key with is_object() before accessing the WeakMap."
related[] = "illegal-offset-type"
examples[] = "WeakMap key must be an object"
tags[] = "weakmap"
tags[] = "object"
tags[] = "type"
seeAlso[WeakMap] = "https://www.php.net/manual/en/class.weakmap.php"
