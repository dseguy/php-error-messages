id = "passing-a-negative-integer-to-argument-#3-($width)-is-deprecated"
error = "passing a negative integer to argument #3 ($width) is deprecated"
phpVersion = "8.3+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

echo mb_strimwidth('Hello world', 0, -5, '...');

?>"
description = "``mb_strimwidth()`` trims a string to a given display width. Its ``\$width`` argument used to accept negative values, in which case the width was measured from the end of the string instead of from ``\$start``.

A review of public code found essentially no real-world usage of a negative ``\$width``, and the feature made the function's behavior harder to reason about for little benefit. As of PHP 8.3.0, passing a negative integer for this argument is deprecated."
alternative[] = "Compute the trimmed width explicitly (e.g. using ``mb_strwidth()``) and pass a positive value to ``mb_strimwidth()``."
