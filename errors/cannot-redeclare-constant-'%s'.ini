id = "cannot-redeclare-constant-'%s'"
error = "Cannot redeclare constant '%s'"
phpVersion = "5.6+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

const FOO = 1;
const FOO = 2;

?>"
description = "A constant declared at the top level with the ``const`` keyword can only be declared once per namespace, per request. This is a compile-time error, unlike the runtime warning produced when calling ``define()`` twice with the same constant name.

This error also happens when a file declaring a top-level constant is included more than once without a guard."
alternative[] = "Remove the duplicate ``const`` declaration."
alternative[] = "Use ``include_once`` or ``require_once`` for files that declare top-level constants."
alternative[] = "If the constant needs to be conditionally declared, use ``define()`` together with ``defined()`` instead of ``const``."
related[] = "constant-%s-already-defined"
related[] = "cannot-declare-const-%s-because"
examples[] = "Cannot redeclare constant 'FOO'"
tags[] = "const"
seeAlso[] = ""
features[] = "const"
