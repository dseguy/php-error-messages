id = "setlocale()-expects-exactly-2-arguments-when-argument-#2-($locales)-is-an-array,-%d-given"
error = "setlocale() expects exactly 2 arguments when argument #2 ($locales) is an array, %d given"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ArgumentCountError"
code = "<?php

setlocale(LC_ALL, ['en_US.UTF-8', 'C'], 'fr_FR.UTF-8');

?>"
description = "``setlocale()`` accepts a locale to try either as one or more separate string arguments (each tried in turn until one succeeds), or as a single array of candidate locale strings passed as ``$locales``. Since PHP 8.6, mixing the two forms in the same call, an array followed by further trailing string arguments, is rejected outright: when ``$locales`` is an array, it must be the only argument supplied after ``$category``."
alternative[] = "Pass the candidate locales either as separate string arguments (setlocale($category, $a, $b, ...)) or as a single array ($category, [$a, $b, ...]), but not both in the same call."
related[] = ""
examples[] = "setlocale() expects exactly 2 arguments when argument #2 ($locales) is an array, 3 given"
tags[] = "locale"
tags[] = "validation"
seeAlso[] = ""
features[] = "locale"
previous = ""
next = ""
extension[] = "standard"
analyzer[] = ""
changedBehavior[] = "Prior to PHP 8.6, this combination was silently accepted: PHP tried each candidate in the array first, then went on to also try any trailing string arguments as further candidate locales, instead of rejecting the mixed call."
