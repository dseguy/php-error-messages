id = "use-of-mbstring.http_input-is-deprecated"
error = "Use of mbstring.http_input is deprecated"
phpVersion = "5.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

ini_set('mbstring.http_input', 'UTF-8');

?>"
description = "``mbstring.http_input`` used to tell the mbstring extension which encoding(s) to assume for incoming HTTP request data, so it could transparently convert it (in combination with ``mbstring.encoding_translation``).

This mechanism predates, and overlaps with, the language-level ``input_encoding`` directive, and having two separate configuration surfaces for the same concern is a frequent source of confusion. ``mbstring.http_input`` has been deprecated since PHP 5.6.0, though the deprecation notice is only emitted when the directive is actually set."
alternative[] = "Use the ``input_encoding`` INI directive instead of ``mbstring.http_input``."
related[] = "use-of-mbstring.http_output-is-deprecated"
related[] = "use-of-mbstring.internal_encoding-is-deprecated"
