id = "cannot-mix-[]-and-list()"
error = "Cannot mix [] and list()"
phpVersion = "7.1+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

$data = [1, [2, 3]];

list($a, [$b, $c]) = $data;

?>"
description = "list() and the short [] syntax are two different notations for exactly the same destructuring construct. PHP requires a single destructuring expression to use one notation consistently at every nesting level; using list() for the outer pattern and [] for a nested one, or the other way around, is rejected at compile time even though each form is individually valid."
alternative[] = "Use list() consistently at every level: list($a, list($b, $c)) = $data;"
alternative[] = "Use the short [] syntax consistently at every level: [$a, [$b, $c]] = $data;"
related[] = "cannot-assign-to-array(),-use-[]-instead"
