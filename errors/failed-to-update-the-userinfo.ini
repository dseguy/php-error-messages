id = "failed-to-update-the-userinfo"
error = "Failed to update the userinfo"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "Uri\\Error"
code = ""
description = "This is an internal, defensive error. ``Uri\\Rfc3986\\Uri::withUserInfo()`` asks the bundled ``uriparser`` library to replace the userinfo component; the library can only report success, a missing-host condition (``cannot-set-a-userinfo-without-having-a-host``), or a syntax error (``the-specified-userinfo-is-malformed``). This exception is thrown for any other, unexpected result code, which should not be reachable from PHP userland — it exists purely as a safety net, not as a condition an application is expected to trigger."
alternative[] = "This should not occur during normal use; if it does, it indicates a bug in the URI extension or the bundled uriparser library rather than a mistake in your code."
related[] = "cannot-set-a-userinfo-without-having-a-host"
related[] = "the-specified-userinfo-is-malformed"
