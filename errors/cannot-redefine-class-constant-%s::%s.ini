id = "cannot-redefine-class-constant-%s::%s"
error = "Cannot redefine class constant %s::%s"
phpVersion = "8.3+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class C {
    const FOO = "hello";
    const FOO = "hello again";
}

?>"
description = "PHP does not allow the same constant twice in the same class. The constant may be declared several times in different classes, including extending or extended ones, or in trait, as each case has conflict resolution mechanisms."
alternative[] = "Rename one of the conflicting constants."
alternative[] = "Remove one of the conflicting constants."
