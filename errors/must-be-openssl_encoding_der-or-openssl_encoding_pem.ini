id = "must-be-openssl_encoding_der-or-openssl_encoding_pem"
error = "must be OPENSSL_ENCODING_DER or OPENSSL_ENCODING_PEM"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

$session = Openssl\\Session::import('previously-exported-session-data', 999);

?>"
description = "PHP 8.6 introduces ``Openssl\\Session``, a class representing a TLS session that can be exported and later re-imported to resume a connection without a full handshake. Both ``Openssl\\Session::export()`` and the static ``Openssl\\Session::import()`` take a ``$format`` argument describing how the session data is encoded, but only two encodings are supported: ``OPENSSL_ENCODING_DER`` and ``OPENSSL_ENCODING_PEM``.

Passing any other integer as the format raises a ``ValueError``, since there is no other encoding these methods know how to produce or parse."
alternative[] = "Pass either ``OPENSSL_ENCODING_DER`` or ``OPENSSL_ENCODING_PEM`` as the ``$format`` argument to ``Openssl\\Session::export()`` or ``Openssl\\Session::import()``."
related[] = "must-not-exceed-%d-bytes"
examples[] = "Openssl\\Session::import(): Argument #2 ($format) must be OPENSSL_ENCODING_DER or OPENSSL_ENCODING_PEM"
