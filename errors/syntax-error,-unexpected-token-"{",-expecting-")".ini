id = "syntax-error,-unexpected-token-\"{\",-expecting-\")\""
error = "syntax error, unexpected token \"{\", expecting \")\""
phpVersion = "8.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php
    echo foo($variable{$index});
?>"
description = "This is a side effect of the removed support for curly braces as array and string offset syntax. Here, the parser was reading a function call's argument list and reached the point where it expects the closing parenthesis, but found the leftover curly brace instead. This exact wording appears since PHP 8.0, when curly-brace offset access was removed from the language."
alternative[] = "Refactor the curly braces to square ones."
related[] = "syntax-error,-unexpected-token-\"{\""
related[] = "array-and-string-offset-access-syntax-with-curly-braces-is-no-longer-supported"
