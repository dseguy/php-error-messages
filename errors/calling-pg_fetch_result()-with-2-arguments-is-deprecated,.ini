id = "calling-pg_fetch_result()-with-2-arguments-is-deprecated,"
error = "Calling pg_fetch_result() with 2 arguments is deprecated,"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

$conn = pg_connect('host=localhost dbname=test');
$result = pg_query($conn, 'SELECT id, name FROM users');

// 2-argument form: relies on an implicit \"current row\" cursor
echo pg_fetch_result($result, 'name'), \"\\n\";

?>"
description = "``pg_fetch_result()`` originally accepted two different call shapes: a 3-argument form giving the row and field explicitly, and a 2-argument form that omitted the row and implicitly fetched from an internal, auto-advancing row cursor. Mixing an explicit-row API and a stateful, cursor-based one in a single overloaded function made the behavior harder to predict, especially when other calls interleaved with the cursor's position.

As of PHP 8.4, calling ``pg_fetch_result()`` with only 2 arguments is deprecated in favor of always passing 3 arguments, using ``null`` explicitly for ``\$row`` when the old auto-advancing behavior is wanted."
alternative[] = "Call pg_fetch_result() with 3 arguments, passing null as \$row to keep the auto-advancing cursor behavior explicitly."
alternative[] = "Track the row index yourself and always pass it explicitly, instead of relying on the implicit cursor."
related[] = "calling-%s()-with-2-arguments-is-deprecated,"
examples[] = "Calling pg_fetch_result() with 2 arguments is deprecated, use the 3-parameter signature with a null $row parameter instead"
tags[] = "pgsql"
tags[] = "deprecated"
tags[] = "overloaded-signature"
seeAlso["PHP RFC: Deprecate functions with overloaded signatures"] = "https://wiki.php.net/rfc/deprecate_functions_with_overloaded_signatures"
