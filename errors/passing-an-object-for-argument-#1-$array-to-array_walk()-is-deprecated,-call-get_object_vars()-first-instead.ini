id = "passing-an-object-for-argument-#1-$array-to-array_walk()-is-deprecated,-call-get_object_vars()-first-instead"
error = "Passing an object for argument #1 $array to array_walk() is deprecated, call get_object_vars() first instead"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class Test {
    public $foo = 'foo';
    public $bar = 'bar';
}

array_walk(new Test(), function ($value, $key) {
    var_dump($key, $value);
});

?>"
description = "``array_walk()`` has always accepted an object in place of ``$array`` as an undocumented convenience, iterating over its accessible properties the same way it iterates array elements — including private and protected properties when called from inside the class. PHP 8.6 deprecates this implicit array/object interchangeability, since it makes visibility rules leak into what looks like ordinary array iteration."
alternative[] = "Convert the object to an array first with ``get_object_vars($obj)`` (from outside the class) and pass that to array_walk()."
alternative[] = "Iterate the object directly with foreach if you don't need array_walk()'s by-reference callback semantics."
related[] = "passing-an-object-for-argument-#1-$array-to-array_walk_recursive()-is-deprecated,-call-get_object_vars()-first-instead"
examples[] = ""
tags[] = "deprecation"
seeAlso[] = ""
features[] = "array"
