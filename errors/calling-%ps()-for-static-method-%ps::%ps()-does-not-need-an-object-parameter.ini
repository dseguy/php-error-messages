id = "calling-%ps()-for-static-method-%ps::%ps()-does-not-need-an-object-parameter"
error = "Calling %pS() for static method %pS::%pS() does not need an object parameter"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class TestClass {
    private static function staticMethod() {
        echo \"Called staticMethod()\n\";
    }
}

$method = new ReflectionMethod(TestClass::class, 'staticMethod');
$instance = new TestClass();

$method->invoke($instance);

?>"
description = "``ReflectionMethod::invoke()`` and ``ReflectionMethod::invokeArgs()`` accept an object as their first argument to use as ``$this`` inside the invoked method. For a static method there is no ``$this``, so that object is simply ignored — but silently ignoring it hides a likely mistake, such as invoking the wrong method or forgetting the target is static. PHP 8.6 deprecates passing a non-null object in this case."
alternative[] = "Pass ``null`` as the object argument when invoking a static method: ``$method->invoke(null)``."
alternative[] = "If you meant to call an instance method, check that ``$method`` really refers to it."
related[] = "calling-%ps()-with-a-given-object-that-is-not-an-instance-of-the-class-this-property-was-declared-in-is-deprecated"
examples[] = "Calling ReflectionMethod::invoke() for static method TestClass::staticMethod() does not need an object parameter"
examples[] = "Calling ReflectionMethod::invokeArgs() for static method TestClass::staticMethod() does not need an object parameter"
tags[] = "reflection"
tags[] = "deprecation"
seeAlso[] = ""
features[] = "reflection"
