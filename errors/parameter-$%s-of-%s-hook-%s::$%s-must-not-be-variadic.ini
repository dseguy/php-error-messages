id = "parameter-$%s-of-%s-hook-%s::$%s-must-not-be-variadic"
error = "Parameter $%s of %s hook %s::$%s must not be variadic"
phpVersion = "8.4+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class X
{
    public string $property {
        set(string ...$value) {
            $this->property = implode(',', $value);
        }
    }
}

?>"
description = "A ``set`` property hook must accept exactly one, ordinary parameter: the incoming value. Declaring it as variadic with ``...`` does not make sense, since the hook is always called with exactly one value, never with a variable number of arguments."
alternative[] = "Remove the ``...`` from the hook's parameter, and declare it as a regular parameter."
related[] = "parameter-$%s-of-%s-hook-%s::$%s-must-not-be-pass-by-reference"
related[] = "parameter-$%s-of-%s-hook-%s::$%s-must-not-have-a-default-value"
related[] = "%s-hook-of-property-%s::$%s-must-accept-exactly-one-parameters"
examples[] = "Parameter $value of set hook X::$property must not be variadic"
tags[] = "property hook"
tags[] = "variadic"
seeAlso[] = ""
features[] = "property-hook"
