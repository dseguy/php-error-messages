id = "assert.warning-ini-setting-is-deprecated"
error = "assert.warning INI setting is deprecated"
phpVersion = "8.3+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

ini_set('assert.warning', '0');

?>"
description = "``assert.warning`` is a legacy INI directive that, when ``assert.exception`` is disabled, controls whether a failed ``assert()`` call emits an ``E_WARNING``. It is part of the pre-PHP 7 assertion configuration that predates ``AssertionError``.

Since this directive only has an effect together with the also-deprecated ``assert.exception``, and there is no equivalent replacement to keep emitting a custom warning message, it is now deprecated as well. Once removed in PHP 9, disabling it will no longer be possible.

The deprecation notice is triggered whenever ``assert.warning`` is set to a falsy value, either in ``php.ini`` or through ``ini_set()``."
alternative[] = "Rely on the ``AssertionError`` exception thrown by failed assertions instead of the legacy warning-based reporting."
alternative[] = "Remove ``ini_set()``/``ini_get()`` calls involving ``assert.warning`` from the code."
related[] = "assert.active-ini-setting-is-deprecated"
related[] = "assert.bail-ini-setting-is-deprecated"
related[] = "assert.exception-ini-setting-is-deprecated"
