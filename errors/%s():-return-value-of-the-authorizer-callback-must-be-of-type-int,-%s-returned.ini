id = "%s():-return-value-of-the-authorizer-callback-must-be-of-type-int,-%s-returned"
error = "%s(): Return value of the authorizer callback must be of type int, %s returned"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "TypeError"
code = "<?php

$pdo = new Pdo\Sqlite('sqlite::memory:');

$pdo->setAuthorizer(function (int $action, ?string $arg1, ?string $arg2, ?string $arg3, ?string $arg4) {
    // Forgot to return an int constant -- this should return Pdo\Sqlite::OK, ::DENY or ::IGNORE
    return $action === Pdo\Sqlite::CREATE_TABLE ? 'allow' : 'deny';
});

$pdo->exec('CREATE TABLE test (id INTEGER)');

?>"
description = "``Pdo\Sqlite::setAuthorizer()`` installs a userland callback that SQLite consults before executing most operations, such as creating a table, reading a column, or attaching a database. The callback receives the action being authorized plus up to four contextual strings, and it must return one of the integer constants ``Pdo\Sqlite::OK``, ``Pdo\Sqlite::DENY`` or ``Pdo\Sqlite::IGNORE``.

As of PHP 8.5, PDO strictly checks the type of the returned value. If the callback returns anything that is not an ``int`` -- a string, a boolean, ``null``, or simply nothing because a ``return`` statement was forgotten on some branch -- a ``TypeError`` is thrown instead of the value being silently coerced.

The equivalent method on the standalone ``SQLite3`` extension, ``SQLite3::setAuthorizer()``, enforces the same strict check."
alternative[] = "Always return one of the constants ``Pdo\Sqlite::OK``, ``Pdo\Sqlite::DENY`` or ``Pdo\Sqlite::IGNORE`` from the callback."
alternative[] = "Add an explicit ``return`` statement on every branch of the callback, including the default one."
alternative[] = "Declare an ``int`` return type on the callback so mismatches are caught as soon as they are written."
related[] = "%s():-return-value-of-the-collation-callback-must-be-of-type-int,-%s-returned"
related[] = "the-sqlite3-object-has-not-been-correctly-initialised-or-is-already-closed"
examples[] = "Pdo\\Sqlite::setAuthorizer(): Return value of the authorizer callback must be of type int, string returned"
