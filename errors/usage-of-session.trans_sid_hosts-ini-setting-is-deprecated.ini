id = "usage-of-session.trans_sid_hosts-ini-setting-is-deprecated"
error = "Usage of session.trans_sid_hosts INI setting is deprecated"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

// A non-empty value (the empty-string default is fine) triggers the
// deprecation as soon as it's applied.
ini_set('session.trans_sid_hosts', 'example.com');

?>"
description = "``session.trans_sid_hosts`` restricts on which hosts PHP is allowed to rewrite URLs to inject the session ID (trans sid), which only matters when ``session.use_trans_sid`` is enabled in the first place. Trans sid itself -- propagating the session ID through the URL and hidden form fields instead of only a cookie -- is a legacy mechanism being phased out because it leaks session IDs into logs, the Referer header, and shared/bookmarked links.

As of PHP 8.4, setting ``session.trans_sid_hosts`` to any non-empty value emits this deprecation notice, as part of a broader deprecation of GET/POST (URL-based) session propagation ahead of its removal in PHP 9.0."
alternative[] = "Leave session.trans_sid_hosts empty and keep session.use_trans_sid disabled (its default), relying on cookies only."
alternative[] = "If trans sid is still required for a specific legacy integration, treat the whole feature -- not just this setting -- as something to migrate away from before PHP 9.0."
related[] = "usage-of-session.trans_sid_tags-ini-setting-is-deprecated"
related[] = "enabling-session.use_trans_sid-ini-setting-is-deprecated"
examples[] = "ini_set(): Usage of session.trans_sid_hosts INI setting is deprecated"
tags[] = "deprecation"
