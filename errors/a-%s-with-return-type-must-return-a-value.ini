id = "a-%s-with-return-type-must-return-a-value"
error = "A %s with return type must return a value"
phpVersion = "7.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function foo(): int {
    return;
}

?>"
description = "When a function or a method declares a return type, every ``return`` statement in its body must provide a value, unless the type accepts no returned value (``void``, ``never``) or the type allows ``null``.

Writing a bare ``return;``, without an expression, is only valid when the declared return type permits the absence of a value. Here, ``int`` does not, so the engine cannot supply an implicit value.

This is a compile time check: it does not depend on the code being executed."
alternative[] = "Add a value to the return statement, matching the declared return type."
alternative[] = "Remove the return type, if the function is not meant to return a value."
alternative[] = "Change the return type to ``void`` if the function is not meant to return a value."
related[] = "a-void-%s-must-not-return-a-value"
related[] = "a-void-%s-does-not-return-a-value"
