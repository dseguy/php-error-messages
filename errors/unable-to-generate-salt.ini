id = "unable-to-generate-salt"
error = "Unable to generate salt"
phpVersion = "7.0+"
level = "E_ERROR"
exception = "ValueError"
code = ""
description = "``password_hash()`` creates a random salt for each hash, using random bytes from the operating system. If those bytes cannot be read, no salt can be made, so no hash is produced and this error is thrown.

This is an environment problem rather than a problem in the code that calls ``password_hash()``. It is rare, and it is usually reported on systems where the random source is not available to PHP, or where entropy is missing, such as some containers and virtual machines."
alternative[] = "Check that ``random_bytes()`` works on the system, for example by calling ``random_bytes(16)`` in a small script."
alternative[] = "Check the random source of the operating system and of the container or virtual machine, and make sure PHP can read from it."
alternative[] = "Check the PHP build and its extensions, as a broken build can also lead to this error."
related[] = "generated-salt-too-short"
examples[] = "Unable to generate salt"
tags[] = "password"
tags[] = "salt"
tags[] = "random"
tags[] = "no generation"
seeAlso[password_hash] = "https://www.php.net/manual/en/function.password-hash.php"
seeAlso[random_bytes] = "https://www.php.net/manual/en/function.random-bytes.php"
features[] = "password"
features[] = "random"
