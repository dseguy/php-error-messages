id = "generated-salt-too-short"
error = "Generated salt too short"
phpVersion = "7.0+"
level = "E_ERROR"
exception = ""
code = ""
description = "``password_hash()`` creates a random salt for each hash. This error is thrown when the salt that was generated is shorter than the length the hashing algorithm needs, so the hash cannot be built.

Application code cannot fix this directly, as the salt is created inside PHP. It points to a problem with the random data or with the PHP build, and it is rare."
alternative[] = "Check that ``random_bytes()`` works on the system, for example by calling ``random_bytes(16)`` in a small script."
alternative[] = "Check the PHP build, and reinstall PHP if it is a custom or damaged build."
related[] = "unable-to-generate-salt"
examples[] = "Generated salt too short"
tags[] = "password"
tags[] = "not generated"
seeAlso[password_hash] = "https://www.php.net/manual/en/function.password-hash.php"
features[] = "password"
features[] = "random"
