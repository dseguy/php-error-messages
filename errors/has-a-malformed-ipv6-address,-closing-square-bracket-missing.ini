id = "has-a-malformed-ipv6-address,-closing-square-bracket-missing"
error = "has a malformed IPv6 address, closing square bracket missing"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

$snmp = new SNMP(SNMP::VERSION_2c, '[::1', 'public');

?>"
description = "``SNMP::__construct()`` accepts an IPv6 ``$hostname`` wrapped in square brackets, such as ``[::1]`` or ``[::1]:1161`` for a non-default port. The closing ``]`` is what tells the parser where the address ends and an optional ``:port`` suffix begins.

If the hostname starts with ``[`` but never contains a matching ``]``, the address cannot be parsed. As of PHP 8.6, this now throws a ``ValueError`` instead of emitting a warning and leaving the session half-constructed."
alternative[] = "Make sure a bracketed IPv6 ``$hostname`` is properly closed, e.g. ``[::1]`` or ``[::1]:1161``."
related[] = ""
examples[] = "SNMP::__construct(): Argument #2 ($hostname) has a malformed IPv6 address, closing square bracket missing"
tags[] = "snmp"
tags[] = "networking"
tags[] = "validation"
seeAlso[] = ""
features[] = "snmp-session"
previous = ""
next = ""
extension[] = "snmp"
analyzer[] = ""
changedBehavior[] = "Previously, this emitted an E_WARNING (\"Malformed IPv6 address, closing square bracket missing\") and left the SNMP object without a usable session, instead of throwing."
