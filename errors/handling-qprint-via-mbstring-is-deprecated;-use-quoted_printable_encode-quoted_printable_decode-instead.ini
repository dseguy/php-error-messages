id = "handling-qprint-via-mbstring-is-deprecated;-use-quoted_printable_encode-quoted_printable_decode-instead"
error = "Handling QPrint via mbstring is deprecated; use quoted_printable_encode/quoted_printable_decode instead"
phpVersion = "8.2+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

mb_convert_encoding('foo', 'qprint');

?>"
description = "Since PHP 8.2, several pseudo-encodings were dropped from mbstring, including ``qprint`` (Quoted-Printable), a text encoding that represents non-ASCII bytes using ``=XX`` sequences.

This functionality overlapped with the dedicated ``quoted_printable_encode()``/``quoted_printable_decode()`` functions provided by the standard extension. It remains usable until PHP 9, when it will be removed entirely."
alternative[] = "Use ``quoted_printable_encode()`` and ``quoted_printable_decode()`` instead of ``mb_convert_encoding()`` with the ``qprint`` encoding."
related[] = "handling-html-entities-via-mbstring-is-deprecated;-use-htmlspecialchars,-htmlentities,-or-mb_encode_numericentity-mb_decode_numericentity-instead"
related[] = "handling-base64-via-mbstring-is-deprecated;-use-base64_encode-base64_decode-instead"
related[] = "handling-uuencode-via-mbstring-is-deprecated;-use-convert_uuencode-convert_uudecode-instead"
