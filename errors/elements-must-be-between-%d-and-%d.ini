id = "elements-must-be-between-%d-and-%d"
error = "elements must be between %d and %d"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

$im = imagecreatetruecolor(10, 10);

imagesetstyle($im, [gdTransparent, PHP_INT_MIN]);

?>"
description = "``imagesetstyle()`` takes an array of color indexes (and, optionally, the special value ``IMG_COLOR_TRANSPARENT``) describing a repeating line style, later used by ``imageline()`` when drawing with ``IMG_COLOR_STYLED``. Each element is converted to a C ``int`` internally.

Starting in PHP 8.5, GD's array-accepting functions validate that every element actually fits in a native ``int`` instead of silently truncating it. Passing a value outside the ``int`` range, such as ``PHP_INT_MIN`` on a 64-bit build, now raises a ``ValueError`` naming the offending argument, instead of wrapping or misbehaving."
alternative[] = "Only use color indexes and style values that fit within a 32-bit signed integer range (between ``-2147483648`` and ``2147483647``)."
related[] = "value-must-be-between-0-and-%d"
related[] = "argument-#%d-($%s)-must-be-of-type-%s,-%s-given"
examples[] = "imagesetstyle(): Argument #2 ($style) elements must be between -2147483648 and 2147483647"
