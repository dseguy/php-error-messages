id = "%s-and-%s-define-the-same-property-($%s)-in-the-composition-of-%s.-however,-the-definition-differs-and-is-considered-incompatible.-class-was-composed"
error = "%s and %s define the same property ($%s) in the composition of %s. However, the definition differs and is considered incompatible. Class was composed"
phpVersion = "5.4+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

trait A {
    public int $count = 0;
}

trait B {
    protected int $count = 1;
}

class C {
    use A, B;
}

?>"
description = "There is no conflict resolution for properties: when two traits used by the same class declare a property with the same name, the property must be defined identically in both, or PHP raises this error while composing the class.

To be considered compatible, the property must have the same visibility, the same type, the same default value, and the same ``readonly``/``static`` modifiers in every trait it comes from.

Unlike methods, property conflicts cannot be settled with an ``insteadof`` or ``as`` rule in the ``use`` block: the only way out is to make the definitions match, or to remove the property from all but one trait."
alternative[] = "Make the property declaration identical (visibility, type, default value and modifiers) in every trait."
alternative[] = "Remove the property from all traits but one."
alternative[] = "Declare the property directly on the class instead, and remove it from the traits."
related[] = "%s-and-%s-define-the-same-constant-(%s)-in-the-composition-of-%s.-however,-the-definition-differs-and-is-considered-incompatible.-class-was-composed"
examples[] = "A and B define the same property ($count) in the composition of C. However, the definition differs and is considered incompatible. Class was composed"
tags[] = "surprise"
seeAlso[] = ""
features[] = "trait"
features[] = "class"
features[] = "property"
