id = "calling-ffi::type()-statically-is-deprecated"
error = "Calling FFI::type() statically is deprecated"
phpVersion = "8.3+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

FFI::cdef('typedef struct { int x; int y; } point;');

$type = FFI::type('point');

?>"
description = "``type()``, ``cast()`` and ``new()`` are instance methods of the object returned by ``FFI::cdef()`` or ``FFI::load()``: each loaded C definition scope has its own set of types, so resolving a type name should happen on that specific instance.

For convenience, PHP also allowed calling these methods statically as ``FFI::type()``, ``FFI::cast()`` and ``FFI::new()``, in which case they implicitly operated on an anonymous, definition-less scope. This static shortcut is ambiguous about which set of C declarations is being used, and is now deprecated."
alternative[] = "Call ``type()`` on the ``FFI`` instance returned by ``FFI::cdef()`` or ``FFI::load()`` instead of calling it statically: ``$ffi->type(...)``."
related[] = "calling-ffi::cast()-statically-is-deprecated"
related[] = "calling-ffi::new()-statically-is-deprecated"
examples[] = ""
tags[] = "static"
tags[] = "deprecated"
