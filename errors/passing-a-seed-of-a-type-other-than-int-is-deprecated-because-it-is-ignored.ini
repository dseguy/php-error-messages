id = "passing-a-seed-of-a-type-other-than-int-is-deprecated-because-it-is-ignored"
error = "Passing a seed of a type other than int is deprecated because it is ignored"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

// 'seed' is documented as an int; xxh3 simply ignores it when it
// isn't one, silently falling back to the unseeded, default hash.
var_dump(hash('xxh3', 'some data', false, ['seed' => '1234']));

?>"
description = "The ``xxh3`` and ``xxh128`` algorithms accept an optional ``'seed'`` entry (an ``int``) in the options array passed to ``hash()``/``hash_init()``. Unlike the older ``murmur3*``/``xxh32``/``xxh64`` algorithms -- where a non-int seed is coerced and effectively becomes ``0`` -- these two algorithms take a different code path: when ``'seed'`` is not an ``int``, it is simply *ignored altogether*, and neither the seed nor a secret is applied. Code that believes it configured a seed silently gets the plain, unseeded hash instead.

As of PHP 8.4, passing a non-int 'seed' to xxh3/xxh128 emits this deprecation notice so the silent no-op is no longer invisible. A future version is expected to throw a ``ValueError`` instead."
alternative[] = "Pass an actual int for 'seed', e.g. ['seed' => 1234] rather than a numeric string."
alternative[] = "Cast the value explicitly if it is computed dynamically: ['seed' => (int) $value]."
alternative[] = "Use 'secret' (a string) instead of 'seed' when more entropy than a single int provides is needed."
related[] = "passing-a-seed-of-a-type-other-than-int-is-deprecated-because-it-is-the-same-as-setting-the-seed-to-0"
related[] = "passing-a-secret-of-a-type-other-than-string-is-deprecated-because-it-implicitly-converts-to-a-string,-potentially-hiding-bugs"
examples[] = "hash(): Passing a seed of a type other than int is deprecated because it is ignored"
tags[] = "deprecation"
tags[] = "hash"
seeAlso[PHP RFC: Deprecations for PHP 8.4] = "https://wiki.php.net/rfc/deprecations_php_8_4"
seeAlso[hash manual] = "https://www.php.net/manual/en/function.hash.php"
