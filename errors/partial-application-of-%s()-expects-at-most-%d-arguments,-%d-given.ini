id = "partial-application-of-%s()-expects-at-most-%d-arguments,-%d-given"
error = "Partial application of %s() expects at most %d arguments, %d given"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ArgumentCountError"
code = "<?php

function add($a, $b) {
    return $a + $b;
}

$partial = add(1, 2, 3, ?);

?>"
description = "PHP 8.6 introduces partial function application: a ``?`` in an argument position stands in for a value to be supplied later, and turns the call into a ``Closure`` bound to whichever arguments were already given. A partial-application call still can't supply more argument slots (values or ``?`` placeholders combined) than the target function actually declares, unless that function is itself variadic.

Here, add() declares only 2 parameters, but the partial application supplies 4 slots (``1``, ``2``, ``3``, and a trailing ``?``), so PHP rejects it instead of creating a closure that could never be called successfully."
alternative[] = "Don't supply more argument slots (values or ? placeholders) to a partial application than the function declares, unless the function itself accepts a variadic parameter."
related[] = "partial-application-of-%s()-expects-%s-%d-arguments,-%d-given"
related[] = "cannot-combine-partial-application-and-unpacking"
examples[] = "Partial application of add() expects at most 2 arguments, 4 given"
