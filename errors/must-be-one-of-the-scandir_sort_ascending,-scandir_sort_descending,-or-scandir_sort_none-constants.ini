id = "must-be-one-of-the-scandir_sort_ascending,-scandir_sort_descending,-or-scandir_sort_none-constants"
error = "must be one of the SCANDIR_SORT_ASCENDING, SCANDIR_SORT_DESCENDING, or SCANDIR_SORT_NONE constants"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

scandir('/tmp', 42);

?>"
description = "``scandir()`` takes an optional ``$sorting_order`` argument controlling how the returned directory listing is sorted: ``SCANDIR_SORT_ASCENDING`` (the default), ``SCANDIR_SORT_DESCENDING``, or ``SCANDIR_SORT_NONE``.

Before PHP 8.6, passing any other integer silently fell through to one of these behaviors without warning. As of PHP 8.6, an unrecognized sorting order now throws a ``ValueError`` naming the offending argument."
alternative[] = "Pass one of ``SCANDIR_SORT_ASCENDING``, ``SCANDIR_SORT_DESCENDING``, or ``SCANDIR_SORT_NONE`` as the ``$sorting_order`` argument to ``scandir()``."
related[] = ""
examples[] = "scandir(): Argument #2 ($sorting_order) must be one of the SCANDIR_SORT_ASCENDING, SCANDIR_SORT_DESCENDING, or SCANDIR_SORT_NONE constants"
tags[] = "filesystem"
tags[] = "validation"
seeAlso[] = ""
features[] = "scandir-sort-order"
previous = ""
next = ""
extension[] = "standard"
analyzer[] = ""
changedBehavior[] = "Previously, an unrecognized ``$sorting_order`` value was silently accepted instead of throwing."
