id = "value-must-be-between-0-and-%d"
error = "value must be between 0 and %d"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

$im = imagecreatetruecolor(100, 100);

imagefilter($im, IMG_FILTER_SCATTER, 4, 4, [-1]);

?>"
description = "``imagefilter()`` with ``IMG_FILTER_SCATTER`` accepts an optional 5th argument: an array of color indexes to scatter, each of which is converted to a C ``int`` and must be a non-negative color index.

Starting in PHP 8.5, GD validates every element of that array and rejects negative or out-of-range values with a ``ValueError`` naming the offending argument, instead of passing a meaningless value through to the underlying library."
alternative[] = "Only pass non-negative color indexes, between ``0`` and ``2147483647``, in the color array given to ``imagefilter(IMG_FILTER_SCATTER)``."
related[] = "elements-must-be-between-%d-and-%d"
examples[] = "imagefilter(): Argument #5 value must be between 0 and 2147483647"
