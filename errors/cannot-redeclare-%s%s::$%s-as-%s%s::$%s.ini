id = "cannot-redeclare-%s%s::$%s-as-%s%s::$%s"
error = "Cannot redeclare %s%s::$%s as %s%s::$%s"
phpVersion = "5.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class X {
    protected static $property;
}

class Y extends X {
    protected $property;
}

?>"
description = "A non-``private`` property redeclared in a child class must keep the same ``static``/non-``static`` nature as in the parent class. A static property belongs to the class itself, while a non-static property belongs to each instance; the two are fundamentally different storage locations, so a child class cannot silently turn one into the other while inheriting from the same family.

Here, ``X::\$property`` is declared ``static``, and ``Y`` redeclares it as an instance property, which is rejected.

This is a distinct check from the one that reports ``readonly`` conflicts between parent and child properties: that message uses the literal word \"property\" (as in ``Cannot redeclare readonly property X::\$property as non-readonly Y::\$property``), while the static/non-static check never does."
alternative[] = "Make both declarations static."
alternative[] = "Make both declarations non-static."
alternative[] = "Remove the redeclaration in the child class, and inherit the parent property as-is."
related[] = "cannot-redeclare-%s-property-%s::$%s-as-%s-%s::$%s"
related[] = "cannot-override-final-property-%s::$%s"
examples[] = "Cannot redeclare static X::$property as non static Y::$property"
examples[] = "Cannot redeclare non static X::$property as static Y::$property"
