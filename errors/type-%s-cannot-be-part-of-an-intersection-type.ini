id = "type-%s-cannot-be-part-of-an-intersection-type"
error = "Type %s cannot be part of an intersection type"
phpVersion = "8.1+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function foo(): string&Iterator {}

?>"
description = "An intersection type, like ``string&Iterator``, requires a value to be an instance of every listed type at once. That is only meaningful for class and interface names: a value can implement several interfaces simultaneously.

Scalar and compound pseudo-types (``int``, ``float``, ``string``, ``bool``, ``array``, ``callable``, ``iterable``, ``mixed``, ``void``, ``never``, ``null``, ``false``, ``true``), as well as ``self``, ``parent`` and ``static``, cannot be combined into an intersection, since nothing can be, for instance, a ``string`` and an object implementing ``Iterator`` at the same time."
alternative[] = "Remove the scalar or pseudo-type from the intersection, and keep only class or interface names."
alternative[] = "Use a union type (``|``) instead, if any of the alternatives is acceptable."
related[] = "type-%s-contains-both-object-and-a-class-type"
related[] = "duplicate-type-%s-is-redundant"
examples[] = "Type string cannot be part of an intersection type"
tags[] = "type"
tags[] = "intersection"
