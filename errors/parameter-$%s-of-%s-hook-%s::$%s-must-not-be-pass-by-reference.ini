id = "parameter-$%s-of-%s-hook-%s::$%s-must-not-be-pass-by-reference"
error = "Parameter $%s of %s hook %s::$%s must not be pass-by-reference"
phpVersion = "8.4+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class X
{
    public string $property {
        set(&$value) {
            $this->property = $value;
        }
    }
}

?>"
description = "The parameter of a ``set`` property hook receives the value being assigned to the property. It cannot be declared as pass-by-reference with a leading ``&``, since a property hook is not meant to modify the caller's variable; it only reacts to, or transforms, the value on its way into the property."
alternative[] = "Remove the ``&`` from the hook's parameter."
related[] = "parameter-$%s-of-%s-hook-%s::$%s-must-not-be-variadic"
related[] = "parameter-$%s-of-%s-hook-%s::$%s-must-not-have-a-default-value"
related[] = "%s-hook-of-property-%s::$%s-must-accept-exactly-one-parameters"
examples[] = "Parameter $value of set hook X::$property must not be pass-by-reference"
tags[] = "property hook"
tags[] = "reference"
seeAlso[] = ""
features[] = "property-hook"
