id = "unknown-digest-algorithm:-%s"
error = "Unknown digest algorithm: %s"
phpVersion = "8.0+"
level = "E_WARNING"
exception = ""
code = "<?php

// hash() with a valid algorithm works
hash('sha256', 'my data');

// hash() with an unknown algorithm triggers the warning
hash('unknown_algo', 'my data');

// hash_file() also triggers it
hash_file('bad_algo', '/tmp/file.txt');

// hash_hmac() too
hash_hmac('invalid', 'my data', 'secret');

?>"
description = "The digest algorithm name passed to a hash function is not recognized by PHP's Hash extension.

The hash(), hash_file(), and hash_hmac() functions rely on a registry of supported algorithms. When an algorithm name is not found in that registry, this warning is emitted and the function returns false.

The list of available algorithms depends on the extensions loaded at runtime. Algorithms may be added or removed depending on the PHP version and compiled extensions.

Algorithms are case-insensitive, but misspellings will still produce this error."

alternative[] = "Check available algorithms with hash_algos() before using one."
alternative[] = "Use one of the standard algorithms: md5, sha1, sha256, sha512, sha3-256."
alternative[] = "Verify the algorithm is available by checking in_array($algo, hash_algos())."
alternative[] = "Install or enable the required extension that provides the algorithm (e.g. hash with GOST support)."
related[] = ""
examples[] = "Unknown digest algorithm: blowfish"
examples[] = "Unknown digest algorithm: tiger"
examples[] = "Unknown digest algorithm: sha3-224"
tags[] = "hash"
tags[] = "digest"
tags[] = "algorithm"
seeAlso[hash_algos] = "https://www.php.net/manual/en/function.hash-algos.php"
seeAlso[hash] = "https://www.php.net/manual/en/function.hash.php"
seeAlso[hash_file] = "https://www.php.net/manual/en/function.hash-file.php"
seeAlso[hash_hmac] = "https://www.php.net/manual/en/function.hash-hmac.php"
features[] = "hash"
features[] = "hashing"
features[] = "message-digest"
previous = ""
next = ""
extension[] = "hash"
analyzer[] = ""
changedBehavior[] = ""