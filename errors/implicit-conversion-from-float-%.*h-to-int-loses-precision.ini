id = "implicit-conversion-from-float-%.*h-to-int-loses-precision"
error = "Implicit conversion from float %.*H to int loses precision"
phpVersion = "8.1+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

function foo(int $a): int {
    // At return time
    return $a - 0.5;
}

// At call time
foo(1.1);

?>"
description = "This warning is emitted when a float is passed to a typed value that requires an integer. The float is truncated, not rounded, to an integer, and passed. 

This becomes a Fatal error when strict_types is actived.

The float might be a valid integer, when it has no decimal part: then, no error is emitted."
alternative[] = "Cast the float to integer before using it with a typed resource."
alternative[] = "Round the float to integer before using it with a typed resource."
related[] = ""
examples[] = "Implicit conversion from float 1.1 to int loses precision"
examples[] = "Implicit conversion from float 0.5 to int loses precision"
tags[] = ""
seeAlso[] = ""
features[] = "type"
features[] = "strict_types"
previous = ""
next = ""
extension[] = ""
analyzer[] = ""
changedBehavior[] = "implicitConversionToInt"