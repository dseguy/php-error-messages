id = "%s-%s-contains-%d-abstract-method%s-and-must-therefore-be-declared-abstract-or-implement-the-remaining-method%s-("
error = "%s %s contains %d abstract method%s and must therefore be declared abstract or implement the remaining method%s ("
phpVersion = "7.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

interface Colorful {
    function color();
}

class Suit implements Colorful {
}

?>"
description = "A class (or a trait, once it is used in a class) that does not provide a body for one or more of its abstract methods -- inherited from a parent class, or required by an implemented interface -- must itself be declared ``abstract``. Otherwise PHP has no concrete implementation to call when the method is invoked, and it stops with a fatal error while linking the class.

The message lists every abstract method that is still missing a concrete implementation, up to three of them; when there are more, the list ends with ``...``.

This is the templated, general-purpose version of the message: the first ``%s`` is replaced by the kind of structure (``Class`` or ``Interface``), the second by its name.

Since PHP 8.5, enums and anonymous classes no longer use this message: they get the dedicated ``%s %s must implement %d abstract method%s (...)`` message instead, since neither of them can be declared abstract."
alternative[] = "Implement the missing method(s), with a body, in the class."
alternative[] = "Declare the class ``abstract``."
alternative[] = "Remove the ``implements``/``extends`` clause that brings in the abstract method."
