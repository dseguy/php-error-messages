id = "passing-an-object-for-filter-parameters-for-bzip2.compress-is-deprecated,-call-get_object_vars()-first-instead"
error = "Passing an object for filter parameters for bzip2.compress is deprecated, call get_object_vars() first instead"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class ParamsCompress {
    public int $blocks = 5;
    public int $work = 10;
}

$fp = fopen('php://output', 'w');
stream_filter_append($fp, 'bzip2.compress', STREAM_FILTER_WRITE, new ParamsCompress());
fwrite($fp, 'Hello world');

?>"
description = "The ``bzip2.compress`` stream filter accepts its parameters as an associative array (``blocksize100k``, ``workfactor``), but has always also accepted an object, reading the same keys off its public properties. PHP 8.6 deprecates passing an object here, matching the equivalent deprecation for ``bzip2.decompress`` and for the zlib filters."
alternative[] = "Convert the object to an array first with ``get_object_vars($obj)`` and pass that as the filter parameters."
alternative[] = "Pass an associative array literal instead of building an options object."
related[] = "passing-an-object-for-filter-parameters-for-bzip2.decompress-is-deprecated,-call-get_object_vars()-first-instead"
related[] = "passing-an-object-for-filter-parameters-for-%s-is-deprecated,-call-get_object_vars()-first-instead"
examples[] = ""
tags[] = "deprecation"
seeAlso[] = ""
