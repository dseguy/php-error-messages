id = "cannot-use--\"%s-\"-when-no-class-scope-is-active"
error = "Cannot use \\\"%s\\\" when no class scope is active"
phpVersion = "5.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function foo() {
    return new self();
}

?>"
description = "``self`` and ``static`` refer to the class in which the code is written, respectively as a fixed reference and one resolved at call time (late static binding). Both require an active class scope: they can only be used inside a class, trait, or enum, not in a plain function nor at the top level of a script.

This error appears when ``self`` or ``static`` is used as a class reference, for instance to instantiate an object, call a static method, or fetch a class constant, outside of any class definition."
alternative[] = "Use the actual class name instead of ``self`` or ``static``."
alternative[] = "Move the code inside a class, trait, or enum."
related[] = "cannot-use--\"parent-\"-when-no-class-scope-is-active"
related[] = "cannot-use--\"parent-\"-when-current-class-scope-has-no-parent"
examples[] = "Cannot use \"self\" when no class scope is active"
examples[] = "Cannot use \"static\" when no class scope is active"
