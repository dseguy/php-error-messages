id = "providing-an-object-to-argument-#1-($sessionhandler)-which-does-not-have-the-create_sid()-method-defined-is-deprecated"
error = "Providing an object to argument #1 ($sessionhandler) which does not have the create_sid() method defined is deprecated"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class SessionHandlerTester implements SessionHandlerInterface {
    public function close(): bool { return true; }
    public function destroy($id): bool { return true; }
    public function gc($max_lifetime): int|false { return 1; }
    public function open($path, $name): bool { return true; }
    public function read($id): string { return ''; }
    public function write($id, $data): bool { return true; }
    // create_sid() intentionally not implemented
}

session_set_save_handler(new SessionHandlerTester());
session_start();

?>"
description = "``create_sid()`` and ``validateId()`` currently live on the optional ``SessionIdInterface`` / ``SessionUpdateTimestampHandlerInterface``, so a handler passed to ``session_set_save_handler()`` can implement ``SessionHandlerInterface`` alone and simply lack them; PHP silently falls back to its built-in session ID generation. Both methods are being folded into ``SessionHandlerInterface`` itself, so PHP 8.6 deprecates supplying a handler object that doesn't define ``create_sid()`` — it will become mandatory in PHP 9.0."
alternative[] = "Implement a public create_sid(): string method on the session handler, generating an unpredictable, unique session ID."
alternative[] = "Implement SessionIdInterface explicitly so the requirement is visible at the class declaration."
related[] = "providing-an-object-to-argument-#1-($sessionhandler)-which-does-not-have-the-validateid()-method-defined-is-deprecated"
