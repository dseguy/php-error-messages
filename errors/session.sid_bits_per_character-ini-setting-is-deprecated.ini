id = "session.sid_bits_per_character-ini-setting-is-deprecated"
error = "session.sid_bits_per_character INI setting is deprecated"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

ini_set('session.sid_bits_per_character', '5');

?>"
description = "``session.sid_bits_per_character`` used to control how many bits of entropy each character of a generated session ID encodes (from 4, hexadecimal, up to 6, a larger custom alphabet), in combination with ``session.sid_length``.

Letting this be configurable made it possible to end up with weak, easily-guessable session IDs if the values were lowered, without much practical benefit from raising them either. PHP 8.4 fixes the format to a 32-character hexadecimal session ID (4 bits per character) and deprecates the directive; it is only emitted when the value is set to something other than the fixed default of 4."
alternative[] = "Remove ``session.sid_bits_per_character`` from ``php.ini`` and from the code; PHP now always uses a 32-character hexadecimal session ID."
related[] = "session.sid_length-ini-setting-is-deprecated"
examples[] = ""
tags[] = ""
seeAlso[] = ""
features[] = "session"
features[] = "directive"
previous = ""
next = "session.sid_length-ini-setting-is-deprecated"
extension[] = "session"
analyzer[] = "none"
changedBehavior[] = "none"
