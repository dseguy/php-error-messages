id = "failed-to-update-the-scheme"
error = "Failed to update the scheme"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "Uri\\Error"
code = ""
description = "This is an internal, defensive error. ``Uri\\Rfc3986\\Uri::withScheme()`` asks the bundled ``uriparser`` library to replace the scheme component; the library can only report success or a syntax error (surfaced as ``the-specified-scheme-is-malformed``). This exception is thrown for any other, unexpected result code, which should not be reachable from PHP userland — it exists purely as a safety net, not as a condition an application is expected to trigger."
alternative[] = "This should not occur during normal use; if it does, it indicates a bug in the URI extension or the bundled uriparser library rather than a mistake in your code."
