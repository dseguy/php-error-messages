id = "passing-an-object-for-argument-#1-$array-to-array_walk_recursive()-is-deprecated,-call-get_object_vars()-first-instead"
error = "Passing an object for argument #1 $array to array_walk_recursive() is deprecated, call get_object_vars() first instead"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class Test {
    public $foo = 'foo';
    public $bar = ['x', 'y'];
}

array_walk_recursive(new Test(), function ($value, $key) {
    var_dump($key, $value);
});

?>"
description = "Like ``array_walk()``, ``array_walk_recursive()`` has always accepted an object in place of ``$array``, iterating over its accessible properties (recursing into any that are themselves arrays or objects) instead of requiring an array. PHP 8.6 deprecates this implicit object handling, along with the equivalent case in ``array_walk()``."
alternative[] = "Convert the object to an array first with ``get_object_vars($obj)`` and pass that to array_walk_recursive()."
alternative[] = "Write a small recursive helper for objects if visibility of nested properties matters."
related[] = "passing-an-object-for-argument-#1-$array-to-array_walk()-is-deprecated,-call-get_object_vars()-first-instead"
examples[] = ""
tags[] = "deprecation"
seeAlso[] = ""
features[] = "array"
