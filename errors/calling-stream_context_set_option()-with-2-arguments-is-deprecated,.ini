id = "calling-stream_context_set_option()-with-2-arguments-is-deprecated,"
error = "Calling stream_context_set_option() with 2 arguments is deprecated,"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

\$context = stream_context_create();

// 2-argument form: context + a full [\"wrapper\"][\"option\"] = value array
stream_context_set_option(\$context, ['http' => ['method' => 'POST']]);

?>"
description = "``stream_context_set_option()`` originally accepted two call shapes: a 4-argument form setting a single ``wrapper``/``option``/``value`` triple, and a 2-argument form that instead took a whole nested ``[\"wrapper\"][\"option\"] = value`` array in place of the last three arguments. Overloading a single function with such different shapes made the signature hard to express with proper types.

PHP 8.3 added a dedicated ``stream_context_set_options()`` function for the array form. As of PHP 8.4, calling ``stream_context_set_option()`` with only 2 arguments is deprecated in favor of that new function."
alternative[] = "Use stream_context_set_options(\$context, \$options) instead of stream_context_set_option(\$context, \$options) for the array form."
alternative[] = "Use the 4-argument form, stream_context_set_option(\$context, \$wrapper, \$option, \$value), to set a single option."
related[] = "calling-%s()-with-2-arguments-is-deprecated,"
examples[] = "Calling stream_context_set_option() with 2 arguments is deprecated, use stream_context_set_options() instead"
tags[] = "streams"
tags[] = "deprecated"
tags[] = "overloaded-signature"
seeAlso["PHP RFC: Deprecate functions with overloaded signatures"] = "https://wiki.php.net/rfc/deprecate_functions_with_overloaded_signatures"
seeAlso["stream_context_set_options()"] = "https://www.php.net/manual/en/function.stream-context-set-options.php"
