id = "%s():-implicitly-marking-parameter-$%s-as-nullable-is-deprecated,-the-explicit-nullable-type"
error = "%s(): Implicitly marking parameter $%s as nullable is deprecated, the explicit nullable type"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

// $x has no type-level '?', but a default of null makes it
// implicitly nullable -- this is the deprecated PHP 5 style.
function foo(int $x = null) {
    var_dump($x);
}

foo(1);

?>"
description = "Before union types existed, PHP let a scalar or class-typed parameter become nullable simply by giving it a default value of ``null``, e.g. ``function foo(int $x = null)``. The type itself still reads as ``int``, but the engine silently widened it to also accept ``null``, which is easy to miss when skimming a signature.

As of PHP 8.4, relying on this implicit widening emits a deprecation notice; the parameter still behaves as nullable for now, but the behaviour is expected to be dropped in a future version, at which point only an explicit nullable type would accept ``null``."
alternative[] = "Write the nullable type explicitly with a leading question mark: function foo(?int $x = null)."
alternative[] = "Or use an explicit union type: function foo(int|null $x = null)."
related[] = ""
examples[] = "foo(): Implicitly marking parameter $x as nullable is deprecated, the explicit nullable type must be used instead"
tags[] = "deprecation"
tags[] = "types"
tags[] = "nullable"
seeAlso[PHP RFC: Deprecate implicitly nullable parameter types] = "https://wiki.php.net/rfc/deprecate-implicitly-nullable-types"
seeAlso[Type declarations manual] = "https://www.php.net/manual/en/language.types.declarations.php"
features[] = "nullable"
features[] = "types"
