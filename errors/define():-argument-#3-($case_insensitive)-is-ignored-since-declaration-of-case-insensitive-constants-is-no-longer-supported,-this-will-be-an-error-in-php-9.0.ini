id = "define():-argument-#3-($case_insensitive)-is-ignored-since-declaration-of-case-insensitive-constants-is-no-longer-supported,-this-will-be-an-error-in-php-9.0"
error = "define(): Argument #3 ($case_insensitive) is ignored since declaration of case-insensitive constants is no longer supported, this will be an error in PHP 9.0"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

define('FOO', 'bar', true);

?>"
description = "Case-insensitive constants were deprecated in PHP 7.3 and their support was removed in PHP 8.0: passing ``true`` as the third argument of ``define()`` no longer makes the constant case-insensitive, and is simply ignored. This deprecation warns that the leniency is temporary: in PHP 9.0, passing a truthy value for ``$case_insensitive`` will stop being silently ignored and will instead raise a fatal error."
alternative[] = "Call ``define()`` with only two arguments: the constant name and its value."
alternative[] = "Use the ``const`` keyword instead of ``define()`` if the constant does not need to be defined conditionally."
related[] = "define():-argument-#3-($case_insensitive)-is-ignored-and-treated-as-false-since-declaration-of-case-insensitive-constants-is-no-longer-supported,-passing-the-argument-explicitly-is-unnecessary"
examples[] = "define(): Argument #3 ($case_insensitive) is ignored since declaration of case-insensitive constants is no longer supported, this will be an error in PHP 9.0"
tags[] = "constant"
tags[] = "define"
seeAlso[] = ""
features[] = "constant"
previous = "define():-argument-#3-($case_insensitive)-is-ignored-and-treated-as-false-since-declaration-of-case-insensitive-constants-is-no-longer-supported,-passing-the-argument-explicitly-is-unnecessary"
next = ""
extension[] = ""
analyzer[] = "none"
changedBehavior[] = "caseInsensitiveConstant"
