id = "calling-%ps()-with-a-1st-argument-which-is-not-null-or-an-object-is-deprecated"
error = "Calling %pS() with a 1st argument which is not null or an object is deprecated"
phpVersion = "8.3+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class X {
    public static int $count = 0;
}

$prop = new ReflectionProperty(X::class, 'count');

// deprecated: the 1st argument is ignored for static properties,
// but it must still be null or an object
$prop->setValue('ignored', 42);

var_dump(X::$count);

?>"
description = "``ReflectionProperty::setValue()`` sets a static property when called as ``setValue(null, $value)``: the 1st argument is not used to locate a static property, since it has no associated object, but it is still type-checked.

Prior to this deprecation, PHP silently accepted any value as the 1st argument in that case, as it was simply discarded. Since PHP 8.3, passing a value that is neither ``null`` nor an object as the 1st argument is deprecated, in order to make the accepted signature consistent with its declared ``?object`` type."
alternative[] = "Pass ``null`` explicitly as the 1st argument when setting a static property: ``setValue(null, $value)``."
alternative[] = "If the property is not static, pass the actual object instance as the 1st argument instead of an unrelated value."
related[] = "calling-%ps()-with-a-single-argument-is-deprecated"
examples[] = "Calling ReflectionProperty::setValue() with a 1st argument which is not null or an object is deprecated"
tags[] = "reflection"
tags[] = "static-property"
tags[] = "deprecation"
seeAlso[ReflectionProperty::setValue] = "https://www.php.net/manual/en/reflectionproperty.setvalue.php"
features[] = "reflection"
features[] = "static-property"
previous = ""
next = ""
extension[] = "reflection"
