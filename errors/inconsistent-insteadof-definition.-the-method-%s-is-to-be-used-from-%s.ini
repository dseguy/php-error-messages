id = "inconsistent-insteadof-definition.-the-method-%s-is-to-be-used-from-%s"
error = "Inconsistent insteadof definition. The method %s is to be used from %s"
phpVersion = "5.4+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

trait A {
    public function foo() {}
}

trait B {
    public function foo() {}
}

class C {
    use A, B {
        A::foo insteadof A, B;
    }
}

?>"
description = "The ``insteadof`` rule picks, for a given method name, the trait it should be taken from, and implicitly excludes that same method from every trait listed after ``insteadof``.

Here, ``A::foo insteadof A, B`` says both that ``foo`` should come from ``A``, and that ``A``'s own ``foo`` should be excluded, which is a direct contradiction. PHP's full message continues with ``, but %s is also on the exclude list`` naming the trait found in both places -- a part not captured in this templated entry, which only records the first sentence.

Note that listing a trait that is not otherwise involved in the conflict after ``insteadof`` is fine and does not raise this error; it is specifically excluding the trait the method is kept from that is inconsistent."
alternative[] = "Remove the trait providing the winning method from its own exclude list, keeping only the other conflicting traits after `insteadof`."
alternative[] = "Rewrite the rule as `A::foo insteadof B;` if only `B`'s `foo` should be excluded."
related[] = "a-precedence-rule-was-defined-for-%s::%s-but-this-method-does-not-exist"
related[] = "failed-to-evaluate-a-trait-precedence-(%s).-method-of-trait-%s-was-defined-to-be-excluded-multiple-times"
examples[] = "Inconsistent insteadof definition. The method foo is to be used from A"
