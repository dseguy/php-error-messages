id = "can't-use-function-return-value-in-write-context"
error = "Can't use function return value in write context"
phpVersion = "4.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function getValue() {
	return 5;
}

getValue() = 3;

unset(getValue());

?>"
description = "A write context is any position that needs an actual variable slot to write to, remove, or bind a reference to: the left side of an assignment, the target of unset(), a foreach-by-reference variable, and similar. A function call only produces a value; it does not designate a storage location, so the engine has nothing to write to, unset, or reference, and rejects the call outright at compile time, before it is ever executed."
alternative[] = "Store the return value in a variable first, then use the variable in the write context: $v = getValue(); unset($v);"
related[] = "can't-use-method-return-value-in-write-context"
