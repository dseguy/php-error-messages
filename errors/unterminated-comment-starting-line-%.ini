id = "unterminated-comment-starting-line-%"
error = "Unterminated comment starting line %"
phpVersion = "7.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

/*
comment

    Missing final / below
*

?>"
description = "Multi-line comments, written with ``/* ... */`` or ``/** ... */``, require a closing tag. When that closing tag is missing before the end of the file, PHP cannot determine where the comment was meant to stop and raises a compile error.

This problem does not affect single-line comments (``//`` or ``#``), since those are automatically closed by the end of the line."
alternative[] = "Check that the closing tag is complete, with both ``*`` and ``/``."
alternative[] = "Check that a closing tag has not been omitted entirely."
related[] = "unterminated-comment-starting-line-%d"
examples[] = "Unterminated comment starting line 3"
