id = "direct-instantiation-of-weakreference-is-not-allowed,-use-weakreference::create-instead"
error = "Direct instantiation of WeakReference is not allowed, use WeakReference::create instead"
phpVersion = "7.4+"
level = "E_ERROR"
exception = "Error"
code = "<?php

$object = new stdClass();

// WeakReference objects can only be created with WeakReference::create()
$reference = new WeakReference();

?>"
description = "A ``WeakReference`` holds a reference to an object without preventing that object from being destroyed. Such objects must be created with the static method ``WeakReference::create()``, which takes the object to watch as its argument. The ``new WeakReference()`` syntax is not allowed, and it throws an ``Error``.

``WeakReference::create()`` also returns the same ``WeakReference`` instance each time it is called with the same object, so comparing two references with ``===`` tells whether they point to the same object."
alternative[] = "Replace ``new WeakReference($object)`` with ``WeakReference::create($object)``."
alternative[] = "Once created, call ``get()`` on the reference to retrieve the object, or ``null`` if it has been destroyed."
related[] = ""
examples[] = "Direct instantiation of WeakReference is not allowed, use WeakReference::create instead"
