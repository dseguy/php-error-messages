id = "namespace-%s-is-an-invalid-class-name"
error = "namespace\\%s is an invalid class name"
phpVersion = "8.3+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function foo(namespace\self $a) {};

function foo( $a): namespace\self {};

class X {
    private namespace\self $f;
    private namespace\x $f2;
}

?>"
description = "This is the unquoted counterpart of the ``'namespace\\%s' is an invalid class name`` error: it carries the exact same runtime message, just without the surrounding single quotes PHP actually prints around the offending name.

``namespace`` used at the start of a fully qualified name refers to the current namespace, and is usually omitted. ``self`` describes the current class: it is a relative class name with no absolute-path equivalent, so writing it as ``namespace\\self`` (or the equivalent ``\\self``) is meaningless and rejected. The same applies to ``static`` and ``parent``."
alternative[] = "Remove the initial namespace and backslash."
alternative[] = "Use the literal name of the intended class."
related[] = "'namespace-%s'-is-an-invalid-class-name"
related[] = "is-an-invalid-class-name"
related[] = "'-%s'-is-an-invalid-class-name"
examples[] = "namespace\self is an invalid class name"
tags[] = "lower-case-name"
seeAlso[] = ""
features[] = "namespace"
features[] = "relative-types"
features[] = "fully-qualified-name"
