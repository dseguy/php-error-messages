id = "cannot-redeclare-function-%s()-(previously-declared-as-local-import)"
error = "Cannot redeclare function %s() (previously declared as local import)"
phpVersion = "5.3+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

namespace App;

use function Other\bar;

function bar() {}

?>"
description = "A ``use function`` statement imports a function under a local name, in the current namespace. When a function is then declared, in the same namespace, under that same local name, and its declared name differs (case insensitively) from the fully qualified imported name, PHP cannot tell which of the import or the local declaration should be used.

This is detected at compile time, as soon as the local function declaration is compiled."
alternative[] = "Remove the ``use function`` import, and call the function using its fully qualified name."
alternative[] = "Alias the import with the ``as`` keyword, so it no longer collides with the local function name."
alternative[] = "Rename the local function."
related[] = "cannot-redeclare-function-%s()-(previously-declared-in-%s:%d)"
related[] = "cannot-redeclare-%s()-(previously-declared-in-%s:%d)"
examples[] = "Cannot redeclare function bar() (previously declared as local import)"
tags[] = "namespace"
seeAlso[] = ""
features[] = "namespace"
features[] = "use-alias"
