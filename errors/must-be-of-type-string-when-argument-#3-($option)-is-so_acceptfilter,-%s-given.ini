id = "must-be-of-type-string-when-argument-#3-($option)-is-so_acceptfilter,-%s-given"
error = "must be of type string when argument #3 ($option) is SO_ACCEPTFILTER, %s given"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "TypeError"
code = "<?php

$socket = socket_create(AF_INET, SOCK_STREAM, SOL_TCP);

socket_set_option($socket, SOL_SOCKET, SO_ACCEPTFILTER, 123);

?>"
description = "``SO_ACCEPTFILTER`` (available on BSD-derived systems such as FreeBSD) names an accept filter by a short string, e.g. ``\"dataready\"``. ``socket_set_option()`` requires ``$value`` (argument #4) to be a string for this option; any other type, such as the integer above, is rejected. Note that the string must also be shorter than the platform's internal filter-name buffer and must not contain a null byte, which are reported as separate ``ValueError`` cases."
alternative[] = "Pass the accept filter name as a short string, without embedded null bytes."
alternative[] = "Consult your platform's accf(9)/setsockopt(2) documentation for valid filter names."
related[] = "must-be-of-type-string-when-argument-#3-($option)-is-so_bindtodevice,-%s-given"
related[] = "must-be-of-type-string-when-argument-#3-($option)-is-fil_attach-or-fil_detach,-%s-given"
examples[] = "socket_set_option(): Argument #4 ($value) must be of type string when argument #3 ($option) is SO_ACCEPTFILTER, int given"
tags[] = "sockets"
tags[] = "networking"
tags[] = "validation"
