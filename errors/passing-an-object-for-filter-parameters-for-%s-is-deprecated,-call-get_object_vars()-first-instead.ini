id = "passing-an-object-for-filter-parameters-for-%s-is-deprecated,-call-get_object_vars()-first-instead"
error = "Passing an object for filter parameters for %s is deprecated, call get_object_vars() first instead"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class Options {
    public int $level = 9;
}

$fp = fopen('php://output', 'w');
stream_filter_append($fp, 'zlib.deflate', STREAM_FILTER_WRITE, new Options());
fwrite($fp, 'Hello world');

?>"
description = "``stream_filter_append()`` (and ``stream_filter_prepend()``) pass their ``$params`` argument through to the named stream filter. The bundled ``zlib.deflate`` and ``zlib.inflate`` filters accept it as an associative array of options, but have always also accepted an object, reading the same keys off its public properties. PHP 8.6 deprecates passing an object for these two filters — the ``%s`` in the message is replaced with the filter name, ``zlib.deflate`` or ``zlib.inflate``. The bzip2 filters have the same deprecation under distinct, filter-specific messages."
alternative[] = "Convert the object to an array first with ``get_object_vars($obj)`` and pass that as the filter parameters."
alternative[] = "Pass an associative array literal instead of building an options object."
related[] = "passing-an-object-for-filter-parameters-for-bzip2.compress-is-deprecated,-call-get_object_vars()-first-instead"
related[] = "passing-an-object-for-filter-parameters-for-bzip2.decompress-is-deprecated,-call-get_object_vars()-first-instead"
examples[] = "stream_filter_append(): Passing an object for filter parameters for zlib.deflate is deprecated, call get_object_vars() first instead"
examples[] = "stream_filter_append(): Passing an object for filter parameters for zlib.inflate is deprecated, call get_object_vars() first instead"
tags[] = "deprecation"
seeAlso[] = ""
