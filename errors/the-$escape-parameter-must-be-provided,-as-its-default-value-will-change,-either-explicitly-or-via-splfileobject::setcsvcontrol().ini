id = "the-$escape-parameter-must-be-provided,-as-its-default-value-will-change,-either-explicitly-or-via-splfileobject::setcsvcontrol()"
error = "the $escape parameter must be provided, as its default value will change, either explicitly or via SplFileObject::setCsvControl()"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

file_put_contents('/tmp/data.csv', \"a,b,c\n\");

$file = new SplFileObject('/tmp/data.csv');
$file->setFlags(SplFileObject::READ_CSV);

// No $escape argument, and setCsvControl() was never called to set
// one explicitly either, so the (soon to change) default is used.
var_dump($file->fgetcsv());

?>"
description = "``SplFileObject::fgetcsv()`` and ``SplFileObject::fputcsv()`` take an ``$escape`` character used to escape the enclosure character inside CSV fields, currently defaulting to ``\\`` (backslash) -- a default that PHP 9.0 will change to an empty string, disabling escaping entirely by default, to better match RFC 4180 and other CSV parsers.

As of PHP 8.4, calling ``fgetcsv()``/``fputcsv()`` on a ``SplFileObject`` without an explicit ``$escape`` -- and without having set one explicitly via ``SplFileObject::setCsvControl()`` either -- emits this deprecation notice, so the pending default change does not silently alter behaviour later."
alternative[] = "Pass $escape explicitly on every fgetcsv()/fputcsv() call, e.g. $file->fgetcsv(',', '\"', '\\\\')."
alternative[] = "Call SplFileObject::setCsvControl() once with the escape character, so every later fgetcsv()/fputcsv() call already has it set."
alternative[] = "Decide now whether the code needs backslash-escaping (pass '\\\\') or the future default (pass '') and stop depending on the implicit default either way."
related[] = "the-$escape-parameter-must-be-provided-as-its-default-value-will-change"
examples[] = "SplFileObject::fgetcsv(): the $escape parameter must be provided, as its default value will change, either explicitly or via SplFileObject::setCsvControl()"
tags[] = "deprecation"
tags[] = "csv"
seeAlso[PHP.Watch: CSV functions $escape parameter] = "https://php.watch/versions/8.4/csv-functions-escape-parameter"
seeAlso[SplFileObject::setCsvControl manual] = "https://www.php.net/manual/en/splfileobject.setcsvcontrol.php"
features[] = "csv"
features[] = "escape-data"
previous = ""
next = ""
extension[] = "spl"
analyzer[] = ""
changedBehavior[] = "fputcsvEscape"