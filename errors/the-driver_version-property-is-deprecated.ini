id = "the-driver_version-property-is-deprecated"
error = "The driver_version property is deprecated"
phpVersion = "8.1+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

$driver = new mysqli_driver();

// Reading this property is deprecated; it has always just repeated
// PHP's own version number, not any driver-specific version.
var_dump($driver->driver_version);

?>"
description = "``mysqli_driver::$driver_version`` reads back the internal constant ``MYSQLI_VERSION_ID``, which sounds like it should report the version of the underlying MySQL client library (mysqlnd or libmysqlclient) but does not: it is a hardcoded value (``101009``) left over from mysqli's early days as a standalone PECL extension, and it has not tracked anything meaningful for a long time.

As of PHP 8.1, reading this property emits a deprecation notice; it keeps returning the same frozen value for now, ahead of being removed in a future version."
alternative[] = "Use PHP_VERSION or PHP_VERSION_ID directly if a PHP version number was actually wanted."
alternative[] = "Use mysqli_get_client_info() / mysqli_driver::$client_info if the actual client library version is needed."
related[] = ""
examples[] = "The driver_version property is deprecated"
tags[] = "deprecation"
tags[] = "mysqli"
tags[] = "lower-case-name"
