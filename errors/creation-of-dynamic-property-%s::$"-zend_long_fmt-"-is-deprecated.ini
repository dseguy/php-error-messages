id = "creation-of-dynamic-property-%s::$\"-zend_long_fmt-\"-is-deprecated"
error = "Creation of dynamic property %s::$\" ZEND_LONG_FMT \" is deprecated"
phpVersion = "8.2+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class Foo {
}

// PHP's serialization format allows an object property key to be
// stored as an integer ('i:0;') instead of a string ('s:1:\"0\";').
$serialized = 'O:3:\"Foo\":1:{i:0;s:1:\"x\";}';

$foo = unserialize($serialized);
var_dump($foo);

?>"
description = "This is the numeric-key twin of the more common ``Creation of dynamic property %s::$%s is deprecated`` notice. It fires when the property key being written is an integer rather than a string -- most often while restoring an object with ``unserialize()`` from data whose property key was encoded as ``i:N;`` instead of the usual ``s:len:\"name\";``. Since the class does not declare a property named after that integer and has not opted in with ``#[AllowDynamicProperties]``, PHP falls back to creating a dynamic property, but flags it as deprecated just like any other undeclared property write.

As of PHP 8.2, this deprecation also closes a gap where such integer-keyed properties could otherwise bypass the dynamic-property protections entirely."
alternative[] = "Declare the property in the class definition so the key, once cast to string, matches a known property."
alternative[] = "Add the #[AllowDynamicProperties] attribute to the class if dynamic properties are intentional."
alternative[] = "Sanitize or validate serialized data before calling unserialize(), rather than trusting arbitrary property keys."
related[] = "creation-of-dynamic-property-%s::$%s-is-deprecated"
examples[] = "Creation of dynamic property Foo::$0 is deprecated"
tags[] = "deprecation"
tags[] = "dynamic-property"
tags[] = "unserialize"
seeAlso[PHP RFC: Deprecate dynamic properties] = "https://wiki.php.net/rfc/deprecate_dynamic_properties"
seeAlso[AllowDynamicProperties] = "https://www.php.net/manual/en/class.allowdynamicproperties.php"
seeAlso[unserialize] = "https://www.php.net/manual/en/function.unserialize.php"
features[] = "allowdynamicproperties"
features[] = "dynamic-property"
features[] = "unserialize"
