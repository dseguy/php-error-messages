id = "access-level-to-%s::$%s-must-be-%s-(as-in-class-%s)%s"
error = "Access level to %s::$%s must be %s (as in class %s)%s"
phpVersion = "5.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class X {
    protected $property;
}

class Y extends X {
    private $property;
}

?>"
description = "A property redeclared in a child class cannot be given a stricter visibility than the one it has in the parent class. ``public`` may be narrowed to ``protected`` or ``private``, and ``protected`` may be narrowed to ``private``, but never the other way, and a child cannot go further and restrict a ``protected`` property down when the parent is already ``public`` unless it stays at least as visible.

Here, ``X::\$property`` is ``protected``, and ``Y`` tries to redeclare it as ``private``, which is a narrowing and is therefore rejected.

The trailing, optional part of the message (`` or weaker``) is added whenever the parent property is not ``public``: it means the child property must use the same visibility as the parent, or something even more permissive."
alternative[] = "Use the same visibility as the parent property."
alternative[] = "Use a visibility that is the same as, or wider than, the parent property's."
alternative[] = "Remove the redeclaration in the child class, and inherit the parent property as-is."
related[] = "access-level-to-%s::%s-must-be-%s-(as-in-%s-%s)%s"
related[] = "set-access-level-of-%s::$%s-must-be-%s-(as-in-class-%s)%s"
examples[] = "Access level to Y::$property must be protected or weaker (as in class X)"
tags[] = "visibility"
seeAlso[] = ""
features[] = "visibility"
features[] = "inheritance"
features[] = "property"
