id = "%s-\"-will-be-interpreted-as-a-class-name.-did-you-mean--\"%s-\"?-write--\"--%s-\"%s-to-suppress-this-warning"
error = "%s\\\" will be interpreted as a class name. Did you mean \\\"%s\\\"? Write \\\"\\\\%s\\\"%s to suppress this warning"
phpVersion = "7.0+"
level = "E_COMPILE_WARNING"
exception = ""
code = "<?php

function toggle(boolean $flag): integer {
    return $flag ? 1 : 0;
}

?>"
description = "``boolean``, ``integer`` and ``double`` are the names PHP itself uses internally, and returns from ``gettype()``, for the ``bool``, ``int`` and ``float`` types. They look like legitimate type names, but they were never made valid type declarations; only the short forms are.

Because none of these three words is reserved, PHP does not reject them in a type position: it treats the declaration as the name of a class or interface instead, one that essentially never exists, so any call passes a value of the intended scalar type and still fails with a TypeError.

To catch this common mistake, the compiler recognizes exactly these three words -- and only these three, compared case-sensitively, so ``Boolean`` or ``INTEGER`` are assumed to be genuine class names and do not trigger it -- and emits this warning, naming the short form that was probably intended. It only fires when no class or interface with that exact name has been imported in the current file."
alternative[] = "Replace the alias with the actual scalar type: ``bool`` instead of ``boolean``, ``int`` instead of ``integer``, ``float`` instead of ``double``."
alternative[] = "Prefix the name with a backslash, as in ``\\boolean``, to tell PHP that a class actually called ``boolean`` is meant, which suppresses the warning."
alternative[] = "If a class or interface with that exact name exists in the current namespace, import it with a ``use`` statement so PHP recognizes it, which also suppresses the warning."
related[] = "%s-\"-is-not-a-supported-builtin-type-and-will-be-interpreted-as-a-class-name.-write--\"--%s-\"%s-to-suppress-this-warning"
examples[] = "\"boolean\" will be interpreted as a class name. Did you mean \"bool\"? Write \"\\boolean\" to suppress this warning"
examples[] = "\"integer\" will be interpreted as a class name. Did you mean \"int\"? Write \"\\integer\" to suppress this warning"
examples[] = "\"double\" will be interpreted as a class name. Did you mean \"float\"? Write \"\\double\" to suppress this warning"
tags[] = "surprise"
seeAlso[] = ""
features[] = "type"
