id = "failed-to-evaluate-a-trait-precedence-(%s).-method-of-trait-%s-was-defined-to-be-excluded-multiple-times"
error = "Failed to evaluate a trait precedence (%s). Method of trait %s was defined to be excluded multiple times"
phpVersion = "5.4+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

trait A {
    public function hello() { echo 'A'; }
}

trait B {
    public function hello() { echo 'B'; }
}

class X {
    use A, B {
        A::hello insteadof B, B;
    }
}

?>"
description = "The ``insteadof`` operator resolves a conflict between two or more traits that define a method with the same name: it picks the version to keep, and implicitly excludes that method from the traits listed after ``insteadof``.

Each trait can only be marked as excluded, for a given method, once. Here, ``B`` is listed twice in the same ``insteadof`` clause for ``hello()``, which is redundant: PHP has nothing more to learn from the second mention, and rejects the declaration outright, rather than silently ignoring the duplicate.

The same error also occurs when the same trait ends up excluded twice for the same method through two separate precedence rules, not just within a single ``insteadof`` list."
alternative[] = "Remove the duplicate trait name from the insteadof list."
alternative[] = "Check whether the trait is already excluded for that method by another precedence rule."
