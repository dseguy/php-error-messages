id = "session.sid_length-ini-setting-is-deprecated"
error = "session.sid_length INI setting is deprecated"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

ini_set('session.sid_length', '26');

?>"
description = "``session.sid_length`` used to control the number of characters in a generated session ID, in combination with ``session.sid_bits_per_character``.

Letting this be configurable made it possible to end up with weak, easily-guessable session IDs if the value was lowered too much. PHP 8.4 fixes the format to a 32-character session ID and deprecates the directive; it is only emitted when the value is set to something other than the fixed default of 32."
alternative[] = "Remove ``session.sid_length`` from ``php.ini`` and from the code; PHP now always uses a 32-character session ID."
related[] = "session.sid_bits_per_character-ini-setting-is-deprecated"
examples[] = ""
tags[] = ""
seeAlso[] = ""
features[] = "session"
features[] = "directive"
previous = "session.sid_bits_per_character-ini-setting-is-deprecated"
next = ""
extension[] = "session"
analyzer[] = "none"
changedBehavior[] = "none"
