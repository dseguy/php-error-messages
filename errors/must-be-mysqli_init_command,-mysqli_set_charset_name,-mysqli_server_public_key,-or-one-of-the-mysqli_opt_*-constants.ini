id = "must-be-mysqli_init_command,-mysqli_set_charset_name,-mysqli_server_public_key,-or-one-of-the-mysqli_opt_*-constants"
error = "must be MYSQLI_INIT_COMMAND, MYSQLI_SET_CHARSET_NAME, MYSQLI_SERVER_PUBLIC_KEY, or one of the MYSQLI_OPT_* constants"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

$mysqli = mysqli_init();

mysqli_options($mysqli, 999999, true);

?>"
description = "``mysqli_options()`` (and ``mysqli::options()``) only understand a fixed set of option constants: ``MYSQLI_INIT_COMMAND``, ``MYSQLI_SET_CHARSET_NAME``, ``MYSQLI_SERVER_PUBLIC_KEY``, and the various ``MYSQLI_OPT_*`` constants. Each of these expects a specific value type (string, bool or int), which the function needs to know in order to validate and forward the value correctly.

Before PHP 8.6, passing an option value that ``mysqli_options()`` did not recognize was silently ignored: the call returned ``false`` without telling the caller why. As of PHP 8.6, an unrecognized option now throws a ``ValueError`` instead."
alternative[] = "Pass one of the documented ``MYSQLI_INIT_COMMAND``, ``MYSQLI_SET_CHARSET_NAME``, ``MYSQLI_SERVER_PUBLIC_KEY`` or ``MYSQLI_OPT_*`` constants as the option argument."
related[] = ""
examples[] = "mysqli_options(): Argument #2 ($option) must be MYSQLI_INIT_COMMAND, MYSQLI_SET_CHARSET_NAME, MYSQLI_SERVER_PUBLIC_KEY, or one of the MYSQLI_OPT_* constants"
