id = "directive-'report_memleaks'-is-deprecated"
error = "Directive 'report_memleaks' is deprecated"
phpVersion = "8.5+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

ini_set('report_memleaks', '0');

?>"
description = "``report_memleaks`` controls whether the Zend Memory Manager reports memory leaks detected during an unclean shutdown (for example when a fatal error occurs). This diagnostic is only meaningful on debug builds of PHP, since a production, non-debug build does not track individual allocations well enough to produce a useful report.

Because the directive is only relevant to internal debugging builds and not to application code, it is deprecated as of PHP 8.5.0."
alternative[] = "Remove references to ``report_memleaks`` from ``php.ini`` and from the code; the directive has no practical effect on non-debug builds."
alternative[] = "Use a dedicated memory profiler (e.g. Valgrind, a debug build of PHP) when investigating memory leaks."
