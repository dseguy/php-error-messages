id = "strict_types-declaration-must-not"
error = "strict_types declaration must not"
phpVersion = "7.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

declare(strict_types = 1) {
    var_dump(strlen('abc'));
}

?>"
description = "``declare()`` supports a block form for most directives, such as ``declare(ticks = 1) { ... }``, which scopes the setting to the code inside the block. ``strict_types`` is different: it is a compile-time, whole-file setting, not something that can be toggled for a portion of the script. Because of that, the block form is rejected outright.

The full message reads: ``strict_types declaration must not use block mode``."
alternative[] = "Remove the curly braces, and use ``declare(strict_types = 1);`` as a simple statement."
related[] = "strict_types-declaration-must-be-the-very-first-statement-in-the-script"
related[] = "strict_types-declaration-must-have-0-or-1-as-its-value"
related[] = "strict_types-declaration-must-be"
examples[] = "strict_types declaration must not use block mode"
