id = "usage-of-session.trans_sid_tags-ini-setting-is-deprecated"
error = "Usage of session.trans_sid_tags INI setting is deprecated"
phpVersion = "8.4+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

// Changing it away from its default list of tags triggers the
// deprecation as soon as it's applied.
ini_set('session.trans_sid_tags', 'a=href');

?>"
description = "``session.trans_sid_tags`` lists which HTML tag/attribute pairs (e.g. ``a=href``, ``form=``) PHP rewrites to inject the session ID when trans sid (``session.use_trans_sid``) output rewriting is active. Trans sid -- propagating the session ID through the URL and hidden form fields instead of only a cookie -- is a legacy mechanism being phased out because it leaks session IDs into logs, the Referer header, and shared/bookmarked links.

As of PHP 8.4, setting ``session.trans_sid_tags`` to anything other than its default value (``a=href,area=href,frame=src,form=``) emits this deprecation notice, as part of a broader deprecation of GET/POST (URL-based) session propagation ahead of its removal in PHP 9.0."
alternative[] = "Leave session.trans_sid_tags at its default and keep session.use_trans_sid disabled (its own default), relying on cookies only."
alternative[] = "If trans sid is still required for a specific legacy integration, treat the whole feature -- not just this setting -- as something to migrate away from before PHP 9.0."
related[] = "usage-of-session.trans_sid_hosts-ini-setting-is-deprecated"
related[] = "enabling-session.use_trans_sid-ini-setting-is-deprecated"
examples[] = "ini_set(): Usage of session.trans_sid_tags INI setting is deprecated"
