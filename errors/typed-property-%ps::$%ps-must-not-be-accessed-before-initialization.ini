id = "typed-property-%ps::$%ps-must-not-be-accessed-before-initialization"
error = "Typed property %pS::$%pS must not be accessed before initialization"
phpVersion = "7.4+"
level = "E_ERROR"
exception = "Error"
code = "<?php

class X {
    public int $property;
}

$x = new X;
echo $x->property;

?>"
description = "Typed properties are undefined until they are assigned for the first time, either through a default value or by an explicit assignment. This differs from untyped properties, where reading before assignment simply yields ``NULL``: because a typed property must always hold a value matching its declared type, and ``NULL`` is not a valid value unless the type is nullable, PHP raises an error instead of inventing one.

The coalesce ``??``, ``isset()`` and ``empty()`` operators can be used to check whether the property has been initialized, even though it is not set. Be careful not to confuse an uninitialized property with one that is merely empty."
alternative[] = "Give the property a default value."
alternative[] = "Avoid calling unset() on typed properties, as it resets them to the uninitialized state."
alternative[] = "Assign the property in the constructor."
alternative[] = "Use isset(), empty() or ?? to check the property's status before reading it."
related[] = "typed-property-%s::$%s-must-not-be-accessed-before-initialization"
related[] = "attempt-to-unset-static-property-%s::$%s"
related[] = "object-not-initialized"
examples[] = "Typed property X::$property must not be accessed before initialization"
tags[] = "typed-properties"
seeAlso["Typed property must not be accessed before initialization"] = "https://madewithlove.com/blog/typed-property-must-not-be-accessed-before-initialization/"
features[] = "coalesce"
features[] = "isset"
features[] = "empty"
