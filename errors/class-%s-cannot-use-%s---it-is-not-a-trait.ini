id = "class-%s-cannot-use-%s---it-is-not-a-trait"
error = "Class %s cannot use %s - it is not a trait"
phpVersion = "8.6+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

enum Color {
    case Red;
}

class X {
    use Color;
}

?>"
description = "This message comes from `zend_class_use_internal_traits()`, an internal engine API added to let a C extension attach traits to a class entry it registers, outside of the regular ``use`` statement compiled from PHP source (support for traits on internal classes was added late in the PHP 8.6 development cycle). It fires when one of the class entries passed in is not actually a trait.

There is no PHP userland API that reaches this function, so ordinary application code cannot trigger it; it can only show up as the result of a bug in an extension that registers its own classes and passes the wrong class entry as a trait.

The near-identical runtime message, ``%s cannot use %s - it is not a trait`` (without the leading word ``Class``), is the one produced by an ordinary ``use TraitName;`` inside a PHP class body when ``TraitName`` refers to something other than a trait, such as an interface or an ordinary class."
alternative[] = "If this appears while developing a PHP extension, check the class entries passed to `zend_class_use_internal_traits()` and make sure each one was registered with `ZEND_ACC_TRAIT`."
alternative[] = "If this appears while using a third-party extension, report the issue to its maintainer, since it points to a bug in the extension rather than in the PHP script."
related[] = "%s-cannot-use-%s---it-is-not-a-trait"
examples[] = "x cannot use Color - it is not a trait"
