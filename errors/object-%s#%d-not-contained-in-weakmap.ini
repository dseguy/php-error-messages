id = "object-%s#%d-not-contained-in-weakmap"
error = "Object %s#%d not contained in WeakMap"
phpVersion = "8.0+"
level = "E_ERROR"
exception = "Error"
code = "<?php

$map = new WeakMap();
$object = new stdClass();

// $object was never added to the WeakMap
echo $map[$object];

?>"
description = "This error is thrown when a ``WeakMap`` is read with an object that is not one of its keys. The message gives the class and the object id of the missing key, such as ``stdClass#2``.

Reading a missing key is an error, unlike ``isset()``, which returns ``false`` for it. Removing a missing key with ``unset()`` does nothing and does not raise this error.

Also note that a key is removed from the ``WeakMap`` as soon as the object is destroyed, so reading the map with an object that has already been freed raises this error too."
alternative[] = "Check that the key is in the map with ``isset()`` before reading it: ``if (isset($map[$object])) { ... }``."
alternative[] = "Use ``$map[$object] ?? $default`` to provide a default value when the key is missing. The ``??`` operator does not raise the error."
alternative[] = "Make sure the object was added to the map with ``$map[$object] = $value`` before it is read."
related[] = "weakmap-key-must-be-an-object"
related[] = "cannot-append-to-weakmap"
examples[] = "Object stdClass#2 not contained in WeakMap"
tags[] = "weakmap"
tags[] = "object"
seeAlso[WeakMap] = "https://www.php.net/manual/en/class.weakmap.php"
