id = "reflectionproperty::getdefaultvalue()-for-a-property-without-a-default-value-is-deprecated,"
error = "ReflectionProperty::getDefaultValue() for a property without a default value is deprecated, use ReflectionProperty::hasDefaultValue() to check if the default value exists"
phpVersion = "8.5+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

class X {
    public int $prop;
}

$r = new ReflectionProperty(X::class, 'prop');
var_dump($r->getDefaultValue());

?>"
description = "``ReflectionProperty::getDefaultValue()`` returns ``null`` both when the property genuinely defaults to ``null`` and when the property has no default value at all (such as an uninitialized typed property), so the return value alone cannot tell the two cases apart. Calling it for a property that has no default value is now deprecated in favour of an explicit existence check."
alternative[] = "Call ``ReflectionProperty::hasDefaultValue()`` first, and only call ``getDefaultValue()`` once a default value is confirmed to exist."
related[] = "reflectionclass::getconstant()-for-a-non-existent-constant-is-deprecated,"
examples[] = "ReflectionProperty::getDefaultValue() for a property without a default value is deprecated, use ReflectionProperty::hasDefaultValue() to check if the default value exists"
tags[] = "reflection"
tags[] = "deprecation"
seeAlso[ReflectionProperty::getDefaultValue] = "https://www.php.net/manual/en/reflectionproperty.getdefaultvalue.php"
seeAlso[ReflectionProperty::hasDefaultValue] = "https://www.php.net/manual/en/reflectionproperty.hasdefaultvalue.php"
features[] = "reflection"
features[] = "property"
previous = ""
next = ""
extension[] = "reflection"
analyzer[] = ""
changedBehavior[] = "ReflectionProperty::getDefaultValue"
