id = "cannot-append-to-weakmap"
error = "Cannot append to WeakMap"
phpVersion = "8.0+"
level = "E_ERROR"
exception = "Error"
code = "<?php

$map = new WeakMap();

// A WeakMap is keyed by objects, so there is no next integer key to append to
$map[] = 'Damien';

?>"
description = "``WeakMap`` is a map from objects to values, and each key is an object. Unlike an ``array``, it has no automatic integer index, so the ``[]`` syntax, which appends a new element, cannot be used with it.

To add an entry, give the object that will be the key: ``$map[$object] = $value``."
alternative[] = "Use an object as the key: ``$map[$object] = $value``, instead of ``$map[] = $value``."
alternative[] = "If you need a list of values with integer keys, use a regular ``array`` instead of a ``WeakMap``."
related[] = "weakmap-key-must-be-an-object"
examples[] = "Cannot append to WeakMap"
tags[] = "weakmap"
tags[] = "array"
seeAlso[WeakMap] = "https://www.php.net/manual/en/class.weakmap.php"
features[] = "weakmap"
features[] = "array"
