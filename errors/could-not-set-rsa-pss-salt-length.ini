id = "could-not-set-rsa-pss-salt-length"
error = "Could not set RSA-PSS salt length"
phpVersion = ""
level = ""
exception = ""
code = ""
description = "RSA-PSS is a padding scheme for RSA signatures. It uses a random salt, whose length is set by the signing or verifying code. This error is raised when the requested salt length cannot be applied to the RSA key.

The salt must fit alongside the hash inside the RSA modulus, so a key that is too small for the requested salt length cannot use it. The error is most likely with small keys, or with a salt length that is larger than the hash allows."
alternative[] = "Use an RSA key of at least 2048 bits."
alternative[] = "Set the salt length to the length of the digest, which is the most widely supported choice."
alternative[] = "Check the library or code that sets the salt length, since that is where the requested value comes from."
