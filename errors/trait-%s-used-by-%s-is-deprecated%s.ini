id = "trait-%s-used-by-%s-is-deprecated%s"
error = "Trait %s used by %s is deprecated%S"
phpVersion = "8.5+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

#[\Deprecated(message: 'use LoggerTrait instead', since: '1.0')]
trait DeprecatedLoggingTrait {
    public function log(string $message): void {
        echo $message, PHP_EOL;
    }
}

class Service {
    use DeprecatedLoggingTrait;
}

?>"
description = "PHP 8.4 introduced the ``#[\Deprecated]`` attribute to flag functions, methods and class constants as deprecated. PHP 8.5 extends this to traits: a trait declared with ``#[\Deprecated]`` emits this deprecation notice as soon as another class ``use``-s it, pinpointing the class doing the using.

The optional ``since`` and ``message`` arguments of the attribute are appended to the notice, for example \" since 1.0, use LoggerTrait instead\", to help locate a replacement."
alternative[] = "Stop using the deprecated trait and switch to the alternative mentioned in the deprecation message."
alternative[] = "If you own the trait, keep the ``#[\Deprecated]`` attribute until the trait is actually removed, so callers get a clear migration path."
related[] = "function-%s()-is-deprecated%s"
related[] = "constant-%s-is-deprecated"
related[] = "constant-%s::%s-is-deprecated"
related[] = "cannot-instantiate-trait-%s"
examples[] = "Trait DeprecatedLoggingTrait used by Service is deprecated since 1.0, use LoggerTrait instead"
tags[] = "deprecation"
seeAlso[Deprecated attribute] = "https://www.php.net/manual/en/class.deprecated.php"
features[] = "trait"
features[] = "deprecated"
features[] = "attribute"
previous = ""
next = ""
extension[] = ""
analyzer[] = "none"
changedBehavior[] = "none"
