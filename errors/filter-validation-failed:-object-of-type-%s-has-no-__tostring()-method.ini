id = "filter-validation-failed:-object-of-type-%s-has-no-__tostring()-method"
error = "filter validation failed: object of type %s has no __toString() method"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "Filter\\FilterFailedException"
code = "<?php

filter_var(new stdClass(), FILTER_VALIDATE_EMAIL, FILTER_THROW_ON_FAILURE);

?>"
description = "The filter functions convert their input to a string before applying a filter. If the input is an object without a ``__toString()`` method, that conversion is impossible; normally the function returns ``false`` (or ``null``/the ``default`` option, depending on the flags used). With ``FILTER_THROW_ON_FAILURE`` set, this instead throws ``Filter\\FilterFailedException`` naming the offending class."
alternative[] = "Only pass objects that implement ``__toString()``, or convert the value to a string yourself first."
alternative[] = "Wrap the call in a try/catch and handle ``Filter\\FilterFailedException``."
related[] = "filter-validation-failed:-filter-%s-not-satisfied-by-%s"
related[] = "filter-validation-failed:-not-an-array-(got-%s)"
related[] = "%s::__tostring()-must-return-a-string"
examples[] = "filter validation failed: object of type stdClass has no __toString() method"
tags[] = "filter"
seeAlso[] = ""
features[] = "validation"
previous = "filter-validation-failed:-not-an-array-(got-%s)"
next = ""
extension[] = "filter"
analyzer[] = ""
changedBehavior[] = ""
