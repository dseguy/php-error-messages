id = "the-specified-%s-is-malformed"
error = "The specified %s is malformed"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "Uri\\InvalidUriException"
code = "<?php

use Uri\Rfc3986\Uri;

try {
    $uri = new Uri('not a valid uri');
} catch (\Uri\InvalidUriException $e) {
    echo $e->getMessage();
}

?>"
description = "The native URI extension, introduced in PHP 8.5, throws this exception when the string passed to ``Uri\\Rfc3986\\Uri`` or ``Uri\\WhatWg\\Url`` cannot be parsed as a valid URI/URL at all, and no further diagnostic detail is available to attach to the message. ``%s`` names what was being parsed (``URI`` for the RFC 3986 parser, ``URL`` for the WHATWG parser)."
alternative[] = "Check the input string against the expected URI/URL syntax before parsing it."
alternative[] = "Wrap the constructor call in a try/catch block and report or discard invalid input gracefully."
related[] = "the-specified-%s-is-malformed%s%s%s"
examples[] = "The specified URI is malformed"
examples[] = "The specified URL is malformed"
tags[] = "uri"
seeAlso[] = ""
features[] = "uri"
previous = ""
next = ""
extension[] = "uri"
analyzer[] = ""
changedBehavior[] = ""
