id = "stream-filter-%s-is-never-seekable"
error = "Stream filter %s is never seekable"
phpVersion = "8.6+"
level = "E_WARNING"
exception = ""
code = "<?php

$stream = fopen('php://temp', 'r+');
fwrite($stream, str_repeat('a', 100));
rewind($stream);

stream_filter_append($stream, 'zlib.deflate', STREAM_FILTER_WRITE, ['write_seek_mode' => 'strict']);

fseek($stream, 0);

?>"
description = "PHP 8.6 fixes a long-standing inconsistency (bug #49874) between ``fseek()``/``ftell()`` and stream filters: seeking a stream now checks whether every filter currently attached to the affected chain (read or write) can actually tolerate the requested seek, instead of blindly repositioning the stream and leaving filtered/compressed data out of sync with the raw underlying position.

Some filters, such as ``zlib.deflate`` and ``zlib.inflate``, accept a ``write_seek_mode`` filter parameter controlling how seeks on their write side are handled: ``'preserve'`` (the default, always seekable), ``'reset'`` (seekable only back to the start), or ``'strict'`` (never seekable once data has started flowing through the filter). With ``'strict'`` in effect, any seek attempt now emits this warning and fails, instead of silently succeeding and corrupting the filtered output."
alternative[] = "Don't seek a stream whose filter chain was configured with write_seek_mode => 'strict', or use 'preserve'/'reset' instead if the stream genuinely needs to be seekable."
related[] = "stream-filter-%s-is-seekable-only-to-start-position"
related[] = "stream-filter-seeking-for-%s-failed"
examples[] = "Stream filter zlib.deflate is never seekable"
tags[] = "streams"
tags[] = "stream-filter"
tags[] = "validation"
seeAlso[] = ""
features[] = "stream-filter"
previous = ""
next = ""
extension[] = "stream"
analyzer[] = ""
changedBehavior[] = "Prior to PHP 8.6, fseek() did not consult filter seekability at all: seeking a stream with filters attached always appeared to succeed, even when it left the filter's internal state inconsistent with the new stream position."
