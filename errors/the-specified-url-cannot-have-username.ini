id = "the-specified-url-cannot-have-username"
error = "The specified URL cannot have username"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "Uri\\WhatWg\\InvalidUrlException"
code = "<?php

use Uri\WhatWg\Url;

$url = new Url('file:///path/to/file');

$url = $url->withUsername('root');

?>"
description = "The WHATWG URL Standard, implemented by the ``Uri\\WhatWg\\Url`` class introduced in PHP 8.5, forbids credentials and a port on ``file:`` URLs: a local file path has no notion of an authenticated remote host. Calling ``withUsername()`` on a URL whose scheme is ``file`` therefore throws instead of silently producing an invalid URL."
alternative[] = "Do not set a username on a ``file:`` URL."
alternative[] = "Use a scheme that supports userinfo components, such as ``ftp`` or ``https``, if credentials are actually needed."
related[] = "the-specified-url-cannot-have-password"
related[] = "the-specified-url-cannot-have-port"
examples[] = ""
tags[] = "uri"
seeAlso[] = ""
features[] = "uri"
