id = "stream-error-handler-must-be-a-valid-callback,-%s"
error = "stream error handler must be a valid callback, %s"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "TypeError"
code = "<?php

$context = stream_context_create([
    'stream' => ['error_handler' => 'this is not a callback'],
]);

file_get_contents('https://example.invalid/', false, $context);

?>"
description = "PHP 8.6 adds a ``stream`` context option, ``error_handler``, that receives the ``StreamError[]`` produced by a stream operation through a callback with the signature ``function(array \$errors): void``.

If the supplied value is not actually callable, PHP throws a ``TypeError`` whose message is completed with the specific reason returned by the callable check, for example \"array must have exactly two elements\" or \"function ... does not exist\"."
alternative[] = "Pass a real callable (closure, function name, or [object, method] array) as the error_handler stream context option."
related[] = "stream-context-option-error_mode-must-be-of-type-streamerrormode"
related[] = "stream-context-option-error_store-must-be-of-type-streamerrorstore"
examples[] = "stream error handler must be a valid callback, no array or string given"
examples[] = "stream error handler must be a valid callback, function 'doesNotExist' not found or invalid function name"
tags[] = "streams"
tags[] = "validation"
tags[] = "callback"
