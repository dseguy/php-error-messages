id = "cannot-override-final-%s::__construct()-with-%s::__construct()"
error = "Cannot override final %s::__construct() with %s::__construct()"
phpVersion = "5.0+"
level = "E_ERROR"
exception = ""
code = "<?php

class X {
    final function __construct() {}
}

class Y extends X {
    function __construct() {}
}

?>"
description = "The ``final`` keyword prevents any child class from redeclaring the same method. Constructors are not exempt from this rule: if a parent class marks its ``__construct()`` method as ``final``, no child class may declare its own constructor, even though constructors are otherwise treated differently from regular methods during inheritance checks (their signature is not required to be compatible with the parent's)."
alternative[] = "Remove the ``final`` keyword from the parent constructor."
alternative[] = "Do not declare a constructor in the child class; it will inherit the parent's final constructor automatically."
alternative[] = "Add a differently named factory method in the child class instead of a constructor."
related[] = "cannot-override-final-%s::%s()-with-%s::%s()"
examples[] = "Cannot override final X::__construct() with Y::__construct()"
tags[] = "final"
tags[] = "constructor"
seeAlso[] = ""
