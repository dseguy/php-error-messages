id = "cannot-use-result-of-built-in-function-in-write-context"
error = "Cannot use result of built-in function in write context"
phpVersion = "4.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

$max = &max(1, 2, 3);

?>"
description = "Binding a reference to the return value of a function ($var = &func();) only makes sense if that function itself returns by reference. Built-in, C-implemented functions never do, and unlike a user-defined function, where forgetting the & in the signature merely triggers a notice at run time, the engine can tell this is impossible for an internal function right away, and raises a compile-time error instead."
alternative[] = "Drop the &, and assign the return value normally: $max = max(1, 2, 3);"
