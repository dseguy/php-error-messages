id = "cannot-unbind-$this-of-closure-using-$this,-this-will-be-an-error-in-php-9"
error = "Cannot unbind $this of closure using $this, this will be an error in PHP 9"
phpVersion = "8.5+"
level = "E_WARNING"
exception = ""
code = "<?php

class X {
    public $prop = 'hello';

    public function getClosure() {
        return function () {
            return $this->prop;
        };
    }
}

$x = new X;
$fn = $x->getClosure();
$fn2 = $fn->bindTo(null);
var_dump($fn2);

?>"
description = "A closure literal that references ``$this`` in its body captures the enclosing object when it is created. Rebinding it to ``null`` with ``bindTo()`` or ``Closure::bind()`` would leave the body referencing ``$this`` with nothing bound to it, so the operation is refused.

A closure that does not use ``$this`` in its body can still be unbound safely; the restriction only applies when ``$this`` is actually referenced.

Since PHP 8.5, this operation already emitted an ``E_WARNING`` and the bind silently failed, returning ``null``. It is now deprecated and will become a fatal error in PHP 9.0."
alternative[] = "If the closure needs to run without an object context, remove every use of ``$this`` from its body."
alternative[] = "Keep the closure bound to the object and pass the values it needs as parameters instead of relying on unbinding."
related[] = "cannot-unbind-$this-of-method,-this-will-be-an-error-in-php-9"
related[] = "cannot-bind-an-instance-to-a-static-closure,-this-will-be-an-error-in-php-9"
examples[] = "Cannot unbind $this of closure using $this, this will be an error in PHP 9"
