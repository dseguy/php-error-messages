id = "cannot-use--\"abstract-\"-as-method-modifier-in-trait-alias"
error = "Cannot use \\\"abstract\\\" as method modifier in trait alias"
phpVersion = "5.4+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

trait T {
    public function foo() {}
}

class X {
    use T {
        foo as abstract bar;
    }
}

?>"
description = "The ``as`` clause of a trait ``use`` statement can rename a method, and change its visibility (``public``, ``protected``, ``private``), and, since PHP 8.3, mark it ``final``. It cannot mark the alias ``abstract``, nor ``static``: an alias only renames an existing, concrete method brought in by the trait, it does not declare a new one, so these modifiers make no sense in this context.

This is a compile time check, independent of the class that uses the trait."
alternative[] = "Remove the ``abstract`` modifier from the trait alias."
alternative[] = "Declare an actual abstract method, in the class or in an interface, instead of trying to alias the trait method as abstract."
