id = "void-can-only-be-used-as-a-standalone-type"
error = "Void can only be used as a standalone type"
phpVersion = "8.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function foo(): int|void {}

?>"
description = "``void`` is a special return type, indicating that a function or method returns no useful value. Since it represents the absence of a value, it cannot be combined with other types in a union, nor made nullable: it can only be used on its own, as the sole return type of a function or method."
alternative[] = "Remove the other types, and use ``void`` alone."
alternative[] = "Remove ``void``, and keep the other type(s) alone."
