id = "returning-from-a-finally-block-is-deprecated"
error = "Returning from a finally block is deprecated"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

function getConfig(): array {
    try {
        return loadConfig(); // may throw
    } finally {
        return []; // the exception, or the try's return value, is silently discarded
    }
}

?>"
description = "A ``return`` statement inside a ``finally`` block always wins: it replaces whatever the ``try`` or ``catch`` block was about to return, and it silently swallows any exception that was propagating out of the ``try``. Unlike the other abrupt exits from a ``finally`` block, which PHP already forbids outright (``break``, ``continue`` and ``goto`` out of a ``finally`` are compile errors, and a ``throw`` automatically chains the discarded exception as ``$previous``), ``return`` gave no indication that anything had been dropped.

PHP 8.6 deprecates this pattern. It remains legal for now, but the discarded return value or exception should be treated as a latent bug."
alternative[] = "Move the return statement out of the finally block, into the try or after it."
alternative[] = "If the intent is to override the result deliberately, do so explicitly outside the finally block so the discarded value or exception is visible."
related[] = "jump-out-of-a-finally-block-is-disallowed"
related[] = "jump-into-a-finally-block-is-disallowed"
examples[] = "Returning from a finally block is deprecated"
tags[] = "deprecation"
tags[] = "exceptions"
seeAlso[] = ""
features[] = "try-finally"
previous = ""
next = ""
extension[] = "Core"
analyzer[] = ""
changedBehavior[] = "Previously, returning from a finally block silently discarded any pending exception or return value from the try/catch, with no warning. As of PHP 8.6, doing so emits a deprecation notice."