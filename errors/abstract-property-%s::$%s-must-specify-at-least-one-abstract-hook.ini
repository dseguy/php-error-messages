id = "abstract-property-%s::$%s-must-specify-at-least-one-abstract-hook"
error = "Abstract property %s::$%s must specify at least one abstract hook"
phpVersion = "8.4+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

abstract class X {
    abstract public string $property {
        get { return ''; }
        set { }
    }
}

?>"
description = "An abstract property must have at least one of its hooks declared without a body (abstract). If all hooks have implementations, the property cannot be abstract, as there is nothing left for child classes to implement.

This is a PHP 8.4 language-level restriction enforced for abstract properties with hooks. An abstract property's purpose is to require child classes to provide an implementation, but if all hooks already have bodies, there is no requirement to fulfill."
alternative[] = "Make at least one hook abstract by removing its body block, e.g. change ``get { return ''; }`` to ``get;``."
alternative[] = "Remove the ``abstract`` keyword from the property if all hooks should have implementations."
related[] = "only-hooked-properties-may-be-declared-abstract"
related[] = "abstract-property-hook-cannot-have-body"
related[] = "non-abstract-property-hook-must-have-a-body"
examples[] = "Abstract property x::$property must specify at least one abstract hook"
tags[] = ""
seeAlso[] = ""
features[] = "abstract"
features[] = "property-hook"
