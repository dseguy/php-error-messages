id = "%s::%s-has-#[--override]-attribute"
error = "%s::%s has #[\\\\Override] attribute"
phpVersion = "8.6+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

interface Shape {
    const SIDES = 0;
}

class Square implements Shape {
    #[\Override]
    const SIDES = 4; // Fine, overrides Shape::SIDES

    #[\Override]
    const COLOR = 'blue'; // Fatal error, no matching parent constant
}

?>"
description = "PHP 8.6 extends the ``#[\\Override]`` attribute, previously usable only on methods and properties, to class constants and enum cases, the later being internally a special kind of class constant. It tells the engine that the constant is expected to override a constant of the same name declared in a parent class or an implemented interface, so that the engine can check that this is really the case.

Here, ``Square::COLOR`` is marked as overriding, but ``Shape``, the interface ``Square`` implements, only declares ``SIDES``, not ``COLOR``. Since there is nothing to override, the attribute is meaningless, and PHP reports it as an error at compile time. The full message continues with ', but no matching parent constant exists'.

Only public and protected constants of a parent class or implemented interface satisfy the attribute; private constants do not count. This error is also raised when the class using the attribute has no parent and implements no interface at all."
alternative[] = "Remove the ``#[\\Override]`` attribute."
alternative[] = "Rename the constant, or enum case, to match one declared in a parent class or interface."
alternative[] = "Add a constant with the same name to the parent class or interface."
