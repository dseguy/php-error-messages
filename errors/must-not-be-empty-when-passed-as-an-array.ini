id = "must-not-be-empty-when-passed-as-an-array"
error = "must not be empty when passed as an array"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ValueError"
code = "<?php

$snmp = new SNMP(SNMP::VERSION_2c, 'localhost', 'public');

$snmp->get([]);

?>"
description = "``SNMP::get()``, ``::getnext()``, ``::walk()``, and ``::set()`` accept ``$objectId`` as either a single string or an array of object IDs. An empty array carries no object IDs at all, so there is nothing for the query to operate on.

As of PHP 8.6, passing an empty array throws a ``ValueError``, instead of the extension emitting a global error and returning false without saying which argument was the problem."
alternative[] = "Pass at least one object ID, either as a string or as a non-empty array, to SNMP::get()/getnext()/walk()/set()."
related[] = "must-contain-a-type-for-object-id-%s"
related[] = "must-contain-a-value-for-object-id-%s"
examples[] = "SNMP::get(): Argument #1 ($objectId) must not be empty when passed as an array"
examples[] = "SNMP::set(): Argument #1 ($objectId) must not be empty when passed as an array"
tags[] = "snmp"
tags[] = "networking"
tags[] = "validation"
seeAlso[] = ""
features[] = "snmp-query"
