id = "syntax-error,-unexpected-variable-\"$%s\",-expecting-\")\""
error = "syntax error, unexpected variable \"$%s\", expecting \")\""
phpVersion = "7.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

function foo($a $b) {}

?>"
description = "In a function, method or closure signature, each parameter must be separated from the next one by a comma. Here, the comma between ``$a`` and ``$b`` is missing, so once PHP has parsed ``$a`` as a complete parameter, it expects either another comma or the closing parenthesis of the argument list; instead it finds another variable."
alternative[] = "Add the missing comma between the two parameters."
alternative[] = "Remove the extra variable if it was left over from editing."
related[] = "syntax-error,-unexpected-variable-\"$task\",-expecting-\")\""
related[] = "syntax-error,-unexpected-token-\")\",-expecting-variable"
examples[] = "syntax error, unexpected variable \"$b\", expecting \")\""
tags[] = "syntax-error"
