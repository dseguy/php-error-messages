id = "default-value-for-property-of-type-%s-may-not-be-null.-use-the-nullable-type-%s-to-allow-null-default-value"
error = "Default value for property of type %s may not be null. Use the nullable type %s to allow null default value"
phpVersion = "7.4+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class X
{
    public int $value = null;
}

?>"
description = "Typed properties can have a default value, but that default value must match the declared type. ``null`` is only a valid default when the type is explicitly nullable, written with a leading ``?``, such as ``?int``.

Without the ``?``, a scalar or class type like ``int`` or ``X`` does not accept ``null``, even as a default value that is never read before being overwritten."
alternative[] = "Make the property type nullable, for example ``?int`` instead of ``int``."
alternative[] = "Remove the default value, and initialize the property in the constructor instead."
alternative[] = "Use a non-null default value that matches the declared type."
related[] = "readonly-property-%s::$%s-cannot-have-default-value"
related[] = "typed-property-%s::$%s-must-not-be-accessed-before-initialization"
related[] = "property-%s::$%s-cannot-have-type-%s"
examples[] = "Default value for property of type int may not be null. Use the nullable type ?int to allow null default value"
tags[] = "property"
tags[] = "type"
seeAlso[] = ""
features[] = "typed-property"
features[] = "nullable"
