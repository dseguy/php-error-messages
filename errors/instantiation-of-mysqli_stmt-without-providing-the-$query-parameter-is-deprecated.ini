id = "instantiation-of-mysqli_stmt-without-providing-the-$query-parameter-is-deprecated"
error = "Instantiation of mysqli_stmt without providing the $query parameter is deprecated"
phpVersion = "8.6+"
level = "E_DEPRECATED"
exception = ""
code = "<?php

$link = mysqli_connect('localhost', 'my_user', 'my_password', 'world');

$stmt = new mysqli_stmt($link);

?>"
description = "``mysqli_stmt``'s constructor accepts an optional ``$query`` string, which, when given, prepares the statement immediately. Omitting it produces an object that is not fully initialized: most of its properties and methods throw until ``prepare()`` is called explicitly, which is a confusing two-step state for a class whose entire purpose is to represent a prepared statement. PHP 8.6 deprecates constructing (or calling ``mysqli_stmt_init()`` / ``mysqli::stmt_init()``) without a query."
alternative[] = "Pass the SQL statement directly to the constructor: ``new mysqli_stmt($link, $query)``, or use ``mysqli_prepare()`` / ``$mysqli->prepare()``."
alternative[] = "If you need the two-step flow, call ``$stmt->prepare($query)`` immediately after construction to avoid using the object while uninitialized."
related[] = ""
examples[] = ""
tags[] = "mysqli"
tags[] = "deprecation"
