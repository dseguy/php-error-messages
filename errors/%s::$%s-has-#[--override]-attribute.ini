id = "%s::$%s-has-#[--override]-attribute"
error = "%s::$%s has #[\\\\Override] attribute"
phpVersion = "8.5+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

class X {
    public int $a = 1;
}

class Y extends X {
    #[\Override]
    public int $b = 2;
}

?>"
description = "PHP 8.5 extends the ``#[\\Override]`` attribute, previously usable only on methods, so that it can also be applied to properties. It tells the engine that the property is expected to override a property of the same name declared in a parent class or an implemented interface, so that the engine can check that this is really the case.

Here, ``Y::$b`` is marked as overriding, but ``X`` (the parent of ``Y``) has no ``$b`` property at all -- only ``$a``. Since there is nothing to override, the attribute is meaningless, and PHP reports it as an error at compile time. The full message continues with ', but no matching parent property exists'.

This error is also raised when the class using the attribute has no parent at all, or when the property is declared in a trait whose using class has no matching parent property."
alternative[] = "Remove the ``#[\\Override]`` attribute."
alternative[] = "Rename the property to match the name used by the parent class or interface."
alternative[] = "Add the property, with the same name, to the parent class."
