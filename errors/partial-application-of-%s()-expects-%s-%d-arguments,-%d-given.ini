id = "partial-application-of-%s()-expects-%s-%d-arguments,-%d-given"
error = "Partial application of %s() expects %s %d arguments, %d given"
phpVersion = "8.6+"
level = "E_ERROR"
exception = "ArgumentCountError"
code = "<?php

function add($a, $b, $c) {
    return $a + $b + $c;
}

$partial = add(1, ?);

?>"
description = "PHP 8.6 introduces partial function application: a ``?`` in an argument position stands in for a value to be supplied later, and turns the call into a ``Closure`` bound to whichever arguments were already given. The placeholder ``...`` on its own captures all of a function's still-missing required parameters instead, but a single ``?`` does not, so the call must still provide at least one argument slot (a value or a ``?``) for every required parameter.

Here, add() requires 3 arguments, but the partial application supplies only 2 slots (the value ``1`` and one ``?``), so PHP rejects it as underspecified rather than silently creating a closure that would itself fail as soon as it were called."
alternative[] = "Provide one argument slot (a value or a ? placeholder) for every required parameter, or replace the trailing ? with ... to defer all remaining required parameters at once: add(1, ...)."
related[] = "partial-application-of-%s()-expects-at-most-%d-arguments,-%d-given"
related[] = "cannot-combine-partial-application-and-unpacking"
examples[] = "Partial application of add() expects exactly 3 arguments, 2 given"
