id = "cannot-use-[]-for-unsetting"
error = "Cannot use [] for unsetting"
phpVersion = "4.0+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

$array = [1, 2, 3];
unset($array[]);

?>"
description = "unset() removes a specific, existing element identified by an explicit key. The empty-bracket append syntax ($array[]) only has meaning in a write context, where it picks the next available integer key to create a new element; there is no such \"next element\" to remove, so combining the two is rejected at compile time."
alternative[] = "Pass an explicit key to unset(), e.g. unset($array[2]);."
related[] = "cannot-append-to-$globals"
examples[] = ""
tags[] = ""
seeAlso[] = ""
features[] = "unset"
