id = "must-be-sodium_crypto_pwhash_saltbytes-bytes-long"
error = "must be SODIUM_CRYPTO_PWHASH_SALTBYTES bytes long"
phpVersion = "7.2+"
level = "E_ERROR"
exception = "SodiumException"
code = "<?php

// The salt must be exactly SODIUM_CRYPTO_PWHASH_SALTBYTES (16) bytes long
$key = sodium_crypto_pwhash(
    16,
    'password',
    'short',
    SODIUM_CRYPTO_PWHASH_OPSLIMIT_INTERACTIVE,
    SODIUM_CRYPTO_PWHASH_MEMLIMIT_INTERACTIVE
);

?>"
description = "``sodium_crypto_pwhash()`` derives a key from a password using Argon2i, and it needs a salt as its third argument. The salt must be exactly ``SODIUM_CRYPTO_PWHASH_SALTBYTES`` bytes long, which is 16 bytes. Any other length throws a ``SodiumException``.

The salt should be random and unique for each password. Generate it with ``random_bytes(SODIUM_CRYPTO_PWHASH_SALTBYTES)``, and store it next to the derived key, since the same salt is needed to derive the key again."
alternative[] = "Generate the salt with ``random_bytes(SODIUM_CRYPTO_PWHASH_SALTBYTES)``, so its length always matches."
alternative[] = "If you do not need to manage the salt yourself, use ``sodium_crypto_pwhash_str()``. It creates the salt and stores it inside the returned hash string."
related[] = "must-be-sodium_crypto_pwhash_scryptsalsa208sha256_saltbytes-bytes-long"
examples[] = "sodium_crypto_pwhash(): Argument #3 ($salt) must be SODIUM_CRYPTO_PWHASH_SALTBYTES bytes long"
tags[] = "password"
