id = "cannot-declare-const-%s-because"
error = "Cannot declare const %s because"
phpVersion = "5.6+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

use const App\FOO as BAR;

const BAR = 42;

?>"
description = "This error is the constant counterpart of the ``use`` collision error raised for classes and functions: it fires when a top-level ``const`` declaration reuses a name that was already brought into the current file through a ``use const ... as ...`` import.

The full message reads: ``Cannot declare const %s because the name is already in use``."
alternative[] = "Rename the ``const`` declaration."
alternative[] = "Change the alias used in the ``use const`` import."
related[] = "cannot-use%s-%s-as-%s-because-the-name-is-already-in-use"
related[] = "cannot-redeclare-constant-'%s'"
examples[] = "Cannot declare const BAR because the name is already in use"
