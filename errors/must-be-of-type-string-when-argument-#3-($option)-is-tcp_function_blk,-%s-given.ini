id = "must-be-of-type-string-when-argument-#3-($option)-is-tcp_function_blk,-%s-given"
error = "must be of type string when argument #3 ($option) is TCP_FUNCTION_BLK, %s given"
phpVersion = "8.5+"
level = "E_ERROR"
exception = "TypeError"
code = "<?php

$socket = socket_create(AF_INET, SOCK_STREAM, SOL_TCP);

socket_set_option($socket, IPPROTO_TCP, TCP_FUNCTION_BLK, 123);

?>"
description = "``TCP_FUNCTION_BLK`` (FreeBSD only) selects the pluggable TCP stack to use for a connection, identified by its name. ``socket_set_option()`` requires ``$value`` (argument #4) to be a string for this option; any other type, such as the integer above, is rejected. The string must also be free of null bytes and shorter than the platform's ``TCP_FUNCTION_NAME_LEN_MAX``, which are reported as separate ``ValueError`` cases."
alternative[] = "Pass the TCP stack name as a string, without embedded null bytes."
alternative[] = "List available stacks via ``net.inet.tcp.functions_available`` on FreeBSD."
related[] = "must-be-of-type-string-when-argument-#3-($option)-is-tcp_congestion,-%s-given"
examples[] = "socket_set_option(): Argument #4 ($value) must be of type string when argument #3 ($option) is TCP_FUNCTION_BLK, int given"
tags[] = "sockets"
tags[] = "networking"
tags[] = "validation"
seeAlso[] = ""
features[] = "socket-options"
previous = "must-be-of-type-string-when-argument-#3-($option)-is-tcp_congestion,-%s-given"
