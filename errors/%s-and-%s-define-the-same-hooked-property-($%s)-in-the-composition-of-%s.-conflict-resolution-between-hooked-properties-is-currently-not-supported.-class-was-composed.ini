id = "%s-and-%s-define-the-same-hooked-property-($%s)-in-the-composition-of-%s.-conflict-resolution-between-hooked-properties-is-currently-not-supported.-class-was-composed"
error = "%s and %s define the same hooked property ($%s) in the composition of %s. Conflict resolution between hooked properties is currently not supported. Class was composed"
phpVersion = "8.4+"
level = "E_COMPILE_ERROR"
exception = ""
code = "<?php

trait T {
    public $prop {
        get { echo __METHOD__, PHP_EOL; }
        set { echo __METHOD__, PHP_EOL; }
    }
}

class C {
    use T;

    public $prop {
        get { echo __METHOD__, PHP_EOL; }
        set { echo __METHOD__, PHP_EOL; }
    }
}

?>"
description = "When a class and a trait it uses both declare hooks for a property of the same name, PHP cannot merge the two definitions, even when the hooks are effectively identical.

For plain properties, a trait property is simply overridden by an identically named property in the using class, as long as the two are type-compatible. For methods, name clashes between traits can be settled with the ``insteadof`` and ``as`` operators. Hooked properties have neither mechanism: there is no way to tell PHP which of the two conflicting sets of hooks (``get``/``set``) should win, so the compiler always raises a fatal error instead of picking one silently.

The same restriction applies when two different traits, both used by the same class, declare hooks for a property with the same name."
alternative[] = "Rename the property in the trait or in the class so that they no longer collide."
alternative[] = "Remove the hooks from the property in the class, and rely solely on the trait's hooks."
alternative[] = "Remove the hooks from the property in the trait, and only declare hooks in the class."
alternative[] = "Move the shared behaviour into a method that both the trait and the class hooks can call, instead of duplicating the hooks."
related[] = "%s-and-%s-define-the-same-constant-(%s)-in-the-composition-of-%s.-however,-the-definition-differs-and-is-considered-incompatible.-class-was-composed"
related[] = "cannot-redeclare-property-hook"
examples[] = "C and T define the same hooked property ($prop) in the composition of C. Conflict resolution between hooked properties is currently not supported. Class was composed"
tags[] = "trait"
seeAlso[] = ""
features[] = "trait"
features[] = "property-hook"
